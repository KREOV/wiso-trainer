<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crashkurs IHK</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crashkurs IHK">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DDF0FF">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>

/* Ein helles Spielbrett: Weltkarte mit fünf Inseln und Boss, darunter Spielrunden mit Herzen, Serie und XP */
:root{
  --bg1:#DDF0FF; --bg2:#FFE9F7; --ink:#1E1B4B; --muted:#6B6893; --card:#FFFFFF; --line:#E6E3F5;
  --ok:#22C55E; --ok-d:#15803D; --ok-bg:#E8FBEF; --bad:#F43F5E; --bad-d:#BE123C; --bad-bg:#FFE8EC;
  --gold:#FFC531; --gold-d:#D99A00; --pri:#6D4AFF; --pri-d:#4B2DD6;
  --w1:#FF5A5F; --w1d:#D63A40; --w2:#3B82F6; --w2d:#1D5FD0; --w3:#10B981; --w3d:#0A8A60; --w4:#A855F7; --w4d:#7E2FD0; --w5:#FF9F1C; --w5d:#D27A00; --w6:#06B6D4; --w6d:#0E7490;
  --f-d:"Fredoka","Nunito",system-ui,sans-serif; --f-b:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1)}
body{min-height:100vh;min-height:100dvh}
body{margin:0;font-family:var(--f-b);font-weight:700;color:var(--ink);background:transparent;font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(14px,calc(env(safe-area-inset-top,0px) + 8px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
/* Kopfleiste */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.badge{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 var(--line);font-family:var(--f-d);font-weight:600;font-size:17px;white-space:nowrap}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.lvl .ring{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-size:20px;box-shadow:0 4px 0 var(--pri-d);flex:none}
.xpbar{flex:1;height:14px;background:var(--card);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF8A00);border-radius:99px;transition:width .5s}
.snd{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:20px}
/* Karte */
.hero{text-align:center;margin:6px 0 4px}
.hero h1{font-family:var(--f-d);font-size:40px;margin:0;line-height:1;letter-spacing:.5px}
.hero p{margin:6px 0 0;color:var(--muted);font-size:16px}
.map{position:relative;display:flex;flex-direction:column;gap:26px;padding:24px 0 10px}
.node{display:flex;align-items:center;gap:16px;width:min(100%,520px)}
.node:nth-child(odd){align-self:flex-start;margin-left:6%} .node:nth-child(even){align-self:flex-end;margin-right:6%;flex-direction:row-reverse;text-align:right}
.orb{width:104px;height:104px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 8px 0 var(--cd),0 14px 24px rgba(30,27,75,.18);color:#fff;font-family:var(--f-d);font-size:42px;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .12s}
.orb:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cd)}
.orb .ic{line-height:1}
.node .info{min-width:0}
.node .name{font-family:var(--f-d);font-size:22px;line-height:1.1}
.stars{font-size:22px;letter-spacing:2px;margin-top:4px;color:#D7D3EE}
.stars b{color:var(--gold);font-weight:inherit}
.node .sub{font-size:14px;color:var(--muted)}
.pulse::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--c);opacity:.5;animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.18);opacity:0}}
.boss .orb{width:124px;height:124px;background:linear-gradient(150deg,#2B2464,#5B3BD6);box-shadow:0 8px 0 #1A1540,0 14px 24px rgba(30,27,75,.25);font-size:50px}
.path{position:absolute;inset:0;pointer-events:none;z-index:-1}
/* Sheet */
.dim{position:fixed;inset:0;cursor:pointer;background:rgba(30,27,75,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);width:min(100%,760px);border-radius:28px 28px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--f-d);font-size:28px;margin:0 0 4px}
.btn{display:block;width:100%;border-radius:18px;padding:16px 18px;font-family:var(--f-d);font-size:21px;font-weight:600;background:var(--c,var(--pri));color:#fff;box-shadow:0 6px 0 var(--cd,var(--pri-d));transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd,var(--pri-d))}
.btn.light{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:#D9D6EA;box-shadow:0 6px 0 #C2BEDA;color:#fff}
.btns{display:flex;flex-direction:column;gap:14px;margin-top:16px}
/* Spiel */
.bar{display:flex;align-items:center;gap:12px;margin:calc(-1 * max(14px,calc(env(safe-area-inset-top,0px) + 8px))) -16px 14px;padding:10px 16px;position:sticky;top:0;z-index:15;background:rgba(238,240,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding-top:max(10px,calc(env(safe-area-inset-top,0px) + 6px))}
.x{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px;box-shadow:0 4px 0 var(--line);flex:none}
.prog{flex:1;height:18px;background:var(--card);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 var(--line)}
.prog i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.hearts{font-size:24px;letter-spacing:1px;white-space:nowrap;color:var(--bad)}
.hearts .off{color:#D7D3EE}
.combo{font-family:var(--f-d);background:var(--gold);color:var(--ink);border-radius:12px;padding:4px 10px;font-size:16px;box-shadow:0 3px 0 var(--gold-d)}
.qcard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 8px 0 var(--line)}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:10px;padding:4px 12px;font-size:14px;font-family:var(--f-d);font-weight:600;margin-bottom:10px}
.qtext{font-size:19px;line-height:1.5;font-weight:700}
.qtext b{font-weight:900}
.qtext ul{margin:8px 0;padding-left:22px}
.qtext table{border-collapse:separate;border-spacing:0;margin:10px 0;font-size:16px;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.qtext td,.qtext th{padding:7px 12px;text-align:right;border-bottom:2px solid var(--line)}
.qtext th{background:#F4F2FF}
.tbl{overflow-x:auto}
.ask{margin-top:12px;font-family:var(--f-d);font-size:21px;font-weight:600;color:var(--c)}
.answers{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--line);font-size:18px;font-weight:800;transition:transform .08s}
.ans:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.ans .n{width:38px;height:38px;border-radius:12px;background:#F1EFFD;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);flex:none;font-size:18px}
.ans.sel{border-color:var(--c);box-shadow:0 5px 0 var(--cd);background:#FAF9FF}
.ans.sel .n{background:var(--c);color:#fff}
.ans.right{border-color:var(--ok);box-shadow:0 5px 0 var(--ok-d);background:var(--ok-bg)} .ans.right .n{background:var(--ok);color:#fff}
.ans.wrong{border-color:var(--bad);box-shadow:0 5px 0 var(--bad-d);background:var(--bad-bg)} .ans.wrong .n{background:var(--bad);color:#fff}
.numrow{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.numrow input{font-family:var(--f-d);font-size:30px;width:240px;max-width:100%;padding:12px 16px;border-radius:18px;border:3px solid var(--c);color:var(--ink);background:#FAF9FF;font-weight:600}
.numrow .u{font-family:var(--f-d);font-size:24px}
.picked .ans{border-style:dashed}
.lbl{font-size:14px;color:var(--muted);margin-top:14px}
.check{margin-top:18px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
/* Rückmeldung */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.fb .in{width:min(100%,760px);border-radius:28px 28px 0 0;padding:20px 22px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-height:70vh;overflow:auto}
.fb.ok .in{background:var(--ok-bg);border-top:5px solid var(--ok)} .fb.bad .in{background:var(--bad-bg);border-top:5px solid var(--bad)}
.fb h3{font-family:var(--f-d);font-size:28px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb.ok h3{color:var(--ok-d)} .fb.bad h3{color:var(--bad-d)}
.xp{font-size:18px;background:var(--gold);color:var(--ink);border-radius:10px;padding:2px 10px;box-shadow:0 3px 0 var(--gold-d)}
.why{font-size:17px;line-height:1.5;margin-top:8px;font-weight:700}
.why b{font-weight:900}
.space{height:58vh}
/* Spickzettel */
.lern .card{border-radius:18px;padding:14px 16px;background:#F7F5FF;border-left:8px solid var(--c);margin-top:12px}
.lern .card h3{font-family:var(--f-d);margin:0 0 4px;font-size:20px}
.lern .card p{margin:4px 0;font-size:16px;line-height:1.5}
.lern .formel{margin-top:12px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;text-align:center;font-family:var(--f-d);font-size:17px}
/* Ende */
.end{text-align:center;padding-top:10px}
.big3{font-size:76px;letter-spacing:6px;color:#D7D3EE;line-height:1.1}
.big3 b{color:var(--gold);font-weight:inherit;display:inline-block;animation:pop .5s backwards}
.big3 b:nth-child(2){animation-delay:.25s} .big3 b:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:none}}
.end h1{font-family:var(--f-d);font-size:40px;margin:6px 0}
.statrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--card);border-radius:18px;padding:12px 18px;box-shadow:0 5px 0 var(--line);min-width:110px}
.stat b{display:block;font-family:var(--f-d);font-size:30px}
.stat span{font-size:14px;color:var(--muted)}
.note{font-family:var(--f-d);font-size:110px;line-height:1;color:var(--pri)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (max-width:520px){.orb{width:84px;height:84px;font-size:34px}.boss .orb{width:100px;height:100px}.hero h1{font-size:32px}.node .name{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet{cursor:default}
*{-webkit-tap-highlight-color:transparent}

/* Echte Aufgaben */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.tags .tag{margin:0}
.tag.src{background:#EEF0FF;color:var(--ink)} .tag.typ{background:var(--ink)}
.sit{background:#F6F5FF;border-radius:16px;padding:12px 14px;margin:8px 0 10px;font-size:17px;line-height:1.5;color:#3A376B;border-left:6px solid var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;box-shadow:0 4px 0 var(--line);font-size:16px;font-weight:800;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%}
.chip .n,.row .slot,.sitem .n{width:36px;height:36px;border-radius:11px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);flex:none;font-size:18px}
.chip.sel{border-color:var(--c);box-shadow:0 4px 0 var(--cd);transform:translateY(-3px)}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(-3deg) scale(1.06);box-shadow:0 14px 30px rgba(30,27,75,.3)!important;border-color:var(--c)!important;margin:0}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.row{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:3px dashed #CFCBEA;border-radius:18px;padding:12px 14px;font-size:17px;font-weight:800}
.row .slot{background:#F1EFFD;color:var(--muted);width:auto;min-width:44px;padding:0 8px;height:44px;font-size:20px;gap:6px}
.row.filled{border-style:solid;border-color:var(--c)} .row.filled .slot{background:var(--c);color:#fff}
.row.hover{background:#F4F2FF;border-color:var(--c);transform:scale(1.02)}
.row.right{border:3px solid var(--ok);background:var(--ok-bg)} .row.right .slot{background:var(--ok);color:#fff}
.row.wrong{border:3px solid var(--bad);background:var(--bad-bg)} .row.wrong .slot{background:var(--bad);color:#fff}
.row .slot s{opacity:.7;font-size:15px}
.pop{animation:pop2 .3s}@keyframes pop2{50%{transform:scale(1.04)}}
.sortlist{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.sitem{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 5px 0 var(--line);font-size:17px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative}
.sitem .t{flex:1;min-width:0}
.sitem .grip{font-size:22px;color:var(--muted);flex:none}
.sitem .mv{display:flex;flex-direction:column;gap:4px;flex:none}
.sitem .mv button{width:40px;height:30px;border-radius:9px;background:#F1EFFD;font-size:14px;color:var(--ink)}
.sitem.drag{z-index:5;border-color:var(--c);box-shadow:0 14px 28px rgba(30,27,75,.25);cursor:grabbing;transition:none}
.sitem.right{border-color:var(--ok);background:var(--ok-bg)} .sitem.right .n{background:var(--ok)}
.sitem.wrong{border-color:var(--bad);background:var(--bad-bg)} .sitem.wrong .n{background:var(--bad)}
.btn.exam{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.btn.exam small{font-family:var(--f-b);font-size:14px;color:var(--muted);font-weight:700}
.fehler{text-align:left;max-width:620px;margin:10px auto 0}
.fehler h3{font-family:var(--f-d);font-size:22px;margin:0 0 8px}
.fz{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;border-left:7px solid var(--c);box-shadow:0 4px 0 var(--line);font-size:15px;line-height:1.45}
.fz b{display:block;font-size:16px;margin-bottom:2px}
/* ===== Crashkurs IHK: Liquid Glass, Pfad, Figuren, Effekte ===== */
html{background:linear-gradient(160deg,#CFE6FF 0%,#E9DDFF 45%,#FFDDF0 100%);background-color:#DDE6FF}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.75;animation:blob 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:#7C5CFF;left:-12vmax;top:-10vmax}
.blobs i:nth-child(2){width:40vmax;height:40vmax;background:#22D3EE;right:-14vmax;top:20vh;animation-duration:22s}
.blobs i:nth-child(3){width:38vmax;height:38vmax;background:#FF5FA2;left:10vw;bottom:-16vmax;animation-duration:26s}
.blobs i:nth-child(4){width:26vmax;height:26vmax;background:#FFC531;right:8vw;bottom:10vh;animation-duration:20s;opacity:.55}
@keyframes blob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-4vh) scale(1.12)}100%{transform:translate(-5vw,5vh) scale(.92)}}
.glass,.qcard,.sheet,.fb .in,.badge,.snd,.x,.unit,.stat,.fz,.btn.light{
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.28));
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25),0 10px 34px rgba(40,30,110,.16);position:relative}
.qcard::before,.sheet::before,.unit::before,.fb .in::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 10% 0%,rgba(255,255,255,.75),transparent 55%),radial-gradient(80% 40% at 100% 100%,rgba(255,255,255,.25),transparent 60%)}
.qcard>*,.sheet>*,.unit>*,.fb .in>*{position:relative}
.qcard{border-radius:30px}
.sheet{border-radius:32px 32px 0 0}
.bar{background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.6)}
.top{position:sticky;top:0;z-index:15;margin:-14px -16px 14px;padding:10px 16px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.6)}
.ans,.chip,.row,.sitem{background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.55));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--c,var(--pri));position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
.btn.light::after{display:none}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
/* Titel */
.hero h1{font-size:44px;background:linear-gradient(90deg,#4B2DD6,#FF3D7F,#FF9F1C);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(255,255,255,.8))}
.hero .claim{display:inline-block;margin-top:6px;font-family:var(--f-d);font-size:15px;background:#1E1B4B;color:#FFD23F;padding:4px 12px;border-radius:99px;transform:rotate(-2deg)}
/* Pfad */
.unit{border-radius:26px;padding:16px 18px;margin:26px 0 8px;display:flex;align-items:center;gap:14px;overflow:hidden}
.unit .uic{width:58px;height:58px;border-radius:18px;background:var(--c);color:#fff;font-family:var(--f-d);font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--cd);flex:none}
.unit .ut{flex:1;min-width:0}.unit .uk{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.unit .un{font-family:var(--f-d);font-size:23px;line-height:1.1}.unit .us{font-size:14px;color:var(--muted)}
.unit .ub{width:auto;padding:10px 14px;font-size:16px;flex:none;border-radius:14px}

<script>
/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const fmt=(n,d=0)=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const DAY=86400000;
const mkD=(y,m,d)=>new Date(Date.UTC(y,m-1,d));
const addD=(dt,n)=>new Date(dt.getTime()+n*DAY);
const fD=dt=>String(dt.getUTCDate()).padStart(2,'0')+'.'+String(dt.getUTCMonth()+1).padStart(2,'0')+'.'+dt.getUTCFullYear();
const fT=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+' Uhr';
const NAMEN=['Lena','Tim','Mia','Jonas','Sara','Luca','Emma','Noah','Lea','Ben','Hannah','Paul','Elif','Max','Nele','Finn'];
const norm=o=>typeof o==='string'?{t:o}:o;
/* MC: richtige Antwort plus bis zu 4 falsche, gemischt */
function mc(text,correct,wrongs,why,ask){
  const c=norm(correct); const seen=new Set([c.t]); const w=sample(wrongs.map(norm).filter(x=>!seen.has(x.t)&&seen.add(x.t)),4);
  const opts=shuffle([c,...w]); return {typ:'mc',text,ask,opts,ok:opts.indexOf(c),why};
}
function num(text,answer,tol,unit,why,ask){return {typ:'num',text,ask,answer,tol,unit,why}}

/* ---------- Themen ---------- */
const TH={
 ezb:{nr:1,name:'EZB und Geldpolitik',kurz:'EZB',c:'var(--w1)',freq:'9 von 9'},
 el:{nr:2,name:'Markt und Preiselastizität',kurz:'Markt',c:'var(--w2)',freq:'9 von 9'},
 kon:{nr:3,name:'Konjunktur',kurz:'Konjunktur',c:'var(--w3)',freq:'9 von 9'},
 recht:{nr:4,name:'Recht: Alter, Besitz, Verträge',kurz:'Recht',c:'var(--w4)',freq:'9 von 9'},
 zahl:{nr:5,name:'Jugendschutz, Mutterschutz, Wahlen',kurz:'Zahlen',c:'var(--w5)',freq:'7 von 9'}
};

/* ---------- Generatoren: EZB ---------- */
const RESTR=['Die EZB erhöht die Leitzinsen.','Die EZB verkauft Wertpapiere am offenen Markt.','Die EZB erhöht den Mindestreservesatz.'];
const EXPAN=['Die EZB senkt die Leitzinsen.','Die EZB kauft in großem Umfang Staatsanleihen an.','Die EZB senkt den Mindestreservesatz.','Die EZB teilt bei den Hauptrefinanzierungsgeschäften mehr Liquidität zu.'];
const EZB_SAETZE=[
 {t:'Vorrangiges Ziel der EZB ist die Preisstabilität. Angestrebt wird mittelfristig eine Inflationsrate von 2 %.',ok:1,why:'Das steht so im EU-Vertrag. Die 2 % sind das Ziel der EZB.'},
 {t:'Der Zinssatz der Spitzenrefinanzierungsfazilität bildet die Obergrenze für den Tagesgeldzins.',ok:1,why:'Teurer als dort leiht sich keine Bank über Nacht Geld. Deshalb ist es die Obergrenze.'},
 {t:'Der Zinssatz der Einlagefazilität bildet die Untergrenze für den Tagesgeldzins.',ok:1,why:'Weniger als dort bekommt keine Bank für ihr Geld, sie würde es sonst bei der EZB parken. Deshalb ist es die Untergrenze.'},
 {t:'Beim holländischen Zinstender erhalten alle Banken die Liquidität zum niedrigsten noch zugeteilten Zinssatz.',ok:1,why:'Holländisch heißt: ein einheitlicher Satz für alle, und zwar der niedrigste, der noch zum Zug kommt.'},
 {t:'Beim amerikanischen Zinstender zahlt jede Bank den Zinssatz, den sie selbst geboten hat.',ok:1,why:'Amerikanisch heißt: jeder zahlt sein eigenes Gebot.'},
 {t:'Das Mindestreserve-Soll muss im Durchschnitt der Erfüllungsperiode erfüllt sein.',ok:1,why:'Es zählt der Durchschnitt, nicht jeder einzelne Tag. An einzelnen Tagen darf das Guthaben darunter liegen.'},
 {t:'Das Eurosystem besteht aus der EZB und den nationalen Zentralbanken der Euro-Länder.',ok:1,why:'Eurosystem = EZB plus Notenbanken der Länder mit Euro. Das ESZB umfasst zusätzlich alle anderen EU-Notenbanken.'},
 {t:'Vorrangiges Ziel der EZB ist die Vollbeschäftigung im Euroraum.',ok:0,why:'Falsch. Vorrangiges Ziel ist die Preisstabilität. Beschäftigung ist kein Hauptziel der EZB.'},
 {t:'Die EZB strebt eine Inflationsrate von 0 % an.',ok:0,why:'Falsch. Das Ziel sind 2 %. Bei 0 % droht leicht eine Deflation.'},
 {t:'Der Zinssatz der Einlagefazilität bildet die Obergrenze für den Tagesgeldzins.',ok:0,why:'Falsch. Die Einlagefazilität ist die Untergrenze. Die Obergrenze ist die Spitzenrefinanzierung.'},
 {t:'Beim holländischen Zinstender zahlt jede Bank ihren eigenen gebotenen Zinssatz.',ok:0,why:'Falsch. Das ist das amerikanische Verfahren. Holländisch heißt: einheitlicher Satz für alle.'},
 {t:'Das Mindestreserve-Soll muss an jedem einzelnen Tag der Erfüllungsperiode erreicht werden.',ok:0,why:'Falsch. Es zählt der Durchschnitt über die ganze Periode.'},
 {t:'Das ESZB besteht nur aus den Zentralbanken der Euro-Länder.',ok:0,why:'Falsch. Zum ESZB gehören die EZB und die Notenbanken aller EU-Staaten, auch ohne Euro.'},
 {t:'Erhöht die EZB die Leitzinsen, steigt in der Regel die Geldmenge.',ok:0,why:'Falsch. Höhere Zinsen machen Kredite teurer, es wird weniger geliehen, die Geldmenge sinkt.'}
];
const G={ezb:[],el:[],kon:[],recht:[],zahl:[]};
G.ezb.push(function massnahme(){
  if(Math.random()<.6){const r=fmt(rnd(45,95)/10,1);
    return mc(`Die Inflationsrate im Euroraum ist auf <b>${r} %</b> gestiegen.`,pick(RESTR),EXPAN,
     `Inflation zu hoch heißt: Geld muss knapper und teurer werden. Die EZB handelt <b>restriktiv</b>: Leitzinsen hoch, Wertpapiere verkaufen, Mindestreserve hoch. Dann sinkt die Geldmenge und die Preise steigen langsamer.`,'Welche Maßnahme der EZB ist geeignet, die Inflation zu senken?');}
  const r=fmt(rnd(-6,6)/10,1);
  return mc(`Die Inflationsrate im Euroraum liegt bei <b>${r} %</b>, die Wirtschaft schrumpft, es droht eine Deflation.`,pick(EXPAN),RESTR.concat(['Die EZB erhöht den Zinssatz der Einlagefazilität.']),
   `Zu wenig Inflation und schwache Wirtschaft heißt: Geld muss billiger werden. Die EZB handelt <b>expansiv</b>: Leitzinsen runter, Wertpapiere kaufen, Mindestreserve runter. Dann steigt die Geldmenge.`,'Welche Maßnahme der EZB ist in dieser Lage geeignet?');
});
G.ezb.push(function tender(){
  const step=pick([0.01,0.02]), base=rnd(200,420)/100;
  const lv=[0,1,2,3,4].map(i=>+(base+(4-i)*step).toFixed(2));
  const am=lv.map(()=>rnd(2,9)*100); const cum=[]; am.reduce((s,a,i)=>(cum[i]=s+a),0);
  const k=rnd(1,3); const zut=cum[k-1]+pick([...Array(am[k]/50).keys()].map(x=>(x+1)*50));
  const tab=`<div class="tbl"><table><tr><th>Zinssatz</th><th>Gebote</th><th>Summe von oben</th></tr>${lv.map((l,i)=>`<tr><td>${fmt(l,2)} %</td><td>${fmt(am[i])} Mio. €</td><td style="color:var(--muted)">?</td></tr>`).join('')}</table></div>`;
  const loes=`<div class="tbl"><table><tr><th>Zinssatz</th><th>Summe von oben</th></tr>${lv.map((l,i)=>`<tr${i===k?' style="font-weight:800;color:var(--ok)"':''}><td>${fmt(l,2)} %</td><td>${fmt(cum[i])} Mio. €</td></tr>`).join('')}</table></div>`;
  if(Math.random()<.7) return num(`Die EZB führt ein Hauptrefinanzierungsgeschäft als <b>Zinstender nach dem holländischen Verfahren</b> durch. Sie will <b>${fmt(zut)} Mio. €</b> zuteilen. Es gehen folgende Gebote ein:${tab}`,lv[k],0.001,'%',

};


function parseNum(s){s=String(s).trim().replace(/\s|%|€/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}
const AUF=[{"id":"W2122-1","pruefung":"Winter 2021/22","nr":1,"welt":"recht","thema":"Rechts- und Geschäftsfähigkeit","typ":"mc","situation":"Brian Leitner ist 14 Jahre alt und bekommt jeden Monat 40,00 EUR Taschengeld zur freien Verwendung. Ohne seine Eltern zu fragen, kauft er davon im Kaufhaus ein Computerspiel für 32,80 EUR.","frage":"Welche Aussage beschreibt die Rechtslage nach BGB richtig?","optionen":["Brian ist seit seinem 7. Geburtstag rechtsfähig und darf den Kauf deshalb ohne Zustimmung der Eltern abschließen.","Brian ist seit seinem 14. Geburtstag unbeschränkt geschäftsfähig, der Kaufvertrag ist deshalb wirksam.","Brian ist geschäftsunfähig, der Vertrag wird erst wirksam, wenn die Eltern den Kauf genehmigen.","Brian ist beschränkt geschäftsfähig, der Vertrag ist wirksam, weil er ihn mit seinem frei verfügbaren Taschengeld bezahlt.","Brian ist beschränkt rechtsfähig, der Vertrag ist erst unwirksam und wird durch spätere Zustimmung der Eltern wirksam."],"richtig":[3],"erklaerung":"Brian ist 14, also beschränkt geschäftsfähig. Bezahlt er mit Taschengeld, das ihm frei zur Verfügung steht, ist der Vertrag trotzdem sofort gültig (Taschengeldparagraf, § 110 BGB). Merksatz: Rechtsfähig ab Geburt, beschränkt geschäftsfähig von 7 bis 17, voll ab 18."},{"id":"W2122-2","pruefung":"Winter 2021/22","nr":2,"welt":"recht","thema":"Arten von Rechtsgeschäften","typ":"zuordnen","situation":"Du arbeitest bei der Büroblitz GmbH und prüfst verschiedene Rechtsgeschäfte.","frage":"Ordne jede Willenserklärung der passenden Art von Rechtsgeschäft zu.","kategorien":["Einseitig, empfangsbedürftige Willenserklärung","Einseitig, nicht empfangsbedürftige Willenserklärung","keine Zuordnung"],"aussagen":[{"t":"Eine Mitarbeiterin kündigt form- und fristgerecht ihr Arbeitsverhältnis.","k":0},{"t":"Die Büroblitz GmbH kauft einen neuen Lieferwagen auf Rechnung.","k":2},{"t":"Ein Kunde widerruft nach Vertragsabschluss seinen Kaufvertrag.","k":0},{"t":"Die Gesellschafterin Ursula Straßer regelt ihre Unternehmensnachfolge in einem Testament.","k":1}],"erklaerung":"Einseitig heißt: Eine Person allein reicht. Muss der andere es erfahren (Kündigung, Widerruf), ist es empfangsbedürftig. Ein Testament gilt auch ohne Empfänger. Ein Kauf braucht zwei Willenserklärungen, ist also zweiseitig und passt hier zu keiner Art. Merksatz: Kündigung muss ankommen, Testament nicht."},{"id":"W2122-3","pruefung":"Winter 2021/22","nr":3,"welt":"recht","thema":"Nichtigkeit und Anfechtbarkeit","typ":"zuordnen","frage":"Ordne jeder Situation die richtige Rechtswirkung zu.","kategorien":["Uneingeschränkt wirksam","Nichtig","Wirksam, aber anfechtbar"],"aussagen":[{"t":"Ein Sammler kauft einem unerfahrenen 18-jährigen Schüler eine geerbte Münzsammlung im Wert von rund 8.000,00 EUR für 700,00 EUR ab.","k":1},{"t":"Ein Kundenberater verkauft aus Versehen eine Goldmünze für 29,00 EUR statt für 129,00 EUR.","k":2},{"t":"Eine Rentnerin unter Betreuung ohne Einwilligungsvorbehalt kauft Aktien für 10.000,00 EUR.","k":0},{"t":"Käufer und Verkäufer lassen beim Notar einen niedrigeren Grundstückspreis beurkunden als den, der tatsächlich bezahlt wird, um Steuern und Gebühren zu sparen.","k":1}],"erklaerung":"Wer die Unerfahrenheit eines anderen für einen Wucherpreis ausnutzt, handelt sittenwidrig: nichtig. Ein Grundstückskauf mit falschem Preis beim Notar ist ein Scheingeschäft ohne richtige Form: nichtig. Ein Versprecher beim Preis ist ein Erklärungsirrtum: wirksam, aber anfechtbar. Eine Betreute ohne Einwilligungsvorbehalt ist voll geschäftsfähig. Merksatz: Fehler im Inhalt oder in der Form macht nichtig, Irrtum macht anfechtbar."},{"id":"W2122-4","pruefung":"Winter 2021/22","nr":4,"welt":"recht","thema":"Schlechtleistung, Rechte des Käufers","typ":"mc","situation":"Holger Matthern kauft bei der Büroblitz GmbH einen höhenverstellbaren Schreibtisch. Nach der Lieferung merkt er, dass die Höhenverstellung nicht richtig funktioniert.","frage":"Welches vorrangige Recht hat Herr Matthern wegen des Sachmangels?","optionen":["Er kann sofort vom Kaufvertrag zurücktreten.","Er kann verlangen, dass der Schreibtisch repariert oder ein neuer geliefert wird.","Er kann den Kaufpreis ohne Zustimmung des Verkäufers um 10 % kürzen.","Er kann woanders einen Schreibtisch bestellen und der Büroblitz GmbH den Preis in Rechnung stellen.","Er kann die Reparatur und zusätzlich Schadenersatz verlangen."],"richtig":[1],"erklaerung":"Bei einem Sachmangel darf der Käufer zuerst nur Nacherfüllung verlangen: Reparatur oder neue Ware, er sucht aus. Rücktritt und Minderung kommen erst danach. Schadenersatz gibt es nur, wenn der Verkäufer schuld ist. Merksatz: Erst reparieren oder tauschen, dann alles andere."},{"id":"W2122-5","pruefung":"Winter 2021/22","nr":5,"welt":"recht","thema":"Zahlungsverzug","typ":"mc","situation":"Tobias Melber bestellt am 24.10.2021 online eine Armbanduhr, sie kommt am 28.10.2021 an. Auf der beiliegenden Rechnung steht: Zahlung spätestens am 16.11.2021. Bis heute, den 24.11.2021, hat er nicht bezahlt.","frage":"Welche Aussage beschreibt die Rechtslage richtig?","optionen":["Weil er nicht bezahlt hat, ist gar kein Kaufvertrag entstanden, der Händler kann nur die Uhr zurückverlangen.","Er muss erst zahlen, wenn ihm der Händler eine angemessene Nachfrist setzt.","Er ist seit Ablauf des 16.11.2021 auch ohne Mahnung im Verzug, weil das Zahlungsdatum genau bestimmt war.","Er kommt erst 30 Tage nach Fälligkeit und Zugang der Rechnung in Verzug, wenn vorher keine Mahnung kommt.","Ohne Vereinbarung kann der Händler Verzugszinsen von höchstens 15 % des Rechnungsbetrags verlangen."],"richtig":[2],"erklaerung":"Steht ein genaues Zahlungsdatum fest, kommt der Käufer am Tag danach von selbst in Verzug, ohne Mahnung. Die 30-Tage-Regel gilt nur, wenn kein Datum vereinbart ist. Merksatz: Datum fest, Mahnung weg. Verzugszinsen für Verbraucher: 5 Prozentpunkte über dem Basiszinssatz (Basiszins Stand 2021: minus 0,88 %)."},{"id":"W2122-6","pruefung":"Winter 2021/22","nr":6,"welt":"recht","thema":"Allgemeine Geschäftsbedingungen","typ":"mc","situation":"Die Kreditbank AG ändert zum 01.12.2021 Teile ihrer Allgemeinen Geschäftsbedingungen.","frage":"Welche Aussage zu den neuen AGB ist richtig?","optionen":["Erkennt ein Kunde die neuen AGB an, werden ab 01.12.2021 alle früheren persönlichen Absprachen unwirksam.","Benachteiligen einzelne neue Klauseln den Kunden nur unwesentlich, sind die gesamten AGB unwirksam.","Die neuen AGB gelten, wenn die Bank auf die Änderung hinweist und der Kunde nicht fristgerecht widerspricht.","Die Bank muss ihre Kunden mindestens 4 Wochen vorher schriftlich über die Änderung informieren.","Erkennt ein langjähriger Kunde die neuen AGB an, gelten sie nur für Verträge, die nach dem 01.12.2021 geschlossen werden."],"richtig":[4],"erklaerung":"Neue AGB gelten erst ab dem Tag, an dem sie gültig werden, nie rückwirkend. Persönliche Absprachen gehen AGB immer vor. Seit dem BGH-Urteil vom April 2021 reicht Schweigen des Kunden nicht mehr als Zustimmung. Merksatz: Individuell schlägt AGB, und Schweigen ist kein Ja."},{"id":"W2122-7","pruefung":"Winter 2021/22","nr":7,"welt":"recht","thema":"Widerruf beim Onlinekauf","typ":"mc","situation":"Sebastian Kubinski kauft bei einem Onlinehändler ein Fachbuch. Nach der Lieferung will er den Kaufvertrag widerrufen.","frage":"In welchem Fall widerruft Herr Kubinski wirksam?","optionen":["Er muss sich über die Widerrufsregeln des Händlers informieren und das Buch spätestens 3 Wochen nach Erhalt zurückschicken.","Er erklärt innerhalb der gesetzlichen Frist per E-Mail den Widerruf und schickt das Buch danach per Post zurück.","Er widerruft am Telefon und schickt das Buch am 14. Tag danach unfrei zurück, Gebühr zahlt der Empfänger.","Er schickt das Buch innerhalb von 14 Tagen zurück, ohne den Widerruf ausdrücklich zu erklären.","Er muss das Widerrufsformular des Händlers ausfüllen und es mit dem Buch spätestens 10 Tage nach Erhalt zurücksenden."],"richtig":[1],"erklaerung":"Ein Widerruf muss klar erklärt werden, eine E-Mail innerhalb von 14 Tagen reicht. Die Ware einfach kommentarlos zurückschicken genügt nicht. Danach geht die Ware innerhalb von 14 Tagen zurück. Merksatz: Klar sagen, 14 Tage Zeit, 14 Tage zurückschicken."},{"id":"W2122-8","pruefung":"Winter 2021/22","nr":8,"welt":"arbeit","thema":"Arbeitsschutz","typ":"mc","situation":"Die Kreditbank AG trifft verschiedene Maßnahmen, um Arbeitsunfälle zu vermeiden.","frage":"Bei welcher Maßnahme verstößt die Kreditbank AG gegen den Arbeitsschutz?","optionen":["Sie erfasst Unfälle, nach denen Beschäftigte mehr als drei Tage ganz oder teilweise arbeitsunfähig waren.","Sie verbietet Beschäftigten bestimmte Arbeiten, wenn diese sie erkennbar nicht ohne Gefahr ausführen können.","Sie dokumentiert den Umbau bestehender Arbeitsplätze und beurteilt die Gefährdung für die Beschäftigten.","Sie verzichtet im Kreditbereich auf die regelmäßige Unterweisung zur Unfallverhütung, weil es dort bisher keine Gefahren gab.","Sie bestellt Sicherheitsbeauftragte und Ersthelfer in vorgeschriebener Zahl und bildet sie auf eigene Kosten aus."],"richtig":[3],"erklaerung":"Der Arbeitgeber muss alle Beschäftigten regelmäßig über Unfallverhütung unterweisen, auch dort, wo bisher nichts passiert ist. Unfälle erfassen, gefährliche Arbeiten verbieten, Gefährdungen beurteilen und Ersthelfer ausbilden sind dagegen Pflicht und erlaubt. Merksatz: Unterweisen muss man immer, nicht erst nach dem Unfall."},{"id":"W2122-9","pruefung":"Winter 2021/22","nr":9,"welt":"sozial","thema":"Kostenvergleich Stromkosten","typ":"zahl","situation":"Im Lager brennen 38 Glühlampen mit je 60 Watt, das kostet 1.368,00 EUR Strom im Jahr. Sie sollen durch 38 LED-Lampen mit je 8 Watt ersetzt werden, bei gleicher Brenndauer und Helligkeit.","frage":"Wie viel EUR Stromkosten spart die Büroblitz GmbH pro Jahr durch den Tausch?","loesung":1185.6,"einheit":"EUR","toleranz":0.01,"rechenweg":"38 x 60 W = 2.280 W; 38 x 8 W = 304 W; 1.368,00 x 304 : 2.280 = 182,40 EUR; 1.368,00 - 182,40 = 1.185,60 EUR","erklaerung":"Die Kosten wachsen genau mit der Wattzahl. Die LEDs brauchen 304 statt 2.280 Watt, also nur einen kleinen Teil der alten Kosten. Merksatz: Dreisatz über die Watt, dann alt minus neu."},{"id":"W2122-10","pruefung":"Winter 2021/22","nr":10,"welt":"arbeit","thema":"Kündigungsfrist Arbeitnehmer","typ":"mc","situation":"Stefanie Grubert fängt am 01.03.2022 bei der Kreditbank AG an. Ihr Arbeitsverhältnis bei der Handelsbank AG besteht seit 10 Jahren und muss zum 28.02.2022 enden. Nach § 622 BGB kann ein Arbeitnehmer mit vier Wochen zum 15. oder zum Monatsende kündigen, für den Arbeitgeber werden die Fristen mit der Dauer länger.","frage":"Bis wann muss die Kündigung von Frau Grubert der Handelsbank AG spätestens zugegangen sein?","optionen":["31.10.2021","30.11.2021","31.12.2021","31.01.2022","14.02.2022"],"richtig":[3],"erklaerung":"Kündigt der Arbeitnehmer, gilt immer die Grundfrist: vier Wochen zum 15. oder zum Monatsende. Die längeren Fristen nach Jahren gelten nur, wenn der Arbeitgeber kündigt. Vom 28.02.2022 vier Wochen zurück ergibt Montag, den 31.01.2022. Merksatz: Arbeitnehmer kündigt, vier Wochen reichen, egal wie lange er da war."},{"id":"W2122-11","pruefung":"Winter 2021/22","nr":11,"welt":"sozial","thema":"Sozialversicherung, Grenzen","typ":"mc","situation":"Leon Baumann bekommt ab Januar 2022 statt 4.850 EUR nun 5.450 EUR brutto im Monat. Grenzen 2022 im Jahr: Kranken- und Pflegeversicherung Beitragsbemessungsgrenze 56.250 EUR, Versicherungspflichtgrenze Krankenversicherung 62.550 EUR, Renten- und Arbeitslosenversicherung Beitragsbemessungsgrenze 82.800 EUR.","frage":"Wie wirkt sich die Gehaltserhöhung richtig beschrieben aus?","optionen":["Weil er über der Beitragsbemessungsgrenze der Kranken- und Pflegeversicherung liegt, bekommt er dort höhere Leistungen.","Er zahlt mehr selbst zur Krankenversicherung, weil der Arbeitgeberanteil nur bis zur Versicherungspflichtgrenze berechnet wird.","Weil er unter der Beitragsbemessungsgrenze der Renten- und Arbeitslosenversicherung bleibt, ändern sich seine Beiträge dort nicht.","Weil er künftig über der Versicherungspflichtgrenze der Krankenversicherung liegt, kann er in eine private Krankenversicherung wechseln.","Seine Ansprüche aus Renten- und Arbeitslosenversicherung ändern sich nicht, weil er unter der Beitragsbemessungsgrenze bleibt."],"richtig":[3],"erklaerung":"Neues Jahresgehalt: 12 x 5.450 = 65.400 EUR. Das liegt über der Versicherungspflichtgrenze der Krankenversicherung von 62.550 EUR, also darf er in die private Krankenversicherung wechseln. Unter der Grenze von Renten- und Arbeitslosenversicherung steigen dort Beiträge und Ansprüche weiter. Merksatz: Über der Pflichtgrenze darf man privat, über der Beitragsgrenze steigt nichts mehr. Grenzwerte Stand 2022."},{"id":"W2122-12","pruefung":"Winter 2021/22","nr":12,"welt":"arbeit","thema":"Jugend- und Auszubildendenvertretung","typ":"mc","situation":"Elisa Sommer, 18, ist neu in der Jugend- und Auszubildendenvertretung (JAV) der Kreditbank AG.","frage":"Welche Aussage beschreibt die Aufgabe der JAV richtig?","optionen":["Die JAV kann allein mit dem Vorstand Maßnahmen für eine bessere Ausbildung aushandeln.","Die JAV berät nur und muss Informationen zu allen Maßnahmen für Jugendliche und Azubis über den Betriebsrat anfordern.","Die JAV kann an Betriebsratssitzungen teilnehmen und abstimmen, wenn Beschlüsse überwiegend Jugendliche und Azubis betreffen.","Die JAV muss über alle mitbestimmungspflichtigen Vorgänge der Bank informiert werden.","Die JAV darf über alle betrieblichen und persönlichen Angelegenheiten der Jugendlichen und Azubis informiert werden."],"richtig":[2],"erklaerung":"Die JAV darf an Betriebsratssitzungen teilnehmen, wenn es um Jugendliche und Azubis geht. Abstimmen darf sie mit, wenn ein Beschluss überwiegend diese Gruppe betrifft. Verhandeln mit dem Vorstand macht der Betriebsrat, nicht die JAV. Merksatz: JAV redet mit, stimmt mit bei Azubi-Themen, verhandelt aber nicht allein. Hinweis: Die IHK hat diese Aufgabe damals nicht gewertet, weil die Original-Antwort ungenau formuliert war."},{"id":"W2122-13","pruefung":"Winter 2021/22","nr":13,"welt":"arbeit","thema":"Rechtsgrundlagen Ausbildung und Arbeit","typ":"zuordnen","situation":"In der Personalabteilung der Kreditbank AG werden Sachverhalte ihrer Rechtsgrundlage zugeordnet.","frage":"Ordne jedem Sachverhalt die passende Rechtsgrundlage zu.","kategorien":["Berufsbildungsgesetz (BBiG)","Betriebsverfassungsgesetz (BetrVG)","Gehaltstarifvertrag privates Bankgewerbe","keine Zuordnung"],"aussagen":[{"t":"Eine 22-jährige Auszubildende will wissen, wie hoch ihre Ausbildungsvergütung im zweiten Jahr ist.","k":2},{"t":"Die Bank beantragt mit einem Azubi die Verlängerung der Ausbildung, weil er lange krank war.","k":0},{"t":"Ein Mitarbeiter möchte Einsicht in seine Personalakte nehmen und stellt dafür einen Antrag.","k":1},{"t":"Eine 19-jährige Auszubildende möchte wissen, ob sie ihren täglichen Arbeitsbeginn flexibel wählen kann.","k":3}],"erklaerung":"Wie viel Geld es gibt, steht im Tarifvertrag. Wie die Ausbildung läuft, auch die Verlängerung bei Krankheit, regelt das BBiG. Rechte rund um den Betriebsrat und die Personalakte stehen im BetrVG. Wann der Arbeitstag beginnt, legt der Betrieb selbst fest. Merksatz: Geld im Tarif, Ausbildung im BBiG, Mitbestimmung im BetrVG."},{"id":"W2122-14","pruefung":"Winter 2021/22","nr":14,"welt":"sozial","thema":"Werbungskosten","typ":"mc","situation":"Axel Zeller, Azubi im ersten Jahr bei der Kreditbank AG, macht seine erste Steuererklärung.","frage":"Welche Ausgabe kann Axel als Werbungskosten absetzen?","optionen":["Einbehaltene Sozialversicherungsbeiträge von 1.603,20 EUR","Gezahlter Gewerkschaftsbeitrag von 108,00 EUR","Vom Arbeitgeber erstattete Fahrtkosten von 60,00 EUR für eine Betriebsveranstaltung","Gezahlte Kirchensteuer von 73,48 EUR","Spende von 50,00 EUR an die Freiwillige Feuerwehr"],"richtig":[1],"erklaerung":"Werbungskosten sind Ausgaben für den Job, die man selbst bezahlt hat, zum Beispiel der Gewerkschaftsbeitrag. Sozialversicherung, Kirchensteuer und Spenden sind Sonderausgaben. Was der Arbeitgeber erstattet, kann man nicht noch einmal absetzen. Merksatz: Nur was du für den Job selbst zahlst, ist Werbungskosten."},{"id":"W2122-15","pruefung":"Winter 2021/22","nr":15,"welt":"arbeit","thema":"Ablauf eines Arbeitskampfs","typ":"reihenfolge","situation":"Der Tarifvertrag für das private Bankgewerbe ist gekündigt, die Tarifparteien einigen sich nicht. Die Gewerkschaft will streiken.","frage":"Bringe die Schritte des Arbeitskampfs in die richtige Reihenfolge.","schritte":["Die Tarifparteien erklären die Verhandlungen für gescheitert.","Die Gewerkschaft beschließt, eine Urabstimmung einzuleiten.","Genug Mitglieder stimmen für einen unbefristeten Streik.","Die Gewerkschaft ruft ihre Mitglieder zum Streik auf.","Die von der Gewerkschaft ausgewählten Betriebe werden bestreikt."],"erklaerung":"Erst scheitern die Verhandlungen. Dann plant die Gewerkschaft eine Urabstimmung, in der genug Mitglieder (meist 75 %) für den Streik stimmen müssen. Danach ruft sie zum Streik auf, und die Betriebe werden bestreikt. Merksatz: Scheitern, Abstimmen, Aufrufen, Streiken."},{"id":"W2122-16","pruefung":"Winter 2021/22","nr":16,"welt":"sozial","thema":"Ökonomisches Prinzip","typ":"mc","frage":"In welcher Situation handelt die Büroblitz GmbH nach dem Minimalprinzip?","optionen":["Sie gibt ihr festes Einkaufsbudget voll aus und kauft nur die beste Qualität.","Sie will mit einem festen Werbebudget möglichst viele Endkunden erreichen.","Sie bekommt für 80.000,00 EUR nach guter Verhandlung 4 statt 3 Kleintransporter.","Sie will mit möglichst niedrigen Werbeausgaben ihren Umsatz um 10 % steigern.","Sie will mit möglichst wenig Beschäftigten den größtmöglichen Umsatz erzielen."],"richtig":[3],"erklaerung":"Beim Minimalprinzip steht das Ziel fest, und man will es mit möglichst wenig Mitteln erreichen: 10 % mehr Umsatz mit möglichst wenig Werbegeld. Festes Budget und möglichst viel rausholen ist das Maximalprinzip. Wenig Einsatz und maximaler Erfolg zugleich geht nicht. Merksatz: Ziel fest, Mittel klein."},{"id":"W2122-17","pruefung":"Winter 2021/22","nr":17,"welt":"markt","thema":"Gleichgewichtspreis","typ":"zahl","situation":"Polypol mit vollkommener Konkurrenz für Kopierpapier. Anbieter (Mindestpreis/Menge): 60 EUR 300 t, 65 EUR 1.100 t, 70 EUR 800 t, 75 EUR 1.000 t, 80 EUR 1.200 t. Nachfrager (Höchstpreis/Menge): 80 EUR 600 t, 75 EUR 700 t, 70 EUR 900 t, 65 EUR 1.000 t, 60 EUR 1.200 t.","frage":"Bei welchem Preis in EUR je Tonne herrscht Marktgleichgewicht?","loesung":70.0,"einheit":"EUR je Tonne","toleranz":0.01,"rechenweg":"Angebot aufsummiert bei 70 EUR: 300 + 1.100 + 800 = 2.200 t; Nachfrage aufsummiert bei 70 EUR: 600 + 700 + 900 = 2.200 t; größter Umsatz, also 70 EUR","erklaerung":"Anbieter verkaufen ab ihrem Mindestpreis, also wächst das Angebot mit dem Preis: 300, 1.400, 2.200, 3.200, 4.400 t. Käufer kaufen bis zu ihrem Höchstpreis, also wächst die Nachfrage, je billiger es wird. Bei 70 EUR sind beide 2.200 t, dort wird am meisten umgesetzt. Merksatz: Gleichgewicht ist da, wo die meiste Menge den Besitzer wechselt."},{"id":"W2122-18","pruefung":"Winter 2021/22","nr":18,"welt":"markt","thema":"Preiselastizität der Nachfrage","typ":"mc","situation":"Die Kreditbank AG hat 76.000 Geschäftskonten im Modell „Business prime“ zu 8,20 EUR im Monat. Die Preiselastizität der Nachfrage liegt bei 0,6. Das Entgelt soll auf 7,50 EUR sinken.","frage":"Wie wirkt sich die Senkung des Entgelts auf die Zahl der Konten aus?","optionen":["Die Nachfrage reagiert proportional, die Zahl der Konten bleibt gleich.","Die Nachfrage ist unelastisch, die Zahl der Konten steigt überproportional.","Die Nachfrage ist unelastisch, die Zahl der Konten steigt unterproportional.","Die Nachfrage ist elastisch, die Zahl der Konten sinkt überproportional.","Die Nachfrage ist elastisch, die Zahl der Konten steigt überproportional."],"richtig":[2],"erklaerung":"Eine Elastizität von 0,6 ist kleiner als 1, die Nachfrage ist also unelastisch. Die Menge steigt dann prozentual weniger stark, als der Preis sinkt. Merksatz: Unter 1 reagiert die Menge schwach, über 1 stark."},{"id":"W2122-19","pruefung":"Winter 2021/22","nr":19,"welt":"markt","thema":"Verschiebung der Nachfragekurve","typ":"mc","situation":"Die Büroblitz GmbH hat die Schreibtischlampe „3 Stars Silver“ neu im Sortiment, die Nachfrage ist als fallende Kurve dargestellt.","frage":"Welcher Sachverhalt verschiebt die Nachfragekurve nach links?","optionen":["Wegen gesunkener Rohstoffpreise senkt Büroblitz den Verkaufspreis der Lampe.","Eine Werbekampagne gewinnt neue Kunden für die Lampe.","Wegen gestiegener Herstellkosten muss Büroblitz den Preis erhöhen.","Eine Fachzeitschrift empfiehlt die Lampe für das Homeoffice.","Die Konkurrenz bietet bei gleicher Gesamtnachfrage eine gleich gute Lampe billiger an."],"richtig":[4],"erklaerung":"Nach links heißt: Bei jedem Preis wollen weniger Leute die Lampe. Das passiert, wenn die Konkurrenz eine gleich gute Lampe billiger anbietet. Kostenänderungen verschieben die Angebotskurve, Werbung verschiebt die Nachfrage nach rechts. Merksatz: Billigere Konkurrenz zieht die Nachfrage nach links."},{"id":"W2122-20","pruefung":"Winter 2021/22","nr":20,"welt":"markt","thema":"Kartellarten","typ":"zuordnen","situation":"Mehrere Unternehmen aus dem Markt für Büroartikel wollen enger mit der Büroblitz GmbH zusammenarbeiten.","frage":"Ordne jeden Vorgang zu: verbotenes Kartell, erlaubtes Kartell oder keine Zuordnung.","kategorien":["Verbotenes Kartell","Erlaubtes Kartell","keine Zuordnung"],"aussagen":[{"t":"Büroblitz und die Printshop GmbH kaufen gemeinsam bei Großhändlern ein, um bessere Preise zu bekommen.","k":1},{"t":"Büroblitz und die Printshop GmbH übertragen ihr ganzes Vermögen auf eine neu gegründete Gesellschaft.","k":2},{"t":"Büroblitz und ihre Tochter, die Büro-Manufactur AG, vereinbaren eine einheitliche Berechnung ihrer Kennzahlen.","k":2},{"t":"Büroblitz und die Technik-Einkauf GmbH teilen ihr Geschäftsgebiet auf, um sich vor Konkurrenz zu schützen.","k":0}],"erklaerung":"Gemeinsam günstiger einkaufen hilft kleinen Firmen und am Ende dem Kunden: erlaubtes Mittelstandskartell. Absatzgebiete aufteilen schaltet den Wettbewerb aus: verboten. Eine Fusion oder Absprachen im eigenen Konzern sind gar kein Kartell. Merksatz: Kartell heißt, Firmen bleiben selbstständig und sprechen sich ab."},{"id":"W2122-21","pruefung":"Winter 2021/22","nr":21,"welt":"kon","thema":"Konjunkturphasen, Rezession","typ":"mc","situation":"Für eine Volkswirtschaft wird ein deutlicher Rückgang des Wachstums erwartet.","frage":"In welcher Situation entsteht eine Rezession oder liegt schon vor?","optionen":["Haushalte geben den Großteil ihres Einkommens für Konsum aus, die Sparquote ist sehr niedrig.","Wegen stark gestiegener Konsumnachfrage sind die Kapazitäten ausgelastet, Firmen investieren mehr.","Eine kurzfristig höhere Nachfrage führt zu einer Angebotslücke, die über steigende Preise ausgeglichen wird.","Neue Technologien senken die Produktionskosten und Preise, die Nachfrage steigt.","Wegen steigender Arbeitslosigkeit sinken die Realeinkommen, Konsum und Kredite gehen zurück."],"richtig":[4],"erklaerung":"In der Rezession steigt die Arbeitslosigkeit, die Einkommen sinken, die Leute kaufen weniger und nehmen weniger Kredite. Viel Konsum, volle Kapazitäten und steigende Preise gehören zu Aufschwung und Boom. Merksatz: Weniger Jobs, weniger Geld, weniger Kauf heißt Rezession."},{"id":"W2122-22","pruefung":"Winter 2021/22","nr":22,"welt":"kon","thema":"Wirtschaftskreislauf","typ":"mc","situation":"Ein einfacher Wirtschaftskreislauf zeigt Geldströme zwischen Haushalten, Unternehmen, Staat, Kapitalsammelstellen und Ausland. Gefragt ist der Strom vom Staat zu den Haushalten.","frage":"Welcher Vorgang gehört zum Geldstrom vom Staat zu den Haushalten?","optionen":["Der Staat zahlt Subventionen für Arbeitsplätze in strukturschwachen Gegenden.","Der Staat zahlt die Gehälter seiner Beamten und Angestellten im öffentlichen Dienst.","Die Sozialversicherungsbeiträge der Arbeitnehmer werden an die Versicherungsträger abgeführt.","Der Staat gibt ein neues Bundeswertpapier an Privatleute aus.","Der Staat stellt gegen Gebühr Ausweise und Genehmigungen aus."],"richtig":[1],"erklaerung":"Der markierte Pfeil geht vom Staat zu den Haushalten. Der Staat zahlt seinen Beamten und Angestellten Gehalt, das Geld fließt also zu den Haushalten. Subventionen gehen an Unternehmen, Abgaben, Gebühren und Wertpapierkäufe fließen von den Haushalten zum Staat. Merksatz: Pfeil folgt dem Geld."},{"id":"W2122-23","pruefung":"Winter 2021/22","nr":23,"welt":"kon","thema":"Begriffe der Arbeitsmarktstatistik","typ":"zuordnen","frage":"Ordne jede Person dem passenden Begriff zu.","kategorien":["Nichterwerbspersonen","Abhängig beschäftigte Erwerbstätige","keine Zuordnung"],"aussagen":[{"t":"Eine Köchin eröffnet nach einer betriebsbedingten Kündigung ihr eigenes Café.","k":2},{"t":"Ein 69-jähriger Gärtner im Ruhestand.","k":0},{"t":"Ein Tiefbauarbeiter, der im Winter in Kurzarbeit ist.","k":1},{"t":"Ein Physiotherapeut mit eigener Praxis.","k":2}],"erklaerung":"Ein Rentner, der nicht mehr arbeitet und keine Arbeit sucht, ist Nichterwerbsperson. Ein Kurzarbeiter hat weiter seinen Arbeitsvertrag und zählt zu den abhängig Beschäftigten. Wer ein Café oder eine Praxis führt, ist selbstständig und passt zu keinem der beiden Begriffe. Merksatz: Kurzarbeit ist Arbeit, Ruhestand ist keine Erwerbsperson."},{"id":"W2122-24","pruefung":"Winter 2021/22","nr":24,"welt":"kon","thema":"Inflation","typ":"mc","frage":"Welche Aussage zur Inflation ist richtig?","optionen":["Inflation entsteht, wenn das Güterangebot steigt und die Nachfrage gleich bleibt.","Inflation entsteht, wenn die EZB durch Wertpapierverkäufe die Geldmenge senkt und die Gütermenge gleich bleibt.","Inflation liegt vor, wenn wegen allgemein steigender Preise die Kaufkraft der eigenen Währung sinkt.","Inflation liegt vor, wenn die Löhne weniger steigen als die Produktivität.","Inflation entsteht, wenn sinkende Preise die Konsumnachfrage erhöhen und die Kapazitäten ausgelastet werden."],"richtig":[2],"erklaerung":"Inflation heißt: Die Preise steigen dauerhaft, dein Geld kauft weniger. Mehr Angebot, weniger Geldmenge oder sinkende Preise führen eher zu sinkenden Preisen. Löhne, die stärker steigen als die Produktivität, können Inflation auslösen, nicht schwächere. Merksatz: Preise rauf, Kaufkraft runter."},{"id":"W2122-25","pruefung":"Winter 2021/22","nr":25,"welt":"kon","thema":"Verbraucherpreisindex","typ":"zahl","situation":"Im Juni 2021 kostete eine Telefonanlage 6.939,00 EUR. Der Verbraucherpreisindex (2010 = 100) lag im Juni 2021 bei 102,8 und im Oktober 2021 bei 101,6.","frage":"Welchen Preis in EUR muss die Büroblitz GmbH im Oktober 2021 mindestens verlangen, um real den gleichen Erlös wie im Juni zu haben?","loesung":6858.0,"einheit":"EUR","toleranz":0.01,"rechenweg":"6.939,00 x 101,6 : 102,8 = 6.858,00 EUR","erklaerung":"Real gleich heißt: Der Preis bewegt sich genau wie der Index. Der Index ist von 102,8 auf 101,6 gefallen, also darf der Preis im gleichen Verhältnis sinken. Merksatz: Neuer Preis gleich alter Preis mal neuer Index durch alter Index."},{"id":"W2122-26","pruefung":"Winter 2021/22","nr":26,"welt":"ezb","thema":"Wechselkurs und Export","typ":"mc","situation":"Für 1 EUR gibt es heute 1,2229 USD. Erwartet wird ein Kurs von 1,4265 USD für 1 EUR.","frage":"Wie wirkt sich die Kursänderung auf das Exportgeschäft der Büroblitz GmbH aus?","optionen":["Keine Auswirkung, wenn die Verträge in USD abgeschlossen werden.","Der Euro wird abgewertet, deutsche Waren werden in den USA billiger, der Export steigt eher.","Der Euro wird abgewertet, deutsche Waren werden in den USA teurer, der Export sinkt eher.","Der Euro wird aufgewertet, deutsche Waren werden in den USA billiger, der Export steigt eher.","Der Euro wird aufgewertet, deutsche Waren werden in den USA teurer, der Export sinkt eher."],"richtig":[4],"erklaerung":"Gibt es für 1 EUR mehr Dollar, ist der Euro mehr wert, er wird aufgewertet. Amerikaner müssen dann mehr Dollar für deutsche Waren zahlen, die Waren werden für sie teurer. Also geht der Export eher zurück. Merksatz: Starker Euro, schwacher Export."},{"id":"W2122-27","pruefung":"Winter 2021/22","nr":27,"welt":"ezb","thema":"Leistungsbilanz","typ":"zahl","situation":"Auszug Zahlungsbilanz (Mrd. EUR): Warenhandel +22,5; Dienstleistungen -4,3; Primäreinkommen +8,9; Sekundäreinkommen -4,5; Vermögensänderungsbilanz -0,6; Kapitalbilanz +27,8; statistisch nicht aufgliederbar +5,8.","frage":"Wie hoch ist der Saldo der Leistungsbilanz in Mrd. EUR?","loesung":22.6,"einheit":"Mrd. EUR","toleranz":0.01,"rechenweg":"22,5 - 4,3 + 8,9 - 4,5 = 22,6 Mrd. EUR","erklaerung":"Die Leistungsbilanz besteht aus vier Teilen: Warenhandel, Dienstleistungen, Primäreinkommen und Sekundäreinkommen. Vermögensänderungen, Kapitalbilanz und nicht aufgliederbare Posten gehören nicht dazu. Merksatz: Waren, Dienste, Primär, Sekundär, mehr zählt nicht."},{"id":"W2122-28","pruefung":"Winter 2021/22","nr":28,"welt":"ezb","thema":"Geldpolitik des ESZB","typ":"mc","frage":"Welche Veränderung durch die Geldpolitik ist richtig beschrieben?","optionen":["Kleinere Zuteilungen bei Hauptrefinanzierungsgeschäften vergrößern den Kreditspielraum der Banken.","Ein niedrigerer Zins bei längerfristigen Refinanzierungsgeschäften macht Kredite für Nichtbanken meist teurer.","Ein höheres Zuteilungsvolumen bei Tendergeschäften zeigt der Wirtschaft, dass die Zinsen am Geldmarkt eher sinken.","Kauft das ESZB Wertpapiere von Banken, sinkt die Liquidität am Kapitalmarkt.","Negative Zinsen für die Einlagefazilität sollen die Kreditvergabe der Banken an Nichtbanken bremsen."],"richtig":[2],"erklaerung":"Gibt die EZB beim Tender mehr Geld aus, gibt es mehr Geld im Markt, und die Zinsen sinken eher. Weniger Zuteilung bremst Kredite, niedrigere Zinsen verbilligen Kredite, Wertpapierkäufe der EZB bringen den Banken Geld. Negativzinsen sollen Banken zu mehr Krediten bewegen. Merksatz: Mehr Geld von der EZB heißt billigeres Geld."},{"id":"S22-1","pruefung":"Sommer 2022","nr":1,"welt":"recht","thema":"Öffentliches und privates Recht","typ":"mc","frage":"Welcher Fall gehört zum öffentlichen Recht?","optionen":["Die Büroblitz GmbH beantragt beim Amtsgericht einen Mahnbescheid gegen die Johann Stifter KG wegen einer offenen Rechnung.","Lisa Helbricht wehrt sich bei der Bußgeldstelle gegen die Höhe ihres Bußgelds wegen zu schnellen Fahrens.","Jürgen Möller verklagt die Kreditbank AG, weil sie seinen hoch verzinsten Prämiensparvertrag gekündigt hat.","Clarisa Schreiber legt bei ihrer privaten Krankenversicherung Widerspruch ein, weil eine Kur abgelehnt wurde.","Ein Konkurrent verklagt die Lecker-Kiste GmbH, damit sie eine unlautere Werbung unterlässt."],"richtig":[1],"erklaerung":"Beim öffentlichen Recht steht der Staat über dem Bürger und bestimmt. Die Bußgeldstelle ist eine Behörde, Frau Helbricht muss sich an die Regeln halten. In allen anderen Fällen streiten gleichberechtigte Partner, das ist Privatrecht, auch wenn ein Gericht dabei ist. Merksatz: Behörde gegen Bürger ist öffentliches Recht."},{"id":"S22-2","pruefung":"Sommer 2022","nr":2,"welt":"recht","thema":"Nichtige und anfechtbare Rechtsgeschäfte","typ":"zuordnen","frage":"Welche rechtliche Wirkung hat die Willenserklärung jeweils?","kategorien":["Uneingeschränkt wirksam","Wirksam, aber anfechtbar","Nichtig"],"aussagen":[{"t":"Gisela Hülst übernimmt per E-Mail gegenüber der Kreditbank AG eine selbstschuldnerische Bürgschaft für den Privatkredit ihrer 26-jährigen Tochter.","k":2},{"t":"Eine Mitarbeiterin der Kreditbank AG vertippt sich bei der Bestellnummer und bestellt weißes Kopierpapier statt Recyclingpapier.","k":1},{"t":"Felix Huber, 79, hat einen Betreuer ohne Einwilligungsvorbehalt und beauftragt die Bank, einen Teil seines Sparguthabens in eine Aktienanleihe anzulegen.","k":0}],"erklaerung":"Eine Bürgschaft von Privatleuten braucht Papier mit Unterschrift, eine E-Mail reicht nicht: Formfehler, also nichtig. Der Tippfehler ist ein Erklärungsirrtum, das Geschäft gilt erst einmal, kann aber angefochten werden. Ein Betreuter ohne Einwilligungsvorbehalt bleibt voll geschäftsfähig, sein Auftrag gilt. Merksatz: Formfehler macht nichtig, Irrtum macht anfechtbar."},{"id":"S22-3","pruefung":"Sommer 2022","nr":3,"welt":"recht","thema":"Geschäftsfähigkeit Minderjähriger","typ":"mc","frage":"Welches Geschäft eines Minderjährigen ist auch ohne Zustimmung der Eltern wirksam?","optionen":["Annalena, 16, Azubi bei der Kreditbank AG, schließt bei den Verkehrsbetrieben ein Jahresabo ab.","Leon, 15, kauft von seinen frei verfügbaren Ersparnissen Fußballschuhe für 60,00 EUR.","Benny, 17, Azubi bei der Kreditbank AG, kündigt seine Ausbildung, weil er Mechatroniker werden will.","Sophia, 9, kauft Kopfhörer für 29,99 EUR vom Geburtstagsgeld der Patentante, von dem die Eltern nichts wissen.","Marek, 14, vereinbart mit einem Supermarkt ein einwöchiges Pflichtpraktikum der Schule."],"richtig":[1],"erklaerung":"Das ist der Taschengeldparagraf (§ 110 BGB): Leon bezahlt sofort mit Geld, das ihm zur freien Verfügung gehört. Sophias Geld zählt nicht, weil die Eltern nichts davon wissen. Abo, Kündigung der Ausbildung und Schulpraktikum brauchen die Zustimmung der Eltern, § 113 BGB gilt nur für Arbeitsverhältnisse. Merksatz: Taschengeld wirkt nur, wenn sofort und mit erlaubtem Geld bezahlt wird."},{"id":"S22-4","pruefung":"Sommer 2022","nr":4,"welt":"recht","thema":"Besitz und Eigentum","typ":"mc","situation":"Rebecca Klüner kauft am 02.05.2022 im Fahrradladen Radlkette ein E-Bike für 2.338,00 EUR und bezahlt sofort. Abholen will sie es erst am 04.05.2022, bis dahin steht es im Laden.","frage":"Wie sind Besitz und Eigentum am 02.05.2022 nach der Zahlung verteilt?","optionen":["Frau Klüner ist Eigentümerin, aber nicht Besitzerin.","Frau Klüner ist Eigentümerin und Besitzerin.","Frau Klüner ist Besitzerin, aber nicht Eigentümerin.","Der Laden ist Besitzer, aber nicht Eigentümer.","Der Laden ist Eigentümer und Besitzer."],"richtig":[4],"erklaerung":"Bei beweglichen Sachen wechselt das Eigentum erst mit Einigung und Übergabe, Bezahlen allein reicht nicht. Solange das Rad im Laden steht, hat der Laden es in der Hand (Besitz) und es gehört ihm noch (Eigentum). Hinweis: In der echten Prüfung wurde diese Aufgabe nicht gewertet. Merksatz: Besitz heißt haben, Eigentum heißt gehören."},{"id":"S22-5","pruefung":"Sommer 2022","nr":5,"welt":"recht","thema":"Verbrauchsgüterkauf und Mängel","typ":"mc","situation":"Die Büroblitz GmbH verkauft auch an Privatleute.","frage":"Was muss ein Endverbraucher beim Verbrauchsgüterkauf beachten, um seine Rechte bei einer mangelhaften Lieferung zu sichern?","optionen":["Er muss die Ware sofort prüfen und offene Mängel unverzüglich melden.","Er muss die Ware unverzüglich prüfen und versteckte Mängel sofort nach Entdeckung melden.","Rechte wegen versteckter Mängel hat er nur, wenn sie sich innerhalb der gesetzlichen Verjährungsfrist zeigen.","Zurücktreten kann er nur, wenn er den Mangel innerhalb eines Jahres schriftlich meldet.","Er muss die Ware in angemessener Frist nach Entdeckung zusammen mit der Mängelrüge zurückschicken."],"richtig":[2],"erklaerung":"Ein Verbraucher muss die Ware nicht sofort prüfen und Mängel nicht sofort melden, das gilt nur, wenn beide Seiten Kaufleute sind. Er muss aber innerhalb der Verjährung handeln, bei neuen Sachen 2 Jahre ab Übergabe. Rücktritt ist nur ein nachrangiges Recht. Merksatz: Verbraucher hat Zeit, aber nicht ewig."},{"id":"S22-6","pruefung":"Sommer 2022","nr":6,"welt":"recht","thema":"Zahlungsverzug, 30-Tage-Regel","typ":"mc","situation":"Die Kreditbank AG kauft 96 Flaschen Wein bei der Weingut Janine und Felix Meinhardt KG. Wein und Rechnung über 846,90 EUR kommen am Dienstag, 03.05.2022. Auf der Rechnung steht: zahlbar sofort nach Eingang, Eigentumsvorbehalt bis zur vollständigen Zahlung.","frage":"Mit Ablauf welches Tages muss die Bank spätestens gezahlt haben, um nicht in Zahlungsverzug zu kommen?","optionen":["03.05.2022","17.05.2022","02.06.2022","03.06.2022","02.07.2022"],"richtig":[2],"erklaerung":"„Sofort fällig“ ist kein fester Kalendertag, und gemahnt wurde nicht. Dann gilt die Regel aus § 286 BGB: Verzug spätestens 30 Tage nach Fälligkeit und Zugang der Rechnung. 03.05.2022 plus 30 Tage ergibt den 02.06.2022. Merksatz: Ohne Datum und ohne Mahnung zählt die 30-Tage-Regel."},{"id":"S22-7","pruefung":"Sommer 2022","nr":7,"welt":"recht","thema":"Eigentumsvorbehalt","typ":"mc","situation":"Die Büroblitz GmbH bestellt im April 2022 ein mobiles Klimagerät für 499,00 EUR bei der KlimaCool AG und bekommt es geliefert. Laut AGB der KlimaCool AG gilt ein Eigentumsvorbehalt.","frage":"Welche Aussage zum Eigentumsvorbehalt nach BGB stimmt?","optionen":["Durch den Eigentumsvorbehalt gehen Besitz und Eigentum schon mit der Lieferung auf die Büroblitz GmbH über.","Mit dem Eigentumsvorbehalt schützt sich die KlimaCool AG vor dem gesetzlichen Widerrufsrecht des Käufers.","Die Büroblitz GmbH darf das Gerät bis zur Zahlung nicht bilanzieren, weil es ihr noch nicht gehört.","Die Büroblitz GmbH ist bis zur Zahlung treuhänderische Eigentümerin des Geräts.","Mit der Zahlung des Kaufpreises wird die Büroblitz GmbH Eigentümerin des Geräts."],"richtig":[4],"erklaerung":"Mit der Lieferung bekommt der Käufer nur den Besitz. Das Eigentum bleibt beim Verkäufer, bis alles bezahlt ist, erst dann gehört das Gerät dem Käufer. Bilanzieren darf der Käufer es trotzdem, weil er wirtschaftlich schon der Eigentümer ist. Merksatz: Erst zahlen, dann gehören."},{"id":"S22-8","pruefung":"Sommer 2022","nr":8,"welt":"arbeit","thema":"Arbeits- und Gesundheitsschutz","typ":"mc","frage":"Mit welcher Maßnahme fördert die Kreditbank AG den Arbeits- und Gesundheitsschutz ihrer Beschäftigten unmittelbar?","optionen":["Führungskräfte müssen jeden Arbeitsunfall sofort dem Betriebsrat melden.","Die Bank veröffentlicht jedes Jahr, wie sich die Fehltage durch Arbeitsunfälle entwickeln.","Alle Beschäftigten müssen einmal im Jahr die Anweisung zum Verhalten bei Banküberfällen lesen.","Die Bank bietet ein Seminar mit Bewegungsübungen am Arbeitsplatz für bessere Fitness an.","Ein externes Unternehmen erstellt die gesetzlich vorgeschriebene Gefährdungsbeurteilung."],"richtig":[3],"erklaerung":"Nur die Bewegungsübungen tun dem Körper direkt etwas Gutes. Melden, Statistik, Lesen und Gefährdungsbeurteilung sind nützlich, wirken aber nur auf Umwegen. Merksatz: Unmittelbar heißt, es kommt direkt beim Menschen an."},{"id":"S22-9","pruefung":"Sommer 2022","nr":9,"welt":"sozial","thema":"Umweltzeichen","typ":"mc","situation":"Die Kreditbank AG kauft regelmäßig Büromaterial und will nur Waren, die mit hohem Umweltstandard hergestellt wurden. In der Prüfung waren die Zeichen als Bilder abgedruckt, hier stehen ihre Namen.","frage":"Welches Zeichen muss auf der Ware sein?","optionen":["Tidyman (Figur, die Abfall in einen Eimer wirft)","Blauer Engel","Grüner Punkt","Recycling-Zeichen aus drei Pfeilen im Dreieck","Warnzeichen mit Flamme (entzündbar)"],"richtig":[1],"erklaerung":"Der Blaue Engel ist das Umweltzeichen für umweltfreundliche Produkte und Herstellung, vergeben nach festen Regeln einer unabhängigen Stelle. Tidyman, Grüner Punkt und die Recycling-Pfeile drehen sich nur um Müll und Entsorgung. Die Flamme warnt vor Feuergefahr. Merksatz: Blauer Engel heißt umweltfreundlich hergestellt."},{"id":"S22-10","pruefung":"Sommer 2022","nr":10,"welt":"arbeit","thema":"Berufsbildungsgesetz","typ":"mc","situation":"Sven Reichert beginnt am 01.08.2022 seine Ausbildung zum Bankkaufmann bei der Kreditbank AG.","frage":"Welche Regel findet er im Berufsbildungsgesetz (BBiG)?","optionen":["Nach Feierabend müssen Azubis mindestens 12 Stunden am Stück frei haben, bevor sie wieder arbeiten.","Wer vorher 6 Monate Praktikum im Betrieb gemacht hat, braucht keine Probezeit.","Der Azubi kann jederzeit ohne Frist und ohne Grund kündigen.","Auf Antrag des Azubis kann die Ausbildung verlängert werden, wenn das nötig ist, um das Ziel zu erreichen.","Wer durchfällt, bleibt automatisch bis zur nächsten Wiederholungsprüfung in Ausbildung, höchstens ein Jahr."],"richtig":[3],"erklaerung":"Verkürzen und verlängern geht auf Antrag des Azubis, wenn es nötig ist. Die 12 Stunden Ruhe stehen im Jugendarbeitsschutzgesetz, nicht im BBiG. Probezeit gibt es immer (1 bis 4 Monate), fristlos ohne Grund kündigen geht nur in der Probezeit. Nach dem Durchfallen verlängert sich die Ausbildung nur, wenn der Azubi es verlangt. Merksatz: Verlängern gibt es auf Wunsch, nicht automatisch."},{"id":"S22-11","pruefung":"Sommer 2022","nr":11,"welt":"arbeit","thema":"Jugendarbeitsschutz, Ruhepausen","typ":"zahl","situation":"Simone Förster ist 17 und Azubi in einer Filiale der Kreditbank AG. Am Montag, 09.05.2022, ist sie von 08:00 bis 16:30 Uhr eingeplant, die Pausen sind schon eingerechnet. Laut JArbSchG gilt: über 4,5 bis 6 Stunden Arbeit mindestens 30 Minuten Pause, über 6 Stunden mindestens 60 Minuten.","frage":"Wie viele Minuten Ruhepause muss sie am Montag mindestens bekommen?","loesung":60,"einheit":"Minuten","toleranz":0,"rechenweg":"08:00 bis 16:30 Uhr sind 8,5 Stunden, also mehr als 6 Stunden Arbeit, deshalb mindestens 60 Minuten Pause.","erklaerung":"Jugendliche brauchen bei mehr als 6 Stunden Arbeit mindestens 60 Minuten Pause. Am Montag arbeitet Simone deutlich mehr als 6 Stunden. Als Pause zählt nur, was mindestens 15 Minuten am Stück dauert. Merksatz: Jugendliche über 6 Stunden, eine Stunde Pause."},{"id":"S22-12","pruefung":"Sommer 2022","nr":12,"welt":"arbeit","thema":"Tarifvertrag, Günstigkeitsprinzip","typ":"mc","situation":"Die Büroblitz GmbH ist Mitglied im Arbeitgeberverband und damit tarifgebunden. Der Tarifvertrag hat keine Öffnungsklauseln.","frage":"Was bedeutet die Tarifbindung für die Büroblitz GmbH?","optionen":["In einer wirtschaftlichen Notlage darf sie zum Nachteil der Beschäftigten vom Tarifvertrag abweichen, um die Firma zu retten.","Mit Beschäftigten ohne Gewerkschaft darf sie keine besseren Bedingungen als im Tarifvertrag vereinbaren.","Bessere Bedingungen als im Tarifvertrag darf sie nur mit allen oder mit keinem Beschäftigten vereinbaren.","Sie darf vom Tarifvertrag abweichen, wenn die Einzelvereinbarung für den Beschäftigten günstiger ist.","Sie darf den Tarifvertrag nur für Gewerkschaftsmitglieder unmittelbar und zwingend anwenden."],"richtig":[3],"erklaerung":"Der Tarifvertrag ist eine Untergrenze. Mehr geht immer, zum Beispiel mehr Urlaub, weniger nicht, auch nicht in der Not. Das gilt für jeden Einzelnen, egal ob in der Gewerkschaft oder nicht. Merksatz: Günstigkeitsprinzip, besser darf es immer sein."},{"id":"S22-13","pruefung":"Sommer 2022","nr":13,"welt":"sozial","thema":"Rentenversicherung","typ":"zahl","situation":"Der Bundestag diskutiert, den Rentenbeitrag von 18,6 % auf 20,0 % zu erhöhen, Arbeitgeber und Arbeitnehmer tragen ihn je zur Hälfte. Leon Gabitzke verdient 4.600,00 EUR brutto im Monat. Die Beitragsbemessungsgrenze liegt 2022 bei 7.050,00 EUR im Monat.","frage":"Um wie viel EUR würde sein monatlicher Arbeitnehmeranteil zur Rentenversicherung steigen?","loesung":32.2,"einheit":"EUR","toleranz":0.01,"rechenweg":"Erhöhung 20,0 % minus 18,6 % = 1,4 %, davon trägt er die Hälfte: 0,7 %. 4.600,00 EUR × 0,7 % = 32,20 EUR (Gehalt liegt unter der Grenze).","erklaerung":"Der Beitrag wird halbiert, also trägt Herr Gabitzke nur 0,7 % mehr. Sein Gehalt liegt unter der Beitragsbemessungsgrenze, deshalb zählt das ganze Gehalt. Werte Stand 2022, heute gelten andere Grenzen. Merksatz: Erst die Erhöhung halbieren, dann aufs Brutto rechnen."},{"id":"S22-14","pruefung":"Sommer 2022","nr":14,"welt":"sozial","thema":"Arbeitnehmer-Pauschbetrag","typ":"mc","frage":"Die Bundesregierung diskutiert, den Arbeitnehmer-Pauschbetrag zu erhöhen. Welche Folgerung stimmt?","optionen":["Liegen die nachgewiesenen Werbungskosten unter dem Pauschbetrag, sinkt durch die Erhöhung das zu versteuernde Einkommen.","Die Erhöhung lässt das zu versteuernde Einkommen steigen.","Nach der Erhöhung muss man Werbungskosten bis zur neuen Grenze mit Belegen nachweisen.","Den neuen Pauschbetrag bekommt man nur, wenn man ihn in der Steuererklärung ausdrücklich beantragt.","Die Steuer sinkt nur, wenn man höhere Werbungskosten als den neuen Pauschbetrag nachweist."],"richtig":[0],"erklaerung":"Den Pauschbetrag zieht das Finanzamt automatisch ab, ohne Belege und ohne Antrag. Wird er größer, bleibt weniger zu versteuern übrig, auch wenn man eigentlich weniger Werbungskosten hatte. 2022 stieg er von 1.000 auf 1.200 EUR (Stand 2022, heute höher). Merksatz: Pauschbetrag gibt es immer, auch ohne Zettel."},{"id":"S22-15","pruefung":"Sommer 2022","nr":15,"welt":"arbeit","thema":"Jugend- und Auszubildendenvertretung","typ":"multi","situation":"In der Kreditbank AG wird eine neue Jugend- und Auszubildendenvertretung (JAV) gewählt.","frage":"Welche zwei Beschäftigten dürfen sich zur Wahl in die JAV stellen?","optionen":["Roger Metzler, 21, Azubi im 1. Ausbildungsjahr","Karola Haberer, 25, Angestellte mit befristetem Vertrag","Ghazi Dilmar, 23, Angestellter mit unbefristetem Vertrag, Mitglied im Betriebsrat","Matheus Ayrton, 28, Azubi im 2. Ausbildungsjahr","Emmy Maiser, 26, Angestellte unbefristet in Teilzeit","Mia Lautner, 16, Schülerpraktikantin für 2 Wochen"],"richtig":[0,3],"erklaerung":"Azubis dürfen sich unabhängig vom Alter in die JAV wählen lassen, deshalb Roger und auch Matheus mit 28. Andere Beschäftigte nur, solange sie noch nicht 25 sind. Wer im Betriebsrat sitzt, darf nicht zusätzlich in die JAV, und eine Schülerpraktikantin gehört nicht dazu. Merksatz: Azubi geht immer, sonst unter 25 und nicht im Betriebsrat."},{"id":"S22-16","pruefung":"Sommer 2022","nr":16,"welt":"arbeit","thema":"Streik","typ":"mc","situation":"Im privaten Bankgewerbe lehnt die Gewerkschaft das Angebot der Arbeitgeber ab und denkt über einen Streik nach.","frage":"Welche Voraussetzung muss für einen rechtmäßigen Streik erfüllt sein?","optionen":["Ein Streik ist nur als letztes Mittel erlaubt und setzt voraus, dass der Arbeitgeber vorher aussperrt.","Mitstreiken dürfen nur Gewerkschaftsmitglieder, die in der Urabstimmung mit Ja gestimmt haben.","Die Kreditbank AG darf jederzeit bestreikt werden, wenn zwei Drittel der Gewerkschaftsmitglieder zustimmen.","Die Gewerkschaft kann mit Zustimmung von mindestens 75 % der Arbeitnehmer während der Schlichtung streiken.","Gestreikt werden darf erst, wenn die Verhandlungen gescheitert sind und ein Streikbeschluss vorliegt, der dem Arbeitgeber mitgeteilt wird."],"richtig":[4],"erklaerung":"Solange ein Tarifvertrag gilt, herrscht Friedenspflicht. Erst wenn die Verhandlungen gescheitert sind und in der Urabstimmung 75 % der Gewerkschaftsmitglieder zustimmen, darf gestreikt werden, der Beschluss geht an die Arbeitgeber. Mitmachen dürfen dann alle Arbeitnehmer. Merksatz: Erst scheitern, dann abstimmen, dann streiken."},{"id":"S22-17","pruefung":"Sommer 2022","nr":17,"welt":"arbeit","thema":"Elterngeld","typ":"mc","situation":"Simon Berger, 23, ist zum ersten Mal Vater geworden und fragt in der Personalabteilung der Kreditbank AG nach dem Elterngeld.","frage":"Welche Auskunft ist richtig?","optionen":["Fällt bei einem Elternteil das Einkommen weg, bekommen die Eltern zusammen 24 Monate Basiselterngeld.","Auch Eltern, die vor der Geburt kein eigenes Einkommen hatten, bekommen Elterngeld von 300,00 EUR.","Das Elterngeld richtet sich nach dem Nettoeinkommen im Geburtsjahr und beträgt höchstens 1.600,00 EUR im Monat.","Elterngeld hängt nicht vom Einkommen ab und wird nicht auf Arbeitslosengeld II oder Sozialhilfe angerechnet.","Basiselterngeld gibt es wahlweise als vollen Monatsbetrag oder als halben Betrag für doppelt so lange."],"richtig":[1],"erklaerung":"Jeder bekommt mindestens 300 EUR Elterngeld im Monat, auch ohne Einkommen vorher. Sonst gibt es 65 bis 67 % des Nettos, höchstens 1.800 EUR, zusammen höchstens 14 Monate. Halber Betrag für doppelte Zeit heißt ElterngeldPlus, nicht Basiselterngeld. Stand 2022, und in der echten Prüfung wurde diese Aufgabe nicht gewertet. Merksatz: 300 EUR gibt es immer."},{"id":"S22-18","pruefung":"Sommer 2022","nr":18,"welt":"markt","thema":"Käufermarkt","typ":"mc","situation":"Die Büroblitz GmbH verkauft auf einem hart umkämpften Markt für Büroartikel, auf dem die Kunden die stärkere Position haben.","frage":"In welchem Fall kann ein Käufermarkt vorliegen?","optionen":["Werbung ist überflüssig, weil gleich viele Anbieter wie Nachfrager da sind.","Viele Insolvenzen führen zu einem Nachfrageüberhang, weil es mehr Nachfrager als Anbieter gibt.","Das Angebot sinkt bei gleicher Nachfrage, es entsteht ein Angebotsdefizit.","Die knappe Ware bekommen die Nachfrager, die bei steigender Nachfrage am meisten zahlen.","Es wird zu viel produziert, die Waren lassen sich nicht alle an die Kunden verkaufen."],"richtig":[4],"erklaerung":"Beim Käufermarkt gibt es mehr Ware als Käufer. Die Käufer können sich aussuchen, wo sie kaufen, und die Anbieter müssen um sie kämpfen. Zu wenig Ware und Kunden, die sich überbieten, das wäre ein Verkäufermarkt. Merksatz: Zu viel Ware, der Käufer ist König."},{"id":"S22-19","pruefung":"Sommer 2022","nr":19,"welt":"markt","thema":"Preiselastizität der Nachfrage","typ":"mc","situation":"Die Büroblitz GmbH will ihre Preise erhöhen, um mehr Umsatz zu machen.","frage":"Unter welcher Voraussetzung klappt das?","optionen":["Die Nachfrage muss vollkommen elastisch sein, dann steigt durch die Preiserhöhung der Umsatz.","Bei vollkommen elastischer Nachfrage steigt der Umsatz durch die Preisänderung maximal.","Ist die Nachfrageelastizität kleiner als 1, kann die Preiserhöhung den Umsatz steigern.","Die Nachfrageelastizität muss genau 1 sein, damit der Umsatz steigt.","Die Angebotsmenge muss prozentual genauso stark sinken, wie der Preis steigt."],"richtig":[2],"erklaerung":"Elastizität kleiner als 1 heißt: Die Kunden reagieren schwach, die Menge sinkt prozentual weniger, als der Preis steigt. Dann bleibt am Ende mehr Umsatz übrig. Bei vollkommen elastischer Nachfrage laufen bei jeder Preiserhöhung alle Kunden weg, bei genau 1 bleibt der Umsatz gleich. Merksatz: Unelastisch, Preis rauf, Umsatz rauf."},{"id":"S22-20","pruefung":"Sommer 2022","nr":20,"welt":"markt","thema":"Angebots- und Nachfragekurve","typ":"mc","situation":"Die Entwicklung von Büro-Software wird für die Büroblitz GmbH teurer, deshalb steigt der Preis für ihre Kunden. Gezeigt ist ein normales Marktdiagramm mit steigender Angebotskurve und fallender Nachfragekurve.","frage":"Was passiert durch diese Preiserhöhung im Diagramm? Andere Einflüsse bleiben außen vor.","optionen":["Die Nachfragekurve verschiebt sich nach rechts.","Die Nachfragekurve verschiebt sich nach links.","Die Angebotskurve verschiebt sich nach rechts.","Die Angebotskurve verschiebt sich nach links.","Keine der beiden Kurven verschiebt sich."],"richtig":[3],"erklaerung":"Höhere Kosten treffen den Anbieter. Er bietet zum gleichen Preis weniger an, also wandert die Angebotskurve nach links. Die Nachfragekurve bleibt, es wird nur weniger gekauft. Merksatz: Kosten rauf beim Anbieter, Angebotskurve nach links."},{"id":"S22-21","pruefung":"Sommer 2022","nr":21,"welt":"markt","thema":"Gesetz gegen Wettbewerbsbeschränkungen","typ":"mc","frage":"In welchem Fall liegt ein Verstoß gegen das Gesetz gegen Wettbewerbsbeschränkungen (GWB) vor?","optionen":["Drei Entsorger einer Region bilden einen Konzern, um ihr Angebot günstiger und umfassender zu machen.","Ein Telefonanbieter, dem 10 % der Leitungen einer Region gehören, lässt einen Konkurrenten nicht auf seine Leitungen.","Ein Großhändler verkauft gut laufende Büroartikel längere Zeit unter Einstandspreis, um Marktanteile zu gewinnen.","Zwei kleine Bäckereien bünd
