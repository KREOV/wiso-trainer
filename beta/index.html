s ist ein Käufermarkt.","frage":"Welche Aussage zum Käufermarkt ist richtig?","optionen":["Wegen der hohen Nachfrage geben die Anbieter keine Preisnachlässe mehr.","Die nachgefragte Menge ist kleiner als die angebotene Menge.","Das vorhandene Angebot reicht nicht, um die Nachfrage ganz zu decken.","Die Nachfrager sind auf diesem Markt von den Anbietern abhängig.","Die angebotene Menge ist kleiner als der Bedarf."],"richtig":[1],"erklaerung":"Gibt es mehr Ware als Käufer, können die Käufer aussuchen und haben die Macht. Das ist der Käufermarkt. Ist die Ware knapp, haben die Verkäufer die Macht, das ist der Verkäufermarkt. Merksatz: Wer knapp ist, bestimmt."},{"id":"W2425-17","pruefung":"Winter 2024/25","nr":17,"welt":"markt","thema":"Preiselastizität der Nachfrage","typ":"zahl","situation":"Die Büroblitz GmbH verkauft im Monat 500 Hängeregister-Systeme „Sortfix“ zu je 30,00 EUR. Sie will den Preis um 3,00 EUR erhöhen. Das Marketing erwartet dann noch 480 verkaufte Systeme.","frage":"Wie hoch ist die Preiselastizität der Nachfrage? (1 Nachkommastelle, als positiver Betrag)","loesung":0.4,"einheit":"","toleranz":0.01,"rechenweg":"Menge: 20 / 500 = 4 %. Preis: 3 / 30 = 10 %. Elastizität = 4 % / 10 % = 0,4.","erklaerung":"Elastizität heißt: Um wie viel Prozent ändert sich die Menge, wenn sich der Preis um ein Prozent ändert. Hier sinkt die Menge nur um 4 %, obwohl der Preis um 10 % steigt. Das Ergebnis liegt unter 1, also ist die Nachfrage unelastisch. Merksatz: Mengenprozent geteilt durch Preisprozent."},{"id":"W2425-18","pruefung":"Winter 2024/25","nr":18,"welt":"markt","thema":"Angebot, Nachfrage und Gleichgewicht","typ":"mc","situation":"Eine Grafik zu höhenverstellbaren Schreibtischen zeigt: Bei 500,00 EUR werden 600 Stück angeboten und 400 nachgefragt. Bei 300,00 EUR werden 400 angeboten und 600 nachgefragt. Die Kurven schneiden sich bei 400,00 EUR und 500 Stück.","frage":"Welche Aussage zu den Preisen trifft zu?","optionen":["Bei 500,00 EUR je Stück gibt es eine Nachfragelücke.","Bei 300,00 EUR je Stück gibt es einen Angebotsüberhang.","Zum Gleichgewichtspreis werden 600 Schreibtische verkauft.","Bei 500,00 EUR je Stück gibt es eine Angebotslücke.","Im Gleichgewicht ist ein Umsatz von 250.000,00 EUR zu erwarten."],"richtig":[0],"erklaerung":"Bei 500 EUR wollen Firmen 600 verkaufen, aber nur 400 Leute kaufen. Es fehlen Käufer, das ist eine Nachfragelücke, also ein Angebotsüberhang. Im Gleichgewicht sind es 500 Stück zu 400 EUR, das macht 200.000 EUR Umsatz. Merksatz: Preis über dem Gleichgewicht heißt zu viel Ware."},{"id":"W2425-19","pruefung":"Winter 2024/25","nr":19,"welt":"markt","thema":"Staatliche Eingriffe in die Preisbildung","typ":"zuordnen","frage":"Ist der staatliche Eingriff marktkonform oder marktkonträr? Ordne zu.","kategorien":["marktkonformer Eingriff","marktkonträrer Eingriff"],"aussagen":[{"t":"Auf Elektroautos aus China werden Einfuhrzölle erhoben.","k":0},{"t":"Der gesetzliche Mindestlohn im Einzelhandel steigt.","k":1},{"t":"Gegen Wohnungsnot wird eine gesetzliche Höchstmiete pro Quadratmeter festgelegt.","k":1},{"t":"Der Staat bezuschusst Photovoltaikanlagen und Stromspeicher.","k":0}],"erklaerung":"Bei Zoll und Zuschuss bildet der Markt den Preis weiter selbst, es entsteht ein neues Gleichgewicht. Bei Mindestlohn und Höchstmiete schreibt der Staat den Preis fest vor, dann bleibt ein Überhang oder eine Lücke. Merksatz: Konform schiebt nur an, konträr setzt den Preis fest."},{"id":"W2425-20","pruefung":"Winter 2024/25","nr":20,"welt":"markt","thema":"Unternehmenszusammenschlüsse","typ":"mc","situation":"Die Büroblitz GmbH möchte durch einen Zusammenschluss ihre Marktstellung stärken.","frage":"In welchem Fall liegt ein horizontaler Zusammenschluss vor?","optionen":["Sie lagert ihre Buchhaltung an einen regionalen Konkurrenten aus, um Personalkosten zu sparen.","Sie arbeitet eng mit anderen Büroartikelherstellern zusammen, um bei Holzlieferanten bessere Preise zu bekommen.","Sie kauft die Kapitalmehrheit an einem Holzproduzenten, um dessen Einkauf zu beeinflussen.","Sie kauft eine kleine Getränkefirma, um ihren Leuten günstige Getränke anzubieten.","Sie schließt sich mit einer Marketingfirma zusammen, um Trends früh zu erkennen."],"richtig":[1],"erklaerung":"Horizontal heißt: Firmen derselben Stufe tun sich zusammen, hier Büroartikelhersteller mit Büroartikelherstellern. Holzproduzent und Möbelhersteller sind hintereinander, das ist vertikal. Ganz verschiedene Branchen sind diagonal. Merksatz: Horizontal nebeneinander, vertikal untereinander."},{"id":"W2425-21","pruefung":"Winter 2024/25","nr":21,"welt":"kon","thema":"Konjunkturphase Rezession","typ":"mc","frage":"Woran erkennt man eine Rezession?","optionen":["Die Nachfrage nach Gütern und Dienstleistungen steigt.","Die Unternehmen investieren mehr.","Die Gewinne aller Unternehmen steigen.","Das Bruttoinlandsprodukt (BIP) steigt.","Die Arbeitslosigkeit steigt und mehr Menschen sind in Kurzarbeit."],"richtig":[4],"erklaerung":"In der Rezession geht es mit der Wirtschaft abwärts. Firmen brauchen weniger Leute, also steigen Arbeitslosigkeit und Kurzarbeit. Steigende Nachfrage, Investitionen, Gewinne und BIP gehören zum Aufschwung. Merksatz: Rezession heißt weniger Arbeit, weniger Wachstum."},{"id":"W2425-22","pruefung":"Winter 2024/25","nr":22,"welt":"kon","thema":"Strukturpolitik","typ":"mc","situation":"Der Staat will mit seiner Politik auch den Aufbau der Wirtschaft so verändern, dass der Wohlstand in Zukunft gesichert ist.","frage":"Welche Maßnahme verbessert die Wirtschaftsstruktur in Deutschland langfristig?","optionen":["Ein unbefristetes Förderprogramm für Innovationen und Firmengründungen.","Eine vorübergehende Senkung der Umsatzsteuer für Hotels und Gaststätten.","Ein Umweltbonus für Käufer von Elektroautos im Jahr 2025.","Geplante Investitionen in die Infrastruktur werden wegen Geldmangel ausgesetzt.","Die Erhöhung der gesetzlichen Rente wird bis auf Weiteres ausgesetzt."],"richtig":[0],"erklaerung":"Wer dauerhaft neue Ideen und Gründungen fördert, bekommt neue Firmen und neue Arbeitsplätze. Das wirkt lange. Steuersenkung und Bonus sind nur vorübergehend, gestrichene Investitionen und Renten schwächen die Wirtschaft sogar. Merksatz: Langfristig hilft nur, was dauerhaft Neues aufbaut."},{"id":"W2425-23","pruefung":"Winter 2024/25","nr":23,"welt":"markt","thema":"Gesetzlicher Mindestlohn","typ":"mc","situation":"In Deutschland gibt es einen gesetzlichen Mindestlohn. Er soll Arbeitskräften in manchen Branchen ein Einkommen über der Armutsgrenze sichern.","frage":"Welche Wirkung hat der Mindestlohn?","optionen":["Es bieten mehr Menschen ihre Arbeit an, dadurch fallen die Preise der Güter.","Er wirkt nicht auf die Güterpreise, weil Entlassungen das Güterangebot senken und so ausgleichen.","Bleibt die Arbeitslosigkeit gleich, steigen die Einnahmen der gesetzlichen Sozialversicherung.","Er senkt die Produktionskosten und erhöht so die Arbeitsproduktivität.","Er macht die Kosten gut planbar, was zu fallenden Preisen führt."],"richtig":[2],"erklaerung":"Gleich viele Leute verdienen mehr Geld. Die Beiträge zur Sozialversicherung hängen am Bruttolohn, also kommt mehr Geld in die Kassen. Höhere Löhne machen die Produktion teurer, die Preise steigen eher. Merksatz: Mehr Lohn heißt mehr Beiträge, aber eher höhere Preise."},{"id":"W2425-24","pruefung":"Winter 2024/25","nr":24,"welt":"kon","thema":"Reales BIP","typ":"zahl","situation":"Die Büroblitz GmbH prüft vor einer Investition im Nachbarland dessen Wirtschaftslage. Das BIP in jeweiligen Preisen 2023 beträgt 2.490,8 Mrd. EUR, der Preisindex 2023 ist 110,6 (Basisjahr 2020 = 100).","frage":"Wie hoch ist das reale BIP 2023 in Mrd. EUR? (1 Nachkommastelle)","loesung":2252.1,"einheit":"Mrd. EUR","toleranz":0.05,"rechenweg":"2.490,8 × 100 / 110,6 = 2.252,1 Mrd. EUR","erklaerung":"Das nominale BIP enthält auch die gestiegenen Preise. Um nur die echte Mehrleistung zu sehen, rechnet man die Preissteigerung heraus. Dafür teilt man durch den Preisindex und mal 100. Merksatz: Real gleich nominal durch Preisindex mal 100."},{"id":"W2425-25","pruefung":"Winter 2024/25","nr":25,"welt":"kon","thema":"Folgen einer Deflation","typ":"mc","situation":"Die EZB strebt keine Inflation von 0,0 % an. Ein Grund ist die Gefahr einer Deflation.","frage":"Was ist eine Folge der Deflation?","optionen":["Weil das Geld an Kaufkraft verliert, sparen die Haushalte weniger.","Die Zinsen am Geld- und Kapitalmarkt steigen, Kredite werden teurer.","Weil die Arbeitslosigkeit sinkt, steigen die Einkommen.","Die Nachfrage nach Konsumgütern und die Steuereinnahmen des Staates sinken.","Steigende Verbraucherpreise lassen das Geld an Kaufkraft verlieren."],"richtig":[3],"erklaerung":"Bei Deflation fallen die Preise dauerhaft. Die Leute warten mit dem Kaufen, weil es morgen noch billiger wird. Firmen verkaufen weniger, verdienen weniger und entlassen, also nimmt auch der Staat weniger Steuern ein. Merksatz: Deflation heißt warten, weniger kaufen, weniger Steuern."},{"id":"W2425-26","pruefung":"Winter 2024/25","nr":26,"welt":"ezb","thema":"Aufwertung der Inlandswährung","typ":"mc","situation":"Eine starke Währung ist ein Erfolgsfaktor für eine Volkswirtschaft.","frage":"Was führt direkt zu einer Aufwertung der Inlandswährung?","optionen":["Das Zinsniveau im Inland fällt unter das im Ausland.","Die Inflation im Inland ist höher als im Ausland.","Die eigene Zentralbank verkauft Devisen gegen Inlandswährung.","Die Exporte des Landes gehen deutlich zurück.","Ausländische Anleger investieren weniger im Inland."],"richtig":[2],"erklaerung":"Verkauft die Zentralbank Devisen und nimmt dafür eigene Währung, wird die eigene Währung stärker nachgefragt. Was gefragt ist, wird teurer, also wertet sie auf. Niedrige Zinsen, hohe Inflation und weniger Anleger schwächen die Währung. Merksatz: Mehr Nachfrage nach der Währung macht sie stärker."},{"id":"W2425-27","pruefung":"Winter 2024/25","nr":27,"welt":"ezb","thema":"Ablauf des Tenderverfahrens","typ":"reihenfolge","situation":"Die EZB führt jeden Monat längerfristige Refinanzierungsgeschäfte mit drei Monaten Laufzeit durch.","frage":"Bring die Schritte des Tenderverfahrens in die richtige Reihenfolge.","schritte":["Die EZB beschließt, einen Tender aufzulegen.","Die EZB kündigt den Tender mit seinen Bedingungen öffentlich an.","Die EZB nimmt innerhalb der Frist die Gebote der Geschäftspartner entgegen.","Die EZB berechnet nach Fristende aus den Geboten die Zuteilungsquoten.","Die EZB teilt den Geschäftspartnern die Zuteilungen mit.","Die EZB schreibt das Geld laut Zuteilung auf den Konten der Geschäftspartner gut."],"erklaerung":"Erst entscheidet die EZB, dann sagt sie es allen. Danach bieten die Banken, die EZB rechnet aus, wer wie viel bekommt, sagt es den Banken und zahlt am Ende aus. Merksatz: Beschließen, ankündigen, bieten, zuteilen, mitteilen, auszahlen."},{"id":"W2425-28","pruefung":"Winter 2024/25","nr":28,"welt":"ezb","thema":"Geldpolitische Instrumente","typ":"mc","situation":"Zur Sicherung der Preisstabilität im Euroraum hat die EZB verschiedene geldpolitische Instrumente.","frage":"Bei welchem Instrument ist die gewünschte Änderung der Geldmenge richtig beschrieben?","optionen":["Die EZB erhöht die Mindestreservesätze, um die Geldmenge zu erhöhen.","Die EZB erhöht den Zins der Einlagefazilität, um die Geldmenge zu senken.","Die EZB senkt den Hauptrefinanzierungssatz, um die Geldmenge zu senken.","Die EZB kauft Wertpapiere von Geschäftsbanken, um die Geldmenge zu senken.","Die EZB bietet den Banken einen Zinstender an, um die Geldmenge zu senken."],"richtig":[1],"erklaerung":"Gibt es mehr Zinsen für Geld, das Banken über Nacht bei der EZB parken, parken sie mehr. Dieses Geld fehlt dann im Umlauf, die Geldmenge sinkt. Höhere Mindestreserve senkt die Geldmenge, Zinssenkung, Wertpapierkauf und Tender erhöhen sie. Merksatz: EZB nimmt Geld rein, Geldmenge sinkt. EZB gibt Geld raus, Geldmenge steigt."},{"id":"S25-1","pruefung":"Sommer 2025","nr":1,"welt":"recht","thema":"Öffentliches und privates Recht","typ":"zuordnen","frage":"Zu welchem Rechtsgebiet gehört jeder Fall?","kategorien":["Öffentliches Recht","Privates Recht (Zivilrecht)"],"aussagen":[{"t":"Ein Steuerzahler legt Einspruch gegen seinen Einkommensteuerbescheid ein, weil das Finanzamt seine Werbungskosten nicht voll anerkannt hat.","k":0},{"t":"Die Stadt Dessau-Roßlau verklagt eine Baufirma, weil diese Mängel an neu angelegten Gehwegen nicht wie vereinbart behoben hat.","k":1},{"t":"Hannah Lehmann widerspricht dem Bescheid der Stadtverwaltung über Erschließungsbeiträge für ihr Baugrundstück.","k":0}],"erklaerung":"Beim öffentlichen Recht steht der Staat über dem Bürger und entscheidet per Bescheid, zum Beispiel bei Steuern oder Erschließungsbeiträgen. Beim privaten Recht stehen sich zwei gleichberechtigte Partner gegenüber. Die Stadt hat die Gehwege wie ein normaler Kunde bestellt, deshalb gilt dort Privatrecht. Merksatz: Bescheid vom Staat ist öffentliches Recht, Vertrag auf Augenhöhe ist Privatrecht."},{"id":"S25-2","pruefung":"Sommer 2025","nr":2,"welt":"recht","thema":"Besitz und Eigentum","typ":"mc","situation":"Florian Görtler kauft bei der Kreditbank AG eine Krügerrand-Goldmünze. Der Preis wird seinem Kontokorrentkonto bei der Bank belastet.","frage":"Welche Aussage beschreibt Besitz und Eigentum an der Goldmünze richtig?","optionen":["Eigentümer wird er erst, wenn der Kaufpreis seinem Kontokorrentkonto belastet worden ist.","Besitzer kann er erst werden, wenn er den Kaufpreis an die Kreditbank AG bezahlt hat.","Besitzer kann er nur werden, wenn ihm die Bank vorher auch das Eigentum übertragen hat.","Mit dem Eigentum bekommt er die rechtliche, mit dem unmittelbaren Besitz die tatsächliche Herrschaft über die Münze.","Legt er die Münze in sein gemietetes Schließfach bei der Bank, wird er nicht Eigentümer."],"richtig":[3],"erklaerung":"Eigentum heißt: Die Münze gehört dir rechtlich. Besitz heißt: Du hast sie tatsächlich bei dir. Bei beweglichen Sachen geht das Eigentum durch Einigung und Übergabe über, die Abbuchung spielt dafür keine Rolle. Merksatz: Eigentum ist gehören, Besitz ist haben."},{"id":"S25-3","pruefung":"Sommer 2025","nr":3,"welt":"recht","thema":"Nichtige Rechtsgeschäfte","typ":"mc","frage":"Welches Rechtsgeschäft ist nach dem Gesetz von Anfang an nichtig?","optionen":["Eine 17-jährige Auszubildende kauft ohne Zustimmung ihrer Eltern von ihrer Ausbildungsvergütung ein Fachbuch für 24,00 EUR.","Eine Verkäuferin verkauft die Stehlampe „Luxus light“, gibt dem Kunden aber aus Versehen das Modell „Sunshine de Luxe“ mit.","Zwei Personen schließen mündlich einen Kaufvertrag über ein Grundstück, der Käufer zahlt sofort 25.000,00 EUR bar.","Eine Verkäuferin verkauft ihrem Freund einen Bürostuhl und gibt ohne Rücksprache mit der Chefin einen hohen Sonderrabatt.","Eine Bewerberin schließt einen Arbeitsvertrag ab und sagt nicht, dass sie im dritten Monat schwanger ist."],"richtig":[2],"erklaerung":"Ein Grundstückskauf braucht die notarielle Form. Wird er nur mündlich geschlossen, fehlt die Form, und der Vertrag ist von Anfang an nichtig. Der Buchkauf der 17-Jährigen ist nur schwebend unwirksam, die falsche Lampe ist ein Irrtum und damit nur anfechtbar. Merksatz: Grundstück nur beim Notar, sonst nichtig."},{"id":"S25-4","pruefung":"Sommer 2025","nr":4,"welt":"recht","thema":"Antrag und Annahme","typ":"zuordnen","situation":"Zwischen der Kreditbank AG und der Büroblitz GmbH entstehen Kaufverträge durch zwei übereinstimmende Willenserklärungen.","frage":"Welche Willenserklärung liegt in jeder Situation vor?","kategorien":["Antrag","Annahme","keine Zuordnung"],"aussagen":[{"t":"Die Kreditbank AG fragt per E-Mail bei der Büroblitz GmbH nach dem Preis für 10 Schreibtische.","k":2},{"t":"Die Kreditbank AG bestellt am 06.05.2025 drei Stehlampen auf ein verbindliches Angebot der Büroblitz GmbH, das bis 07.05.2025 gilt.","k":1},{"t":"Die Kreditbank AG bestellt 5 Regale zu je 65,00 EUR, obwohl das verbindliche Angebot bei 75,00 EUR je Regal lag.","k":0}],"erklaerung":"Eine Anfrage ist unverbindlich, sie ist noch kein Antrag. Wer rechtzeitig und ohne Änderung auf ein verbindliches Angebot bestellt, nimmt es an. Wer den Preis ändert, lehnt das Angebot ab und macht selbst einen neuen Antrag. Merksatz: Geändert bestellt heißt neuer Antrag."},{"id":"S25-5","pruefung":"Sommer 2025","nr":5,"welt":"recht","thema":"Mängelrüge beim Handelskauf","typ":"mc","situation":"Die Büroblitz GmbH bestellt am 12.09.2024 Tischplatten bei der Holzbau AG, geliefert wird am 04.10.2024, bei der Eingangskontrolle fällt nichts auf. Im Jahr 2025 wölben sich einige Platten wegen einer falschen Materialmischung, die vorher nicht zu erkennen war. Die Büroblitz GmbH meldet das sofort telefonisch.","frage":"Hat die Büroblitz GmbH die gesetzlichen Vorschriften eingehalten?","optionen":["Ja, denn sie darf einen Mangel jederzeit und ohne bestimmte Form wirksam anzeigen.","Ja, denn sie hat den Mangel sofort nach seiner Entdeckung gemeldet.","Nein, denn auch einen versteckten Mangel hätte sie spätestens 6 Monate nach Erhalt der Ware melden müssen.","Nein, denn ihre Ansprüche sind verjährt, weil seit der Bestellung mehr als 6 Monate vergangen sind.","Nein, denn sie hätte die Materialmischung sofort bei der Annahme im Beisein eines Holzbau-Mitarbeiters prüfen müssen."],"richtig":[1],"erklaerung":"Zwei Kaufleute untereinander, das ist ein zweiseitiger Handelskauf. Die Ware wird sofort geprüft, und ein versteckter Mangel muss unverzüglich gemeldet werden, sobald man ihn entdeckt. Genau das hat die Büroblitz GmbH getan, und die Verjährung von 2 Jahren ab Lieferung läuft noch. Merksatz: Versteckter Mangel wird sofort nach dem Finden gemeldet."},{"id":"S25-6","pruefung":"Sommer 2025","nr":6,"welt":"recht","thema":"Allgemeine Geschäftsbedingungen","typ":"mc","situation":"Die Büroblitz GmbH verweist in ihren Auftragsbestätigungen auf ihre AGB.","frage":"Welche Aussage über die AGB ist richtig?","optionen":["Die BGB-Vorschriften zu AGB muss die Büroblitz GmbH nur bei Verträgen mit Verbrauchern beachten.","AGB sind vorformulierte Vertragsbedingungen, die immer Vorrang vor allen BGB-Vorschriften haben.","Einzeln ausgehandelte Absprachen werden durch die AGB unwirksam, wenn sie für die Büroblitz GmbH nachteilig sind.","Bekommen Kunden die AGB nicht in Textform, müssen sie auf zumutbare Weise davon Kenntnis nehmen können.","Verstößt eine AGB-Klausel gegen das Gesetz, ist der Vertrag dazu von Anfang an nichtig."],"richtig":[3],"erklaerung":"AGB gelten nur, wenn der Kunde sie auf zumutbare Weise lesen kann, zum Beispiel als Aushang im Geschäft. Eine persönliche Absprache geht den AGB immer vor. Ist eine Klausel unzulässig, fällt nur sie weg, der Vertrag bleibt und es gilt das Gesetz. Merksatz: Absprache schlägt AGB, und der Kunde muss sie sehen können."},{"id":"S25-7","pruefung":"Sommer 2025","nr":7,"welt":"arbeit","thema":"Sicherheitszeichen","typ":"mc","situation":"Die Kreditbank AG zeigt ihren neuen Azubis die Sicherheitszeichen im Haus. Ein Schild ist grün, in der Mitte stehen mehrere weiße Personen, und aus allen vier Ecken zeigen Pfeile auf sie.","frage":"Worauf weist dieses Zeichen hin?","optionen":["Ruheraum für stillende Mitarbeiterinnen","Aufzug trägt höchstens 4 Personen","Menschenansammlungen meiden","Treffpunkt für Ersthelfer","Sammelplatz für Personen in einer Notfallsituation"],"richtig":[4],"erklaerung":"Grüne Schilder zeigen Rettung und Sicherheit. Menschen in der Mitte und Pfeile, die auf sie zeigen, heißt: Hier treffen sich alle im Notfall. Ersthelfer erkennt man am weißen Kreuz, ein Verbot hätte einen roten Rand. Merksatz: Grün mit Pfeilen zur Gruppe ist der Sammelplatz."},{"id":"S25-8","pruefung":"Sommer 2025","nr":8,"welt":"kon","thema":"Nachhaltige Investitionen","typ":"mc","situation":"Die Kreditbank AG gibt Geschäftskunden nur Kredite für nachhaltige und ressourcenschonende Investitionen, alle anderen Anträge lehnt sie ab.","frage":"Bei welchem Kreditantrag steckt am ehesten eine zeitnahe, ökologisch sinnvolle Investition dahinter?","optionen":["Ein Nutzfahrzeughersteller baut im nächsten Geschäftsjahr eine Produktionsstraße in einem asiatischen Niedriglohnland, um Kosten zu senken.","Ein Verpackungshersteller stellt ab dem nächsten Quartal auf plastikfreie, recycelbare und CO₂-neutrale Herstellung um.","Eine Baufirma kauft in den nächsten Tagen günstige Baustoffe ohne Umweltzertifikat, um bei Ausschreibungen billiger zu sein.","Ein Energieversorger kauft im nächsten Halbjahr ein altes Kohlekraftwerk und erzeugt damit mit alter Technik Strom und Warmwasser.","Ein Recyclingbetrieb kauft im nächsten Monat Lkw, um Plastikmüll billiger auf eine Deponie im Ausland zu bringen."],"richtig":[1],"erklaerung":"Nachhaltig heißt: Die Umwelt wird geschont, nicht nur Geld gespart. Nur der Verpackungshersteller macht seine Produktion wirklich sauberer und das schon bald. Bei allen anderen geht es um niedrige Kosten auf Kosten der Umwelt. Merksatz: Nachhaltig ist besser für die Umwelt, nicht nur billiger."},{"id":"S25-9","pruefung":"Sommer 2025","nr":9,"welt":"arbeit","thema":"Ausbildungsrahmenplan","typ":"mc","situation":"Ella Markovski, 17 Jahre, beginnt am 01.08.2025 ihre Ausbildung bei der Kreditbank AG. Ihrem Ausbildungsvertrag liegt der Ausbildungsrahmenplan für Bankkaufleute bei.","frage":"Welche Aussage über den Ausbildungsrahmenplan stimmt?","optionen":["Für die Inhalte des Ausbildungsrahmenplans ist in der dualen Ausbildung die Berufsschule zuständig.","Er legt nur die Theorie fest und sagt nichts darüber, wann was vermittelt wird.","Abweichende Ausbildungsinhalte sind nur mit Zustimmung der zuständigen Stelle erlaubt.","Er nennt die Fertigkeiten, Kenntnisse und Fähigkeiten, die während der Ausbildung mindestens vermittelt werden müssen.","Seine Inhalte sind Berufsschulhalbjahren zugeordnet, in denen sie zwingend vermittelt werden müssen."],"richtig":[3],"erklaerung":"Der Ausbildungsrahmenplan gehört zur Ausbildungsordnung und gilt für den Betrieb. Er sagt, was du mindestens lernen musst, sachlich und zeitlich gegliedert. Mehr beibringen darf der Betrieb immer. Für die Schule gibt es den Rahmenlehrplan. Merksatz: Rahmenplan ist Betrieb und Mindeststoff, Lehrplan ist Schule."},{"id":"S25-10","pruefung":"Sommer 2025","nr":10,"welt":"arbeit","thema":"Ruhepausen im Jugendarbeitsschutz","typ":"zahl","situation":"Noah Krämer, 17 Jahre, ist Azubi bei der Kreditbank AG. Donnerstags arbeitet er von 8:30 Uhr bis 17:00 Uhr. Nach § 11 JArbSchG dürfen Jugendliche nicht länger als viereinhalb Stunden am Stück ohne Ruhepause arbeiten.","frage":"Um wie viel Uhr muss seine Ruhepause donnerstags spätestens beginnen? Gib die Stunde als Zahl ein, zum Beispiel 12 für 12:00 Uhr.","loesung":13,"einheit":"Uhr","toleranz":0,"rechenweg":"8:30 Uhr + 4,5 Stunden = 13:00 Uhr","erklaerung":"Jugendliche dürfen höchstens viereinhalb Stunden ohne Pause arbeiten. 8:30 Uhr plus 4 Stunden ist 12:30 Uhr, plus eine halbe Stunde ist 13:00 Uhr. Bei mehr als sechs Stunden Arbeit stehen ihm insgesamt 60 Minuten Pause zu. Merksatz: Jugendliche arbeiten nie länger als 4,5 Stunden am Stück."},{"id":"S25-11","pruefung":"Sommer 2025","nr":11,"welt":"arbeit","thema":"Ablauf einer Stellenbesetzung","typ":"reihenfolge","situation":"Die Kreditbank AG sucht über eine externe Ausschreibung einen Berater für vermögende Privatkunden.","frage":"Bring die Arbeitsschritte bis zur Besetzung der Stelle mit einem externen Bewerber in die richtige Reihenfolge.","schritte":["Externe Stellenausschreibung erstellen und veröffentlichen","Eingegangene Bewerbungen bearbeiten","Geeignete Bewerber zum Gespräch einladen, den ungeeigneten absagen","Bewerbungsgespräche mit den geeigneten Bewerbern führen","Rangfolge der Bewerber nach den Gesprächen festlegen","Stelle mit dem besten Bewerber besetzen, den übrigen absagen"],"erklaerung":"Erst wird die Stelle ausgeschrieben, dann kommen Bewerbungen, die gesichtet werden. Die Passenden werden eingeladen und im Gespräch kennengelernt. Danach wird eine Rangfolge gebildet und der Beste bekommt die Stelle, alle anderen eine Absage. Merksatz: Ausschreiben, sichten, einladen, sprechen, ranken, besetzen."},{"id":"S25-12","pruefung":"Sommer 2025","nr":12,"welt":"arbeit","thema":"Mutterschutzfrist","typ":"mc","situation":"Fiona Melzel arbeitet bei der Kreditbank AG und ist schwanger. Laut ärztlicher Bescheinigung ist der errechnete Geburtstermin Freitag, der 05.09.2025.","frage":"An welchem Tag beginnt ihre Schutzfrist vor der Entbindung nach dem Mutterschutzgesetz?","optionen":["18.07.2025","25.07.2025","26.07.2025","01.08.2025","08.08.2025"],"richtig":[1],"erklaerung":"Die Schutzfrist vor der Geburt dauert 6 Wochen, das sind 42 Tage. Vom Freitag, 05.09.2025, sechs Wochen zurück landest du wieder auf einem Freitag, dem 25.07.2025. Merksatz: 6 Wochen vor und 8 Wochen nach der Geburt."},{"id":"S25-13","pruefung":"Sommer 2025","nr":13,"welt":"sozial","thema":"Jahresarbeitsentgeltgrenze","typ":"mc","situation":"Leon Rödel, verheiratet, keine Kinder, ist Anlageberater bei der Kreditbank AG. Nach einer Gehaltserhöhung liegt er 2025 und auch 2026 deutlich über der Jahresarbeitsentgeltgrenze (Versicherungspflichtgrenze) der gesetzlichen Krankenversicherung.","frage":"Was gilt für ihn ab 2026 in der Krankenversicherung?","optionen":["Er muss von der gesetzlichen in eine private Krankenversicherung wechseln.","Er kann als freiwilliges Mitglied in der gesetzlichen Krankenversicherung bleiben.","Er und seine Ehefrau müssen gemeinsam in eine private Krankenversicherung wechseln.","Er bekommt von der Kreditbank AG keinen Arbeitgeberanteil zur Kranken- und Pflegeversicherung mehr.","Seine Krankenversicherungsbeiträge werden nur bis zur Jahresarbeitsentgeltgrenze berechnet."],"richtig":[1],"erklaerung":"Wer über der Versicherungspflichtgrenze verdient, darf wählen: freiwillig gesetzlich bleiben oder privat wechseln. Einen Zuschuss vom Arbeitgeber gibt es weiter. Die Beiträge werden bis zur niedrigeren Beitragsbemessungsgrenze berechnet, nicht bis zur Pflichtgrenze. Merksatz: Über der Pflichtgrenze gibt es ein Wahlrecht, keine Wechselpflicht."},{"id":"S25-14","pruefung":"Sommer 2025","nr":14,"welt":"sozial","thema":"Werbungskosten","typ":"mc","situation":"Elke Bücker, Kundenberaterin bei der Kreditbank AG, hat im letzten Jahr freiwillig eine Fortbildung über künstliche Intelligenz in der Praxis besucht. Die Bank hat einen Teil bezahlt, den Rest von 2.260,00 EUR zahlte sie selbst.","frage":"Kann sie die 2.260,00 EUR in ihrer Einkommensteuererklärung geltend machen?","optionen":["Nein, weil die Kreditbank AG einen Teil der Kosten übernommen hat.","Nein, weil die Fortbildung nicht von der Kreditbank AG als Arbeitgeber veranlasst wurde.","Ja, sie kann die gesamten Fortbildungskosten als außergewöhnliche Belastungen ansetzen.","Ja, sie kann ihren Anteil bis zur Höhe des Pauschbetrags als Werbungskosten ansetzen.","Ja, sie kann ihren Anteil in voller Höhe als Werbungskosten ansetzen."],"richtig":[4],"erklaerung":"Kosten für eine berufliche Fortbildung sind Werbungskosten, egal ob der Chef sie angeordnet hat. Absetzen darf sie nur, was sie selbst bezahlt hat, das aber komplett. Die Pauschale von 1.230,00 EUR gibt es automatisch, wer mehr ausgibt, weist es mit Belegen nach. Merksatz: Selbst bezahlt und beruflich sind Werbungskosten."},{"id":"S25-15","pruefung":"Sommer 2025","nr":15,"welt":"arbeit","thema":"Streik","typ":"mc","situation":"In laufenden Tarifverhandlungen ruft die Gewerkschaft rechtmäßig zum Streik auf. Die Beschäftigten der Büroblitz GmbH wollen mitmachen.","frage":"Welche Aussage über diesen Streik ist richtig?","optionen":["Betriebsratsmitgliedern ist die Teilnahme am Streik gesetzlich verboten.","Die Beschäftigten dürfen auch während eines laufenden Schlichtungsverfahrens streiken.","Die durch den Streik ausgefallenen Stunden müssen die Streikenden nicht nacharbeiten.","Die Gewerkschaft darf anordnen, dass Azubis während des Berufsschulunterrichts mitstreiken.","Nur Gewerkschaftsmitglieder dürfen sich am Streik beteiligen."],"richtig":[2],"erklaerung":"Beim rechtmäßigen Streik ruht die Arbeitspflicht, dafür gibt es auch keinen Lohn. Nacharbeiten muss niemand. Mitstreiken dürfen alle Beschäftigten, auch ohne Gewerkschaft und auch Betriebsräte als Arbeitnehmer, während der Schlichtung gilt aber Friedenspflicht. Merksatz: Streik heißt keine Arbeit, kein Lohn, kein Nacharbeiten."},{"id":"S25-16","pruefung":"Sommer 2025","nr":16,"welt":"sozial","thema":"Ökonomisches Prinzip","typ":"mc","frage":"Welches Ziel der Büroblitz GmbH entspricht ausschließlich dem ökonomischen (erwerbswirtschaftlichen) Prinzip?","optionen":["Mehr Arbeitszeit der Beschäftigten bei gleicher Produktionsmenge","Mit dem eingesetzten Kapital den größtmöglichen Gewinn erzielen","Den Marktanteil halten, auch wenn das dauerhaft Verluste bringt","Sich für soziale Gerechtigkeit einsetzen, um der Gesellschaft etwas Gutes zu tun","Fünf Jahre lang keine betriebsbedingten Kündigungen, um die Beschäftigten zu binden"],"richtig":[1],"erklaerung":"Ökonomisch heißt: aus den Mitteln das Beste herausholen. Mit festem Kapital den größten Gewinn machen ist das Maximalprinzip. Mehr Einsatz für das gleiche Ergebnis ist Verschwendung, und soziale Ziele sind gut, aber nicht rein wirtschaftlich. Merksatz: Maximal heißt gleicher Einsatz, größter Erfolg. Minimal heißt gleicher Erfolg, kleinster Einsatz."},{"id":"S25-17","pruefung":"Sommer 2025","nr":17,"welt":"markt","thema":"Unvollkommener Markt","typ":"mc","situation":"Die Büroblitz GmbH verkauft höhenverstellbare Schreibtische.","frage":"Welche Beschreibung zeigt, dass der Markt für diese Schreibtische ein unvollkommener Markt ist?","optionen":["Käufer und Verkäufer haben jederzeit alle Informationen über den Markt.","Alle Marktteilnehmer können ohne jede Beschränkung anbieten oder nachfragen.","In verschiedenen Regionen werden die Schreibtische passend zu den Wünschen der Kunden unterschiedlich angeboten.","Anbieter und Nachfrager können nur zu dem vom Markt bestimmten Preis verkaufen oder kaufen.","Die angebotenen Schreibtische unterscheiden sich überhaupt nicht."],"richtig":[2],"erklaerung":"Ein vollkommener Markt hat gleiche Güter, volle Übersicht, freien Zugang und keine Vorlieben. Sobald es Vorlieben gibt, hier je nach Region, ist der Markt unvollkommen. Alle anderen Aussagen beschreiben den vollkommenen Markt. Merksatz: Eine Präferenz reicht, schon ist der Markt unvollkommen."},{"id":"S25-18","pruefung":"Sommer 2025","nr":18,"welt":"markt","thema":"Preiselastizität der Nachfrage","typ":"mc","situation":"Die Büroblitz GmbH will den Preis ihres Kinderschreibtischs „Modell Junior“ erhöhen und lässt dafür die Preiselastizität der Nachfrage untersuchen.","frage":"Welche Aussage zur Preiselastizität der Nachfrage stimmt?","optionen":["Ist die relative Mengenänderung kleiner als die relative Preisänderung, ist die Nachfrage proportional elastisch.","Bei vollkommen elastischer Nachfrage wird jede Preiserhöhung hingenommen, weil es keine Alternative gibt.","Gibt es für die Nachfrager Ersatzgüter (Substitutionsgüter), ist eine elastische Nachfrage zu erwarten.","Bei vollkommen unelastischer Nachfrage führt eine Preiserhöhung zu deutlich weniger Umsatz.","Ist die relative Mengenänderung größer als die relative Preisänderung, ist die Nachfrage unelastisch."],"richtig":[2],"erklaerung":"Elastisch heißt: Die Kunden reagieren stark auf den Preis. Gibt es Ersatz, wie Margarine statt Butter, wechseln sie schnell. Ändert sich die Menge stärker als der Preis, ist die Nachfrage elastisch, ändert sie sich schwächer, ist sie unelastisch. Merksatz: Viele Alternativen machen die Nachfrage elastisch."},{"id":"S25-19","pruefung":"Sommer 2025","nr":19,"welt":"markt","thema":"Preiselastizität berechnen","typ":"zahl","situation":"Die Büroblitz GmbH verkauft im Monat 300 Kinderschreibtische zu je 400,00 EUR. Nach einer Preiserhöhung um 50,00 EUR je Stück erwartet das Marketing nur noch 270 verkaufte Stück pro Monat.","frage":"Wie hoch ist die erwartete Preiselastizität der Nachfrage? Gib das Ergebnis mit 1 Nachkommastelle an.","loesung":0.8,"einheit":"","toleranz":0.01,"rechenweg":"Menge: 30 von 300 = 10 % weniger. Preis: 50 von 400 = 12,5 % mehr. Elastizität = 10 : 12,5 = 0,8","erklaerung":"Die Elastizität ist die prozentuale Mengenänderung geteilt durch die prozentuale Preisänderung. 10 Prozent geteilt durch 12,5 Prozent ergibt 0,8. Weil 0,8 kleiner als 1 ist, reagieren die Kunden nur schwach, die Nachfrage ist unelastisch. Merksatz: Unter 1 unelastisch, über 1 elastisch."},{"id":"S25-20","pruefung":"Sommer 2025","nr":20,"welt":"kon","thema":"Befristete Umsatzsteuersenkung","typ":"mc","situation":"Weil die Verbraucher weniger kaufen, senkt der Staat die Umsatzsteuer für eine begrenzte Zeit. So soll der Angebotsüberhang an Gütern und Dienstleistungen abgebaut werden.","frage":"Welches Verhalten von Unternehmen und Verbrauchern ist dadurch zu erwarten?","optionen":["Die Verbraucher schieben große Anschaffungen auf, weil sie hoffen, dass es später noch billiger wird.","Die Verbraucher kaufen nur noch das Lebensnotwendige und legen den Rest langfristig an.","Die Unternehmen erhöhen die Preise der betroffenen Güter, um befürchtete Umsatzverluste auszugleichen.","Die Unternehmen erwarten mehr Nachfrage und senken deshalb ihre Investitionen, um die Preise stabil zu halten.","Die Verbraucher ziehen große Anschaffungen vor, weil sie fürchten, dass es später wieder teurer wird."],"richtig":[4],"erklaerung":"Die Steuer ist nur für kurze Zeit niedriger, die Preise also auch. Wer etwas Großes kaufen will, kauft deshalb jetzt und nicht erst, wenn es wieder teurer ist. So steigt die Nachfrage, und die Unternehmen werden ihre Waren los. Merksatz: Befristet billiger heißt jetzt kaufen."},{"id":"S25-21","pruefung":"Sommer 2025","nr":21,"welt":"markt","thema":"Unternehmenszusammenschlüsse","typ":"zuordnen","situation":"Die Kreditbank AG beobachtet Zusammenschlüsse von Unternehmen, um Beratungsbedarf und Kreditrisiken früh zu erkennen.","frage":"Welche Art von Zusammenschluss liegt jeweils vor?","kategorien":["Fusion","Kartell","Konzern","Arbeitsgemeinschaft"],"aussagen":[{"t":"Die Büroblitz GmbH legt mit Wettbewerbern einheitliche Liefer- und Rücknahmebedingungen fest.","k":1},{"t":"Die Büroblitz GmbH führt zusammen mit mehreren Firmen derselben Branche einen Großauftrag aus.","k":3},{"t":"Die Holz Schmidt GmbH und die Max Weber KG schließen sich zur Weber GmbH & Co. KG zusammen.","k":0},{"t":"Die Büroblitz GmbH hält die Mehrheit an der Sigmar Stifte KG.","k":2}],"erklaerung":"Beim Kartell sprechen Konkurrenten Bedingungen ab, bleiben aber selbstständig. Eine Arbeitsgemeinschaft arbeitet nur für einen Auftrag zusammen. Bei der Fusion verschmelzen zwei Firmen zu einer neuen. Beim Konzern hält eine Firma die Mehrheit an einer anderen, beide bleiben rechtlich bestehen. Merksatz: Absprache Kartell, Projekt ArGe, verschmolzen Fusion, Mehrheit Konzern."},{"id":"S25-22","pruefung":"Sommer 2025","nr":22,"welt":"kon","thema":"Merkmale einer Rezession","typ":"mc","frage":"Welches Merkmal passt zu einer Rezession?","optionen":["Die Konsumausgaben erreichen ein Rekordniveau.","Das Bruttoinlandsprodukt steigt in zwei Quartalen nacheinander.","Es werden weniger neue Insolvenzverfahren eröffnet.","Die Arbeitslosenquote sinkt.","Die Unternehmen verschieben geplante Neuinvestitionen auf unbestimmte Zeit."],"richtig":[4],"erklaerung":"In der Rezession läuft die Wirtschaft schlecht, die Menschen kaufen weniger. Die Unternehmen sind vorsichtig und investieren nicht. Alle anderen Merkmale gehören zu Aufschwung oder Boom. Merksatz: Rezession heißt weniger kaufen, weniger investieren."},{"id":"S25-23","pruefung":"Sommer 2025","nr":23,"welt":"kon","thema":"Erweiterter Wirtschaftskreislauf","typ":"mc","situation":"Im erweiterten Wirtschaftskreislauf fehlen drei Geldströme. Strom 1 fließt von den privaten Haushalten zu den Kapitalsammelstellen, Strom 2 vom Staat zu den Unternehmen und Strom 3 von den Unternehmen ins Ausland.","frage":"Welche Bezeichnungen gehören zu den Strömen 1, 2 und 3?","optionen":["1 Ersparnisse, 2 Einkommen, 3 Exportausgaben","1 Transferleistungen, 2 Kredite, 3 Exportausgaben","1 Ersparnisse, 2 Subventionen, 3 Importausgaben","1 Einkommen, 2 Umsatzsteuer, 3 Importausgaben","1 Kredite, 2 Steuern, 3 Importausgaben"],"richtig":[2],"erklaerung":"Was die Haushalte nicht ausgeben, sparen sie bei den Banken, das sind Ersparnisse. Der Staat zahlt Unternehmen ohne Gegenleistung Geld, das sind Subventionen. Kaufen Unternehmen Waren im Ausland, fließt Geld dorthin, das sind Importausgaben. Merksatz: Geld fließt immer entgegen der Ware."},{"id":"S25-24","pruefung":"Sommer 2025","nr":24,"welt":"kon","thema":"Konjunkturpolitik","typ":"mc","frage":"Welche staatliche Maßnahme kann kurzfristig die Konjunktur fördern?","optionen":["Subventionen und Steuererleichterungen für CO₂-sparende Maßnahmen abschaffen","Sozialleistungen des Bundes an bedürftige Menschen kürzen","Mehr Sparanreize durch höhere Einkommensgrenzen bei der staatlichen Sparförderung","Den Grundfreibetrag bei der Einkommensteuer erhöhen","Die Abschreibungssätze für Neu- und Ersatzinvestitionen in Produktionsgüter senken"],"richtig":[3],"erklaerung":"Ein höherer Grundfreibetrag heißt weniger Steuern, also mehr Netto im Geldbeutel. Mit mehr Geld kaufen die Leute mehr, und die Wirtschaft läuft besser. Die anderen Maßnahmen nehmen Geld weg oder belohnen das Sparen, das bremst. Merksatz: Mehr Netto bringt mehr Konsum und mehr Konjunktur."},{"id":"S25-25","pruefung":"Sommer 2025","nr":25,"welt":"kon","thema":"Arbeitslosenquote","typ":"mc","situation":"Die Bundesagentur für Arbeit veröffentlicht jeden Monat eine saisonbereinigte Arbeitslosenquote.","frage":"Welche Aussage über diese Arbeitslosenquote ist richtig?","optionen":["Sie setzt die registrierten Arbeitslosen ins Verhältnis zur Einwohnerzahl.","Sie ist der Anteil der saisonbereinigten registrierten Arbeitslosen an allen Einwohnern über 18 Jahren.","Sie ist ein Frühindikator und zeigt, wie viele Menschen gerade in keinem Arbeitsverhältnis stehen.","Sie setzt die registrierten Arbeitslosen ohne die Umschüler ins Verhältnis zur Zahl der offenen Stellen.","Sie setzt die registrierten Arbeitslosen, bereinigt um Saisoneinflüsse, ins Verhältnis zu den Erwerbspersonen."],"richtig":[4],"erklaerung":"Die Quote rechnet: registrierte Arbeitslose mal 100 geteilt durch alle Erwerbspersonen. Erwerbspersonen sind alle, die arbeiten oder Arbeit suchen, nicht alle Einwohner. Saisonbereinigt heißt, dass zum Beispiel der Winter herausgerechnet wird. Außerdem ist sie ein Spätindikator, kein Frühindikator. Merksatz: Arbeitslose durch Erwerbspersonen."},{"id":"S25-26","pruefung":"Sommer 2025","nr":26,"welt":"ezb","thema":"Freie Wechselkurse","typ":"mc","situation":"Zwischen Schweizer Franken (CHF) und Euro (EUR) gelten freie Wechselkurse. Schweizer Exporte werden in CHF abgerechnet.","frage":"Was bewirkt es für EUR und CHF, wenn die Schweiz mehr Waren nach Deutschland exportiert?","optionen":["Der Außenwert des EUR steigt, weil mehr EUR in Umlauf kommen.","Der EUR wertet gegenüber dem CHF auf, weil Schweizer Unternehmen verstärkt EUR in CHF tauschen müssen.","Der EUR wertet gegenüber dem CHF auf, weil deutsche Importeure vermehrt EUR in CHF tauschen müssen.","Der EUR wertet gegenüber dem CHF ab, weil am Devisenmarkt die Nachfrage nach CHF steigt.","Der EUR wertet gegenüber dem CHF ab, weil am Devisenmarkt das Angebot an CHF stärker steigt als das an EUR."],"richtig":[3],"erklaerung":"Deutsche Käufer müssen die Schweizer Waren in Franken bezahlen. Also tauschen sie Euro in Franken, die Nachfrage nach Franken steigt. Was gefragt ist, wird teurer: Der Franken wertet auf, der Euro ab. Merksatz: Mehr Nachfrage nach einer Währung macht sie stärker."},{"id":"S25-27","pruefung":"Sommer 2025","nr":27,"welt":"ezb","thema":"Zinstender holländisches Verfahren","typ":"zahl","situation":"Die EZB teilt in einem Zinstender nach holländischem Verfahren 8 Mrd. EUR zu. Gebote: Weltbank AG 2,8 Mrd. EUR zu 3,600 %, Handelsbank AG 2,0 Mrd. EUR zu 3,575 %, Kreditbank AG 2,5 Mrd. EUR zu 3,500 %, Industriebank AG 1,6 Mrd. EUR zu 3,375 %, Agrarbank AG 2,2 Mrd. EUR zu 3,250 %.","frage":"Zu welchem Zinssatz in Prozent p. a. erhält die Kreditbank AG ihre Zuteilung?","loesung":3.375,"einheit":"% p. a.","toleranz":0.0005,"rechenweg":"Nach Zinssatz sortieren: 2,8 + 2,0 + 2,5 = 7,3 Mrd. EUR, die Industriebank AG bekommt noch 0,7 Mrd. EUR zu 3,375 %. Das ist der marginale Satz, er gilt beim holländischen Verfahren für alle: 3,375 %","erklaerung":"Die EZB bedient zuerst die höchsten Gebote, bis die 8 Mrd. EUR weg sind. Das letzte Gebot, das noch etwas bekommt, liegt bei 3,375 Prozent. Beim holländischen Verfahren zahlen alle diesen einen Satz, egal was sie geboten haben. Merksatz: Holländisch heißt alle zahlen den niedrigsten noch zugeteilten Zins."},{"id":"S25-28","pruefung":"Sommer 2025","nr":28,"welt":"ezb","thema":"Geldpolitische Maßnahmen","typ":"mc","situation":"Die EZB soll vor allem die Preise im Euroraum stabil halten und setzt dafür verschiedene geldpolitische Mittel ein.","frage":"Welche Maßnahme der EZB ist geeignet, die Geldmenge im Euroraum zu senken?","optionen":["Die EZB senkt den Zinssatz für die Einlagefazilität.","Die EZB kauft den Geschäftsbanken mehr Wertpapiere ab.","Die EZB erhöht den Hauptrefinanzierungssatz.","Die EZB senkt den Mindestreservesatz für Spareinlagen.","Die EZB senkt den Zinssatz für Übernachtkredite an die Geschäftsbanken."],"richtig":[2],"erklaerung":"Steigt der Leitzins, wird Geld von der EZB für die Banken teurer. Die Banken geben die höheren Zinsen an ihre Kunden weiter, es werden weniger Kredite aufgenommen, die Geldmenge sinkt. Alle anderen Maßnahmen machen Geld billiger oder bringen mehr Geld in Umlauf. Merksatz: Zins rauf, Geldmenge runter."}];

/* ===================== Crashkurs IHK · Steuerung ===================== */
const SUBS={liga,erfolge,shop,einstellungen,features,glossar,formeln,tipps,suche};
function modus(m,el){
  const tc=n=>neueZuerst(n).slice(0,10);
  if(m==='daily')return starte({mode:'daily',list:seedShuffle(AUFG,heute()).slice(0,10)});
  if(m==='fehler')return starte({mode:'fehler',list:tc(AUFG.filter(a=>S.stat[a.id]&&S.stat[a.id].lastOk===false))});
  if(m==='wdh')return starte({mode:'wdh',list:AUFG.filter(a=>faellig(a.id)).sort((a,b)=>(S.stat[a.id].box||0)-(S.stat[b.id].box||0)).slice(0,10)});
  if(m==='schwach'){const t=themaQuoten().sort((a,b)=>a.q-b.q).slice(0,3).map(x=>x.t);if(!t.length){toast('Erst ein paar Aufgaben lösen, dann kenne ich deine Schwächen','🎯');return starte({mode:'zufall',list:shuffle(AUFG.slice()).slice(0,10)})}
    return starte({mode:'schwach',list:shuffle(AUFG.filter(a=>t.includes(a.thema))).slice(0,10)})}
  if(m==='karten')return kartenWahl();
  if(m==='blitz'){const l=shuffle(AUFG.filter(a=>a.typ==='mc'));return starte({mode:'blitz',list:l,pool:l})}
  if(m==='surv')return starte({mode:'surv',list:shuffle(AUFG.slice())});
  if(m==='zufall')return starte({mode:'zufall',list:shuffle(AUFG.slice()).slice(0,10)});
  if(m==='fav')return starte({mode:'fav',list:shuffle(AUFG.filter(a=>S.fav[a.id]))});
  if(m==='sim')return starte({mode:'sim',list:examMix()});
  if(m==='examliste')return examListe();
  if(m==='themen')return themenListe();
  if(m.startsWith('typ-')){const t=m.slice(4);return starte({mode:'typ',list:tc(AUFG.filter(a=>a.typ===t))})}
  if(m==='welt'){const k=el.dataset.welt;return starte({mode:'thema',k,list:tc(pool(k))})}
  if(SUBS[m])return sub(SUBS[m]);
}

function exportieren(){const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>toast('Fortschritt kopiert. Füg ihn auf dem anderen Gerät ein.','📋'),()=>zeigeText(t))}catch(e){zeigeText(t)}}
function zeigeText(t){layer(`<div class="dim" data-act="close"><div class="sheet"><h2>Dein Fortschritt</h2><p class="muted">Alles markieren und kopieren.</p><textarea class="such ta" readonly>${esc(t)}</textarea></div></div>`)}
function importieren(){layer(`<div class="dim" data-act="close"><div class="sheet"><h2>Fortschritt einfügen</h2><p class="muted">Füg hier den kopierten Text ein. Dein jetziger Stand wird ersetzt.</p><textarea class="such ta" id="imp" placeholder="{…}"></textarea><div class="btns"><button class="btn" data-act="importok">Übernehmen</button></div></div></div>`)}
function importOk(){try{const d=JSON.parse($('#imp').value);if(typeof d!=='object'||d.xp===undefined)throw 0;const neu=S0();S=Object.assign(neu,d);['inv','outfit','streak','rek','zahl','flags','liga'].forEach(k=>S[k]=Object.assign(S0()[k],d[k]||{}));save();themaSetzen();toast('Fortschritt übernommen!','✅');sfx('win');zeigeTab('pfad',true)}catch(e){sfx('boing');toast('Das sieht nicht nach einem Fortschritt aus','🤔')}}
function resetFrage(){layer(`<div class="dim" data-act="close"><div class="sheet"><h2>Alles löschen?</h2><div class="say">${maskot('shock','😱',.1)}<div class="bubble">XP, Sterne, Knete, Outfits, Statistik. Alles weg. Sicher?</div></div><div class="btns"><button class="btn" data-act="close">Nein, behalten</button><button class="btn light rot" data-act="resetja">Ja, alles löschen</button></div></div></div>`)}
async function teilen(){const d={title:'Crashkurs IHK',text:'WiSo lernen mit 168 echten IHK-Aufgaben und einem Crashtest-Dummy, der dir den Mittelfinger zeigt.',url:location.href.split('?')[0]};
  try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(d.url);toast('Link kopiert','🔗')}}catch(e){}}

document.addEventListener('click',e=>{
  if(justDragged)return;
  const b=e.target.closest('button,[data-act],[data-modus],[role=button]');if(!b)return;const ds=b.dataset;
  if(ds.act==='close'&&e.target!==b&&b.tagName!=='BUTTON')return;
  if(ds.tab)return zeigeTab(ds.tab);
  if(ds.sub){layer('');return sub(SUBS[ds.sub])}
  if(ds.lesson)return lektionMenu(ds.lesson);
  if(ds.unitboss)return bossMenu(ds.unitboss);
  if(ds.play){const l=LEK[ds.play];return starte({mode:'lesson',lesson:l.id,k:l.k,list:shuffle(l.list.slice())})}
  if(ds.bossplay){const k=ds.bossplay;return starte({mode:'boss',k,list:neueZuerst(pool(k)).slice(0,BOSS_N)})}
  if(ds.lern)return spick(ds.lern);
  if(ds.exam){const p=ds.exam;return starte({mode:'exam',exam:p,list:p==='*'?examMix():AUFG.filter(a=>a.pruefung===p).sort((a,b)=>a.nr-b.nr)})}
  if(ds.modus)return modus(ds.modus,b);
  if(ds.thema)return starte({mode:'thema',list:shuffle(AUFG.filter(a=>a.thema===ds.thema)).slice(0,10)});
  if(ds.einzel)return starte({mode:'einzel',list:[AID[ds.einzel]]});
  if(ds.karten){layer('');const l=ds.karten==='faellig'?neueZuerst(AUFG).sort((a,b)=>((S.stat[b.id]||{}).lastOk===false)-((S.stat[a.id]||{}).lastOk===false)||faellig(b.id)-faellig(a.id)):neueZuerst(pool(ds.karten));return kartenStart(l,'Lernkarten')}
  if(ds.kartenLek){layer('');return kartenStart(LEK[ds.kartenLek].list,'Lernkarten')}
  if(ds.karte!==undefined)return karteWerten(ds.karte==='1');
  if(ds.shop)return shopKlick(ds.shop);
  if(ds.kauf)return kaufen(ds.kauf);
  if(ds.seg){const k=ds.seg,v=isNaN(+ds.v)?ds.v:+ds.v;S[k]=v;save();sfx('tap');haptic();themaSetzen();return einstellungen()}
  if(ds.obz){S.ziel=+ds.obz;document.querySelectorAll('[data-obz]').forEach(x=>x.classList.toggle('an',x===b));sfx('tap');haptic();return}
  if(R&&!R.done&&!R.karten){
    if(ds.o!==undefined){const i=+ds.o;sfx('tap');haptic();
      if(R.q.typ==='multi')R.sel=R.sel.includes(i)?R.sel.filter(x=>x!==i):[...R.sel,i];else R.sel=i;
      document.querySelectorAll('.ans').forEach((x,j)=>x.classList.toggle('sel',R.q.typ==='multi'?R.sel.includes(j):j===R.sel));if(R.mode==='blitz')pruefen();return}
    if(ds.k!==undefined){const k=+ds.k;R.chip=R.chip===k?null:k;sfx('pick');haptic();return zuMalen()}
    if(ds.row!==undefined){const j=+ds.row;if(R.chip!==null)return setzeZu(j,R.chip);if(R.zu[j]!==null){R.zu[j]=null;sfx('tap');return zuMalen()}sfx('boing');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
    if(ds.up!==undefined||ds.down!==undefined){const p=+(ds.up??ds.down),t=ds.up!==undefined?p-1:p+1;if(t<0||t>=R.ord.length)return;[R.ord[p],R.ord[t]]=[R.ord[t],R.ord[p]];sfx('tap');haptic();return sortNeu()}
  }
  const a=ds.act;if(!a)return;
  ({
   los,close:()=>{sfx('tap');layer('')},snd:()=>{S.sound=!S.sound;save();if(S.sound)sfx('pick');const s=$('.snd');if(s)s.textContent=S.sound?'🔊':'🔇'},
   crashi:()=>crashiTap(b),name:nameAendern,nameok:()=>{S.name=($('#nin').value||'').trim().slice(0,20);save();layer('');sfx('kasse');zeigeTab(TAB,true)},
   teilen,weiterlernen,examliste:examListe,zurueck:()=>zeigeTab(TAB),home:()=>zeigeTab(TAB,true),
   check:pruefen,weiter:()=>{layer('');R.i++;sfx('whoosh');frage()},ende,quit:quitFrage,quitja:()=>zeigeTab(TAB),
   vorlesen:()=>R&&vorlesen([R.q.situation,R.q.frage,...(R.q.optionen||[]).map((o,i)=>`${i+1}: ${o}`)].filter(Boolean).join('. ')),
   'vorlesen-erkl':()=>R&&vorlesen(R.q.erklaerung),
   fav:()=>{const id=R.q.id;S.fav[id]=!S.fav[id];if(!S.fav[id])delete S.fav[id];save();sfx('pick');haptic();document.querySelectorAll('[data-act=fav]').forEach(x=>{x.classList.toggle('on',!!S.fav[id]);x.textContent=x.closest('.fbtools')?(S.fav[id]?'★ Gemerkt':'☆ Merken'):(S.fav[id]?'★':'☆')});toast(S.fav[id]?'Gemerkt':'Nicht mehr gemerkt','⭐')},
   joker,tipp,kiste:kisteOeffnen,flip:karteDrehen,
   export:exportieren,import:importieren,importok:importOk,reset:resetFrage,
   resetja:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=S0();save();themaSetzen();layer('');zeigeTab('pfad',true);onboarding()},
   obfertig:()=>{S.name=($('#obn').value||'').trim().slice(0,20);S.onboard=true;S.v=VERSION;save();layer('');sfx('win');konfetti(150);toast(`Los gehts${S.name?', '+S.name:''}!`,'🚀');zeigeTab('pfad',true)}
  })[a]?.();
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.set;if(!k)return;S[k]=e.target.checked;save();haptic();
  if(k==='musik')S.musik?musikStart():musikStop();if(k==='sound'&&S.sound)sfx('pick');if(k==='fx')themaSetzen()});
document.addEventListener('keydown',e=>{if(!R||R.karten||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(!R.done&&/^[1-9]$/.test(e.key)){const b=document.querySelectorAll('.ans,.chip')[+e.key-1];if(b)b.click()}
  if(e.key==='Enter'){const b=$('#layer [data-act=weiter], #layer [data-act=ende]')||(!R.done&&$('#chk'));if(b)b.click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)musikStop();else if(S.musik&&AC)musikStart()});
if('serviceWorker' in navigator){let erst=!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!erst)toast('Neue Version geladen. Einmal neu öffnen für alles Neue.','✨');erst=false})}
