eln ihre Bestellungen beim Großhändler, um mehr Mengenrabatt zu bekommen.","Die Bewohner einer Kleinstadt können Trinkwasser nur von den Stadtwerken beziehen."],"richtig":[2],"erklaerung":"Längere Zeit unter Einstandspreis verkaufen heißt Preisdumping. Damit sollen Konkurrenten aus dem Markt gedrängt werden, das verbietet das GWB. Mit 10 % der Leitungen ist der Telefonanbieter nicht marktbeherrschend, und kleine Bäckereien dürfen zusammen einkaufen. Merksatz: Dauerhaft unter Einkaufspreis ist Dumping und verboten."},{"id":"S22-22","pruefung":"Sommer 2022","nr":22,"welt":"kon","thema":"Wachstumspolitik","typ":"mc","situation":"Die Bundesregierung will gegen das niedrige Wirtschaftswachstum etwas tun.","frage":"Welche Kombination von Maßnahmen ist dafür am besten geeignet?","optionen":["CO2-Steuer auf fossile Brennstoffe und gleichzeitig keine Subventionen mehr für Flugbenzin","Mehr Zuschuss für Weiterbildung bei Arbeitslosigkeit, bezahlt durch gleich hohe Kürzung von Arbeitslosengeld I und II","Höherer Spitzensteuersatz und gleichzeitig niedrigerer Grundfreibetrag bei der Einkommensteuer","Höherer Beitrag zur Arbeitslosenversicherung und höhere Beitragsbemessungsgrenze in der Rentenversicherung","Fördergeld für Entwicklung und Einsatz neuer Technologien, bezahlt mit neuen Staatsschulden"],"richtig":[4],"erklaerung":"Fördergeld für neue Technik bringt Forschung und Investitionen in Gang, das schafft Wachstum. Weil es über Schulden bezahlt wird, nimmt man niemandem Geld weg. Alle anderen Kombinationen belasten Bürger oder Firmen oder schichten nur um, dann wird weniger gekauft. Merksatz: Wachstum braucht zusätzliches Geld, nicht umverteiltes."},{"id":"S22-23","pruefung":"Sommer 2022","nr":23,"welt":"kon","thema":"Konjunkturindikatoren","typ":"mc","frage":"Welcher Indikator zeigt der Kreditbank AG die Konjunktur besonders früh an?","optionen":["Die Zahl der Insolvenzen von Start-up-Unternehmen","Der ifo-Geschäftsklimaindex","Das aktuelle Zinsniveau am Geld- und Kapitalmarkt","Der harmonisierte Verbraucherpreisindex","Die Arbeitslosenquote"],"richtig":[1],"erklaerung":"Beim ifo-Index werden jeden Monat rund 7.000 Firmen nach Lage und Erwartungen gefragt, deshalb zeigt er früh, wohin es geht. Insolvenzen, Arbeitslosenquote und Preise reagieren erst später, sie sind Spätindikatoren. Das Zinsniveau zeigt nur die Gegenwart. Merksatz: Erwartungen sind Frühindikatoren."},{"id":"S22-24","pruefung":"Sommer 2022","nr":24,"welt":"kon","thema":"Arbeitsmarktpolitik","typ":"mc","frage":"Welche staatliche Maßnahme senkt die aktuelle Arbeitslosenquote am besten?","optionen":["Das Rentenalter für Arbeitnehmer wird angehoben.","Grundfreibetrag und Spitzensteuersatz der Einkommensteuer werden erhöht.","Programme zur Weiterbildung der Erwerbstätigen werden ausgebaut.","Ein Ausbildungspakt schafft neue Ausbildungs- und Praktikumsstellen.","Kurzarbeitergeld wird kürzer gezahlt."],"richtig":[3],"erklaerung":"Neue Ausbildungsstellen holen junge Leute direkt in Arbeit, die sonst arbeitssuchend wären. Ein höheres Rentenalter und kürzeres Kurzarbeitergeld machen eher mehr Menschen arbeitslos. Weiterbildung hilft denen, die schon Arbeit haben. Merksatz: Neue Stellen senken die Quote."},{"id":"S22-25","pruefung":"Sommer 2022","nr":25,"welt":"kon","thema":"Erweiterter Wirtschaftskreislauf","typ":"zuordnen","situation":"Ein offener Wirtschaftskreislauf zeigt neun nummerierte Geldströme zwischen Unternehmen, privaten Haushalten, Staat, Kapitalsammelstellen und Ausland.","frage":"Welcher Geldstrom passt zu welchem Vorgang? Frag dich immer: Wer zahlt an wen?","kategorien":["1: Staat → Unternehmen","2: Private Haushalte → Staat","3: Unternehmen → Staat","4: Kapitalsammelstellen → Unternehmen","5: Private Haushalte → Ausland","6: Private Haushalte → Unternehmen","7: Ausland → Private Haushalte","8: Unternehmen → Private Haushalte","9: Private Haushalte → Kapitalsammelstellen"],"aussagen":[{"t":"Die Büroblitz GmbH nimmt ihren Betriebsmittelkredit über 120.000,00 EUR bei der Kreditbank AG in Anspruch.","k":3},{"t":"Anna-Sophia Lehmann überweist für ihr Auslandssemester 5.000 US-Dollar Kaution an ihren Vermieter in den USA.","k":4},{"t":"Die Büroblitz GmbH zahlt 51.856,00 EUR Gewerbesteuer an das Finanzamt.","k":2},{"t":"Kai Mitschke kauft für seine Renovierung eine Bohrmaschine für 369,00 EUR.","k":5},{"t":"Leon Meißner bekommt von der Büroblitz GmbH 1.081,00 EUR Ausbildungsvergütung.","k":7}],"erklaerung":"Schau nur, wer Geld abgibt und wer es bekommt. Die Bank ist eine Kapitalsammelstelle und gibt der Firma den Kredit (4), die Miete in den USA zahlt ein Haushalt ins Ausland (5), die Steuer geht von der Firma an den Staat (3). Der Einkauf geht vom Haushalt zur Firma (6), die Vergütung von der Firma zum Haushalt (8). Merksatz: Geld fließt immer vom Zahler zum Empfänger."},{"id":"S22-26","pruefung":"Sommer 2022","nr":26,"welt":"kon","thema":"Verbraucherpreisindex, Kaufkraft","typ":"zahl","situation":"2019 bekamen die Beschäftigten der Kreditbank AG im Schnitt 45.124,50 EUR netto im Jahr. Der Verbraucherpreisindex (2015 = 100) lag 2019 bei 100,5, 2020 bei 102,0, 2021 bei 103,8 und 2022 bei 105,3.","frage":"Wie hoch müsste das durchschnittliche Jahresnettogehalt 2022 sein, damit der Kaufkraftverlust ausgeglichen ist?","loesung":47279.7,"einheit":"EUR","toleranz":0.01,"rechenweg":"45.124,50 EUR × 105,3 : 100,5 = 47.279,70 EUR","erklaerung":"Das Gehalt muss genauso stark steigen wie die Preise. Dafür teilt man durch den Index von 2019 und nimmt mal den Index von 2022, die Jahre dazwischen braucht man nicht. Merksatz: Neues Gehalt gleich altes Gehalt mal neuer Index durch alter Index."},{"id":"S22-27","pruefung":"Sommer 2022","nr":27,"welt":"ezb","thema":"Leistungsbilanz und Außenbeitrag","typ":"mc","situation":"Saldo der Leistungsbilanz und darunter Außenbeitrag in Mrd. EUR (bereinigt): Dezember 2021: 22,07 und 3,34 · Januar 2022: 17,40 und 12,64 · Februar 2022: 10,5 und minus 1,51 · März 2022: 7,46 und 9,41.","frage":"Welche Aussage lässt sich aus den Zahlen ablesen?","optionen":["Im Februar 2022 wurden mehr Waren und Dienstleistungen importiert als exportiert.","Im Januar 2022 lagen die Exporte um 4,76 Mrd. EUR über den Importen.","Wegen höherer Importüberschüsse bei Waren und Dienstleistungen ist der Leistungsbilanzsaldo im März 2022 gesunken.","Der Außenbeitrag zeigt für Januar 2022 einen hohen Importüberschuss, der 72,6 % der Leistungsbilanz ausmacht.","Im Dezember 2021 waren die Warenexporte um 3,34 Mrd. EUR niedriger als die Importe."],"richtig":[0],"erklaerung":"Der Außenbeitrag ist Exporte minus Importe von Waren und Dienstleistungen. Im Februar ist er negativ, also wurde mehr eingeführt als ausgeführt. Im Januar, März und Dezember ist er positiv, dort gab es Exportüberschüsse. Merksatz: Außenbeitrag im Minus heißt mehr Importe."},{"id":"S22-28","pruefung":"Sommer 2022","nr":28,"welt":"ezb","thema":"EZB und ESZB","typ":"mc","frage":"Welche Aussage zur EZB oder zum Europäischen System der Zentralbanken (ESZB) stimmt?","optionen":["Die EZB ist abhängig, hat keine eigene Rechtspersönlichkeit und wird vom EU-Parlament politisch und finanziell kontrolliert.","Weil die EZB in Frankfurt sitzt, gilt für sie deutsches Recht und sie muss Weisungen der BaFin befolgen.","Das ESZB unterstützt die Wirtschaftspolitik der EU, soweit das Hauptziel Preisniveaustabilität nicht darunter leidet.","Zum ESZB gehören nur die EZB und die Zentralbanken der Länder mit dem Euro.","Die EZB beaufsichtigt alle Kreditinstitute mit Hauptsitz in einem EU-Staat."],"richtig":[2],"erklaerung":"Das erste Ziel ist stabile Preise, erst danach hilft das ESZB der Wirtschaftspolitik der EU. Die EZB ist unabhängig und ein Organ der EU, die BaFin hat ihr nichts zu sagen. Zum ESZB gehören die Zentralbanken aller EU-Staaten, nur die Euro-Länder bilden das Eurosystem. Die EZB beaufsichtigt nur die großen Banken der Eurozone. Merksatz: Erst Preisstabilität, dann Wirtschaftspolitik."},{"id":"W2324-1","pruefung":"Winter 2023/24","nr":1,"welt":"recht","thema":"Rechtsgeschäfte Minderjähriger","typ":"mc","situation":"Die 14-jährige Schülerin Jeanette Pachmann kauft in einem Fachgeschäft ein Smartphone für 999,00 EUR.","frage":"Welche Aussage über die Wirksamkeit dieses Kaufvertrags trifft zu?","optionen":["Der Vertrag ist nichtig, weil Jeanette geschäftsunfähig ist und keine wirksamen Willenserklärungen abgeben kann.","Der Vertrag ist wirksam, weil zwei übereinstimmende Willenserklärungen vorliegen.","Der Vertrag ist wirksam, weil Jeanette beim Kauf rechtsfähig ist.","Der Vertrag ist nichtig, wenn ihr gesetzlicher Vertreter die Zustimmung verweigert.","Der Vertrag ist wirksam, wenn Jeanette mit ihren Ersparnissen bezahlt."],"richtig":[3],"erklaerung":"Mit 14 ist Jeanette beschränkt geschäftsfähig. Ohne Einwilligung der Eltern ist der Vertrag erst schwebend unwirksam. Sagen die Eltern nein, ist er von Anfang an nichtig. Der Taschengeldparagraf hilft bei 999 EUR nicht. Merksatz: 7 bis 17 heißt schwebend unwirksam, bis die Eltern Ja oder Nein sagen."},{"id":"W2324-2","pruefung":"Winter 2023/24","nr":2,"welt":"recht","thema":"Gesetzliche Formvorschriften","typ":"zuordnen","frage":"Welche gesetzliche Formvorschrift gilt für das jeweilige Rechtsgeschäft?","kategorien":["Textform","Schriftform","Notarielle Beurkundung","keine gesetzliche Formvorschrift"],"aussagen":[{"t":"Wolfgang Roth bürgt gegenüber der Kreditbank AG für das Verbraucherdarlehen seines Sohnes.","k":1},{"t":"Sandra Färber widerruft den Kauf eines Paars Schuhe bei einem Online-Händler.","k":3},{"t":"Das Ehepaar Fritz und Simone Groß kauft eine Eigentumswohnung.","k":2}],"erklaerung":"Eine Bürgschaft muss ein Privatmann schriftlich erklären. Ein Widerruf beim Online-Kauf muss nur klar erklärt werden, notfalls auch am Telefon, eine Form ist nicht vorgeschrieben. Grundstücke und Wohnungen kauft man nur beim Notar. Merksatz: Bürgschaft schriftlich, Immobilie beim Notar. Hinweis: In der echten Prüfung gab es für den Widerruf keine passende Ziffer, dieser Teil wurde nicht gewertet."},{"id":"W2324-3","pruefung":"Winter 2023/24","nr":3,"welt":"recht","thema":"Arten von Rechtsgeschäften","typ":"mc","frage":"Bei welchem Vorgang entsteht das Rechtsgeschäft durch eine einseitige, nicht empfangsbedürftige Willenserklärung?","optionen":["Die Büroblitz GmbH nimmt die Lieferung Kopierpapier eines Stammlieferanten an.","Der Personalleiter kündigt einem Außendienstmitarbeiter außerordentlich.","Die Büroblitz GmbH schließt mit einem Druckerhersteller einen Wartungsvertrag für ihre Drucker.","Die Büroblitz GmbH mahnt einen säumigen Kunden und setzt ihm eine Nachfrist.","Der Geschäftsführer setzt in seinem Testament seine Tochter als Alleinerbin ein."],"richtig":[4],"erklaerung":"Ein Testament schreibt einer allein, und es gilt, ohne dass die Tochter es bekommen muss. Kündigung und Mahnung sind zwar auch einseitig, müssen aber beim anderen ankommen. Kauf und Wartung sind Verträge mit zwei Seiten. Merksatz: Testament ist einseitig und muss niemandem zugehen."},{"id":"W2324-4","pruefung":"Winter 2023/24","nr":4,"welt":"recht","thema":"Besitz und Eigentum","typ":"mc","situation":"Eine Beraterin der Kreditbank AG verkauft Günther Maier eine Goldmünze für 1.880,45 EUR und gibt sie ihm. Sein Konto wird mit dem Kaufpreis belastet.","frage":"Welche Aussage beschreibt Besitz und Eigentum an der Münze nach dem BGB richtig?","optionen":["Herr Maier ist nur deshalb unmittelbarer Besitzer, weil er die Münze rechtmäßig erworben hat.","Mit dem Besitz hat er die rechtliche, mit dem Eigentum die tatsächliche Herrschaft über die Münze.","Legt er die Münze in sein gemietetes Schließfach bei der Kreditbank AG, bleibt er unmittelbarer Besitzer.","Unmittelbarer Besitzer kann er nur werden, wenn ihm die Bank vorher das Eigentum überträgt.","Eigentümer wird er erst, wenn sein Konto mit dem Kaufpreis belastet ist."],"richtig":[2],"erklaerung":"Besitz heißt: Ich habe die Sache tatsächlich in der Hand. Eigentum heißt: Sie gehört mir rechtlich. Nur Herr Maier kommt an sein Schließfach, also hat er die Münze weiter tatsächlich in seiner Gewalt. Eigentum an beweglichen Sachen geht über Einigung und Übergabe über, nicht über die Zahlung. Merksatz: Besitz ist haben, Eigentum ist gehören."},{"id":"W2324-5","pruefung":"Winter 2023/24","nr":5,"welt":"recht","thema":"Ablauf eines Kaufvertrags","typ":"reihenfolge","situation":"Die Kreditbank AG braucht 40 neue Stehtische und nimmt das Angebot der Büroblitz GmbH an. Gezahlt wird mit einem Zahlungsziel von 14 Tagen nach Erhalt der Ware.","frage":"Bringe die Schritte dieses Geschäfts in die richtige zeitliche Reihenfolge.","schritte":["Angebot der Büroblitz GmbH an die Kreditbank AG","Bestellung der Stehtische durch die Kreditbank AG","Eingang der Auftragsbestätigung bei der Kreditbank AG","Lieferung der Stehtische mit Rechnung","Überweisung des Rechnungsbetrags an die Büroblitz GmbH"],"erklaerung":"Erst bietet der Verkäufer an, dann bestellt der Käufer, dann bestätigt der Verkäufer. Danach kommt die Ware mit Rechnung, und weil es ein Zahlungsziel gibt, wird erst am Ende bezahlt. Merksatz: Angebot, Bestellung, Bestätigung, Lieferung, Zahlung."},{"id":"W2324-6","pruefung":"Winter 2023/24","nr":6,"welt":"recht","thema":"Zahlungsverzug","typ":"mc","situation":"Die Rechnung der Büroblitz GmbH für die Stehtische geht der Kreditbank AG am 07.11.2023 zu, mit dem Vermerk „zahlbar bis 20.11.2023 ohne Abzüge“. Wegen einer erkrankten Mitarbeiterin zahlt die Bank nicht rechtzeitig.","frage":"Wie ist die Rechtslage?","optionen":["Nach Ablauf der Frist muss die Büroblitz GmbH gesetzlich 5 % Verzugszinsen über dem Basiszinssatz verlangen.","Die Bank kommt erst in Verzug, wenn sie schriftlich mit konkretem Zahlungsdatum gemahnt wurde.","Weil sie nicht gezahlt hat, ist die Bank mit Ablauf des 20.11.2023 in Zahlungsverzug.","Die Bank kommt frühestens mit Ablauf des 20.12.2023 auch ohne Mahnung in Verzug.","Die Bank kommt 30 Tage nach Rechnungserhalt, also mit Ablauf des 07.12.2023, in Verzug."],"richtig":[2],"erklaerung":"Steht ein fester Zahltag auf der Rechnung, ist man nach diesem Tag sofort im Verzug, ohne Mahnung. Die 30-Tage-Regel gilt nur, wenn kein Termin genannt ist. Zwischen zwei Firmen wären es 9 % über Basiszins, und verlangen darf man sie, muss aber nicht. Merksatz: Fester Termin verpasst heißt sofort Verzug."},{"id":"W2324-7","pruefung":"Winter 2023/24","nr":7,"welt":"recht","thema":"Allgemeine Geschäftsbedingungen","typ":"mc","situation":"In den Kaufverträgen der Büroblitz GmbH mit Verbrauchern steht ein Hinweis auf ihre AGB, die man auch auf der Homepage nachlesen kann.","frage":"Welche Information über die AGB ist richtig?","optionen":["Weil die Büroblitz GmbH Kaufmann ist, sind die AGB im Handelsgesetzbuch geregelt.","Widerspricht der Verbraucher den AGB nicht, werden sie Teil des jeweiligen Kaufvertrags.","AGB sind allgemeine Vertragsbedingungen, für deren Inhalt es keine gesetzlichen Grenzen gibt.","AGB sind zusätzliche Regeln, die mit jedem Verbraucher einzeln ausgehandelt werden.","Ist eine AGB-Regel unwirksam, gilt stattdessen das, was dem Willen der Büroblitz GmbH am nächsten kommt."],"richtig":[1],"erklaerung":"AGB gelten nur, wenn der Kunde deutlich darauf hingewiesen wird, sie lesen kann und nicht widerspricht. Sie stehen im BGB, nicht im HGB. Ist eine Klausel unwirksam, gilt das Gesetz. Merksatz: Hinweis, Einsicht, Einverständnis, dann gelten die AGB."},{"id":"W2324-8","pruefung":"Winter 2023/24","nr":8,"welt":"recht","thema":"Widerruf bei Fernabsatzverträgen","typ":"mc","situation":"Andrea Hemmer kauft bei einem Online-Händler eine Handtasche. Nach der Lieferung will sie den Kauf widerrufen.","frage":"In welchem Fall widerruft Frau Hemmer den Vertrag nach dem BGB wirksam?","optionen":["Sie erklärt binnen 14 Tagen nach Erhalt per E-Mail den Widerruf und schickt die Tasche in dieser Frist zurück.","Sie muss sich selbst über die Widerrufsregeln informieren und die Tasche spätestens nach 4 Wochen zurückschicken.","Sie muss das Formular des Händlers ausfüllen und es spätestens 20 Tage nach Erhalt mit der Tasche zurücksenden.","Sie schickt die Tasche innerhalb von 30 Tagen ohne ausdrückliche Widerrufserklärung zurück.","Sie kann nur telefonisch binnen 14 Tagen und nur mit einem ausreichenden Grund widerrufen."],"richtig":[0],"erklaerung":"Beim Online-Kauf hat der Verbraucher 14 Tage Zeit zum Widerruf. Er muss ihn klar erklären, ein Formular oder ein Grund ist nicht nötig. Nur die Ware zurückschicken reicht nicht. Merksatz: 14 Tage, klar sagen, ohne Grund."},{"id":"W2324-9","pruefung":"Winter 2023/24","nr":9,"welt":"arbeit","thema":"Sicherheitsbeauftragter","typ":"mc","situation":"Die Kreditbank AG hat einen neuen Sicherheitsbeauftragten bestellt.","frage":"Welche Aussage über den Sicherheitsbeauftragten ist nach den rechtlichen Vorschriften richtig?","optionen":["Er darf den Beschäftigten beim Arbeitsschutz Weisungen erteilen.","Er ist bei Gefahr für die Räumung der Gebäude und die Meldung an die Einsatzleitung verantwortlich.","Er erfasst alle technischen Mängel, Arbeitsunfälle und Berufskrankheiten und entwickelt Gegenstrategien.","Er ist für den ordentlichen Zustand und die richtige Nutzung der Erste-Hilfe-Kästen verantwortlich.","Er unterstützt die Kreditbank AG bei den Maßnahmen zur Verhütung von Arbeitsunfällen."],"richtig":[4],"erklaerung":"Der Sicherheitsbeauftragte ist ein normaler Kollege, der dem Chef beim Unfallschutz hilft. Er darf niemandem etwas befehlen und trägt nicht mehr Verantwortung als andere. Für Erste Hilfe ist der Arbeitgeber zuständig. Merksatz: Er unterstützt, er befiehlt nicht."},{"id":"W2324-10","pruefung":"Winter 2023/24","nr":10,"welt":"arbeit","thema":"Umweltschutz und Mülltrennung","typ":"zuordnen","situation":"Die Büroblitz GmbH will ihre Beschäftigten über richtige Mülltrennung informieren. Es gibt nur drei Behälter: Gelbe Tonne, Blaue Tonne und Restmüll.","frage":"In welchen Behälter gehört der jeweilige Abfall? Passt keiner der drei, wähle „keine Zuordnung“.","kategorien":["Gelbe Tonne / Wertstoffbehälter Kunststoffe","Blaue Tonne / Wertstoffbehälter Papier","Restmüllbehälter","keine Zuordnung"],"aussagen":[{"t":"Glasflaschen","k":3},{"t":"Batterien","k":3},{"t":"Verschmutzte Pizzakartons","k":2},{"t":"Zeitungen und Pappe","k":1},{"t":"Plastiktüten","k":0}],"erklaerung":"Plastik kommt in die Gelbe Tonne, sauberes Papier in die Blaue. Ein fettiger Pizzakarton ist kein gutes Altpapier mehr und gehört in den Restmüll. Glas gehört in den Glascontainer und Batterien zur Sammelstelle, beide also in keinen der drei Behälter. Merksatz: Fett auf Pappe heißt Restmüll."},{"id":"W2324-11","pruefung":"Winter 2023/24","nr":11,"welt":"arbeit","thema":"Probezeit in der Ausbildung","typ":"mc","situation":"Heike Abele, 19 Jahre, beginnt am 01.09.2023 bei der Büroblitz GmbH eine Ausbildung zur Kauffrau für Büromanagement, die am 31.08.2025 endet. Im Vertrag ist eine Probezeit vereinbart.","frage":"Wie lange darf die Probezeit nach dem Gesetz höchstens dauern?","optionen":["1 Monat","3 Monate","4 Monate","5 Monate","6 Monate"],"richtig":[2],"erklaerung":"Nach dem Berufsbildungsgesetz dauert die Probezeit in der Ausbildung mindestens einen und höchstens vier Monate. Die sechs Monate kennt man aus normalen Arbeitsverträgen. Merksatz: Ausbildung 1 bis 4 Monate Probezeit."},{"id":"W2324-12","pruefung":"Winter 2023/24","nr":12,"welt":"arbeit","thema":"Fälligkeit der Ausbildungsvergütung","typ":"zahl","situation":"Heike Abele bekommt von der Büroblitz GmbH, die nicht tarifgebunden ist, eine monatliche Ausbildungsvergütung. § 18 BBiG sagt sinngemäß: Die Vergütung für den laufenden Monat ist spätestens am letzten Arbeitstag des Monats zu zahlen. Der 30.11.2023 ist ein Donnerstag.","frage":"Bis zu welchem Tag im November 2023 muss die Vergütung für November spätestens gezahlt sein? Gib nur den Tag als Zahl ein.","loesung":30,"einheit":". November 2023","toleranz":0,"rechenweg":"Letzter Arbeitstag im November 2023 ist Donnerstag, der 30.11.2023.","erklaerung":"Azubis bekommen ihr Geld spätestens am letzten Arbeitstag des laufenden Monats, nicht erst im Folgemonat. Der 30.11.2023 ist ein Werktag, also ist das der Stichtag. Merksatz: Ausbildungsgeld kommt im selben Monat, spätestens am letzten Arbeitstag."},{"id":"W2324-13","pruefung":"Winter 2023/24","nr":13,"welt":"arbeit","thema":"Betriebsrat bei ordentlicher Kündigung","typ":"mc","situation":"Die Büroblitz GmbH kündigt vier Beschäftigten ordentlich. Nach § 102 BetrVG muss der Betriebsrat vor jeder Kündigung angehört werden. Hat er Bedenken, teilt er sie binnen einer Woche schriftlich mit, sonst gilt seine Zustimmung als erteilt.","frage":"Welche Aussage über die Kündigungen trifft zu?","optionen":["Hat der Betriebsrat zugestimmt, können die Gekündigten nicht mehr vor das Arbeitsgericht ziehen.","Bei der Anhörung des Betriebsrats mussten die Betroffenen dabei sein, um die Gründe zu erfahren.","Widerspricht der Betriebsrat, muss das Arbeitsgericht die Weiterbeschäftigung anordnen.","Hat der Betriebsrat nicht widersprochen, müssen die Arbeitsverhältnisse nach der Kündigungsfrist weiterlaufen.","Hatte der Betriebsrat keine Bedenken, durfte er die Wochenfrist ohne Stellungnahme verstreichen lassen."],"richtig":[4],"erklaerung":"Der Betriebsrat muss gefragt werden, aber wenn er nichts sagt, gilt das nach einer Woche als Ja. Eine Kündigungsschutzklage ist trotzdem immer möglich. Weiterbeschäftigung gibt es nur, wenn der Betriebsrat widerspricht und der Arbeitnehmer klagt und es verlangt. Merksatz: Schweigen eine Woche lang heißt Zustimmung."},{"id":"W2324-14","pruefung":"Winter 2023/24","nr":14,"welt":"arbeit","thema":"Mutterschutz","typ":"mc","situation":"Sabine Hörtel, Privatkundenberaterin der Kreditbank AG, ist schwanger und hat das mit einem Attest mitgeteilt. Ihre Schutzfrist beginnt am 14.12.2023, sie möchte auf eigenen Wunsch bis einschließlich 30.12.2023 arbeiten.","frage":"Welche Aussage ist nach dem Mutterschutzgesetz richtig?","optionen":["Sie darf bis 30.12.2023 arbeiten, wenn der Betriebsrat zustimmt.","Sie darf auf eigenen ausdrücklichen Wunsch bis einschließlich 30.12.2023, längstens bis zur Geburt, arbeiten.","Sie braucht ein ärztliches Attest, um nach Beginn der Schutzfrist weiterzuarbeiten.","Sie muss die Schutzfrist einhalten und darf ab deren Beginn nicht mehr beschäftigt werden.","Sie darf bis zum Beginn der Schutzfrist beraten, danach bekommt sie leichtere Arbeiten."],"richtig":[1],"erklaerung":"Sechs Wochen vor der Geburt beginnt der Mutterschutz, aber die Frau darf auf eigenen Wunsch weiterarbeiten, ohne Attest und ohne Betriebsrat. Nach der Geburt gilt acht Wochen ein striktes Arbeitsverbot. Merksatz: Vor der Geburt freiwillig, nach der Geburt verboten."},{"id":"W2324-15","pruefung":"Winter 2023/24","nr":15,"welt":"sozial","thema":"Arbeitgeberbeitrag Pflegeversicherung","typ":"zahl","situation":"Johannes Kleindienst, 38 Jahre, kinderlos, verdient bei der Kreditbank AG 4.930,00 EUR brutto im Monat. Pflegeversicherung: Beitragssatz 3,40 %, Zuschlag für Kinderlose ab 23 Jahren 0,60 %, Beitragsbemessungsgrenze 4.987,50 EUR.","frage":"Wie hoch ist der Arbeitgeberbeitrag zur Pflegeversicherung für seinen ersten vollen Monat in EUR?","loesung":83.81,"einheit":"EUR","toleranz":0.01,"rechenweg":"Gehalt liegt unter der Grenze. Arbeitgeber trägt die Hälfte von 3,40 % = 1,70 %. 4.930,00 EUR × 1,70 % = 83,81 EUR. Den Kinderlosen-Zuschlag zahlt nur der Arbeitnehmer.","erklaerung":"Arbeitgeber und Arbeitnehmer teilen sich den normalen Pflegebeitrag je zur Hälfte. Den Zuschlag für Kinderlose zahlt der Arbeitnehmer allein, er zählt hier also nicht. Das Gehalt liegt unter der Bemessungsgrenze, also rechnet man mit dem vollen Gehalt. Merksatz: Kinderlosen-Zuschlag zahlt nie der Chef."},{"id":"W2324-16","pruefung":"Winter 2023/24","nr":16,"welt":"arbeit","thema":"Wahlrecht Betriebsrat und JAV","typ":"mc","situation":"2024 wählt die Kreditbank AG einen Betriebsrat und eine Jugend- und Auszubildendenvertretung (JAV). Hektor Wagner ist 25 Jahre alt und Auszubildender im 2. Jahr.","frage":"Welche Aussage zu seinem Wahlrecht nach dem BetrVG trifft zu?","optionen":["Wegen seines Alters darf er nur bei der Betriebsratswahl mitwählen.","Als Auszubildender darf er nur die JAV wählen.","Er darf sowohl den Betriebsrat als auch die JAV wählen.","Wegen seines Alters kann er für den Betriebsrat kandidieren, aber nicht für die JAV.","Er kann sich gleichzeitig in den Betriebsrat und in die JAV wählen lassen."],"richtig":[2],"erklaerung":"Den Betriebsrat wählt jeder ab 16. Die JAV wählen alle unter 18 und alle Azubis, egal wie alt, deshalb darf Herr Wagner beides. Man kann aber nicht gleichzeitig in beiden Gremien sitzen. Merksatz: Azubi darf JAV und Betriebsrat wählen, aber nur in einem sitzen."},{"id":"W2324-17","pruefung":"Winter 2023/24","nr":17,"welt":"arbeit","thema":"Tarifbindung","typ":"mc","situation":"Die Büroblitz GmbH ist jetzt Mitglied im Arbeitgeberverband und damit tarifgebunden. Der Tarifvertrag enthält keine Öffnungsklauseln.","frage":"Welche Aussage zur Tarifbindung der Büroblitz GmbH ist richtig?","optionen":["Der Tarifvertrag gilt für alle Gewerkschaftsmitglieder, mit allen anderen braucht es Einzelvereinbarungen.","Die Büroblitz GmbH darf vom Tarifvertrag abweichen, wenn es für die Beschäftigten günstiger ist.","Arbeiten Gewerkschaftsmitglieder freiwillig zu schlechteren Bedingungen, darf die GmbH abweichen.","Die GmbH darf nur mit allen oder mit keinem Beschäftigten bessere Bedingungen vereinbaren.","Die GmbH ist an den Tarifvertrag gebunden und darf weder bessere noch schlechtere Bedingungen vereinbaren."],"richtig":[1],"erklaerung":"Ein Tarifvertrag ist eine Untergrenze. Nach oben darf der Arbeitgeber immer abweichen, zum Beispiel mit mehr Gehalt, auch nur bei einzelnen Beschäftigten. Schlechter darf es für Gewerkschaftsmitglieder nicht werden, auch nicht freiwillig. Merksatz: Günstigkeitsprinzip, besser geht immer, schlechter nie."},{"id":"W2324-18","pruefung":"Winter 2023/24","nr":18,"welt":"sozial","thema":"Bedürfnisarten","typ":"zuordnen","frage":"Zu welcher Bedürfnisart passt die Beschreibung? Passt keine der beiden, wähle „keine Zuordnung“.","kategorien":["Grund- bzw. Existenzbedürfnisse","Kulturbedürfnisse","keine Zuordnung"],"aussagen":[{"t":"Das Erfüllen dieser Wünsche dient nur der Selbstverwirklichung eines einzelnen Menschen.","k":2},{"t":"Dieser Mangel muss sofort behoben werden, man kann ihn weder verschieben noch ersetzen.","k":0},{"t":"Menschen empfinden sie als geistiges Bedürfnis, das nicht besonders dringend ist.","k":1}],"erklaerung":"Essen, Trinken, Wohnen und Schlafen sind Grundbedürfnisse, ohne sie geht es nicht. Kino, Bücher und Bildung sind Kulturbedürfnisse, die können warten. Selbstverwirklichung ist die oberste Stufe bei Maslow und keine der beiden Arten. Merksatz: Grundbedürfnis heißt überleben, Kulturbedürfnis heißt Geist und Bildung."},{"id":"W2324-19","pruefung":"Winter 2023/24","nr":19,"welt":"markt","thema":"Immobilienmarkt und Preisbildung","typ":"mc","situation":"In einer Niedrigzinsphase stiegen in Großstädten die Preise für kleinere Wohnungen stark an.","frage":"Was könnte diese Preissteigerungen ausgelöst haben?","optionen":["Wegen der niedrigen Zinsen gingen Bautätigkeit und Nachfrage nach kleineren Wohnungen zurück.","Wegen niedriger Bauzinsen stiegen die Finanzierungskosten und damit die Nachfrage nach kleineren Wohnungen.","Nach Einführung des Mietpreisdeckels stiegen Renditen und Nachfrage nach kleineren Wohnungen.","Die wachsende Nachfrage nach kleineren Wohnungen konnte durch Bestand und Neubau nicht gedeckt werden.","Ausgelastete Baufirmen und fehlende Grundstücke führten zu einem Überangebot an kleineren Wohnungen."],"richtig":[3],"erklaerung":"Niedrige Zinsen machen Kredite billig, also wollen mehr Leute kaufen. Es wurde zwar mehr gebaut, aber die Nachfrage wuchs noch schneller. Ist die Nachfrage größer als das Angebot, steigt der Preis. Merksatz: Mehr Nachfrage als Angebot heißt höhere Preise."},{"id":"W2324-20","pruefung":"Winter 2023/24","nr":20,"welt":"markt","thema":"Marktgleichgewicht","typ":"zahl","situation":"Die Kreditbank AG prüft die Preise für ihre Schließfächer mit einer Grafik zu Angebot und Nachfrage. Angebots- und Nachfragekurve schneiden sich bei einem Preis von 75,00 EUR je Schließfach und einer Menge von 70 Schließfächern.","frage":"Wie viel Umsatz in EUR erzielt die Kreditbank AG im Marktgleichgewicht?","loesung":5250,"einheit":"EUR","toleranz":0.01,"rechenweg":"Umsatz = Gleichgewichtspreis × Gleichgewichtsmenge = 75,00 EUR × 70 = 5.250,00 EUR.","erklaerung":"Im Marktgleichgewicht treffen sich Angebot und Nachfrage, dort wird zum Gleichgewichtspreis die Gleichgewichtsmenge verkauft. Umsatz ist immer Preis mal Menge. Merksatz: Schnittpunkt suchen, dann Preis mal Menge."},{"id":"W2324-21","pruefung":"Winter 2023/24","nr":21,"welt":"markt","thema":"Angebot und Nachfrage in der Grafik","typ":"zuordnen","situation":"Grafik zu den Schließfächern: Eine steigende und eine fallende Gerade schneiden sich bei 75 EUR und 70 Stück. Bei 95 EUR und bei 50 EUR liegt je eine Klammer zwischen den beiden Geraden, an der Preisachse markiert eine Klammer den Bereich zwischen 75 und 95 EUR.","frage":"Welcher Bestandteil der Grafik passt zur jeweiligen Bedeutung?","kategorien":["① steigende Gerade","② Klammer zwischen den Geraden bei 95 EUR","③ Schnittpunkt der Geraden bei 75 EUR","④ Klammer zwischen den Geraden bei 50 EUR","⑤ fallende Gerade","⑥ Fläche über dem Gleichgewichtspreis bis 95 EUR, links vom Schnittpunkt"],"aussagen":[{"t":"Angebotskurve","k":0},{"t":"Konsumentenrente","k":5},{"t":"Nachfrageüberhang","k":3}],"erklaerung":"Die Angebotskurve steigt, denn bei höherem Preis wollen Anbieter mehr verkaufen. Unter dem Gleichgewichtspreis wollen mehr Leute kaufen als angeboten wird, das ist der Nachfrageüberhang. Die Konsumentenrente ist das, was Käufer sparen, weil sie mehr gezahlt hätten als den Marktpreis, sie liegt über dem Gleichgewichtspreis. Merksatz: Preis zu niedrig heißt Nachfrageüberhang, Preis zu hoch heißt Angebotsüberhang."},{"id":"W2324-22","pruefung":"Winter 2023/24","nr":22,"welt":"markt","thema":"Fusionskontrolle","typ":"mc","situation":"Die Büroblitz GmbH und die Pencil KG sind die beiden größten deutschen Anbieter von Büroartikeln. Zusammen haben sie 76 % Marktanteil und wollen fusionieren.","frage":"Wird das Bundeskartellamt im Rahmen der Fusionskontrolle tätig?","optionen":["Nein, das Bundeskartellamt prüft nur grenzüberschreitende Fusionen.","Nein, weil die Wettbewerbsfähigkeit des neuen Unternehmens steigt.","Nein, weil hier die unternehmerische Freiheit mehr zählt als staatliche Regulierung.","Ja, weil geprüft werden muss, ob eine marktbeherrschende Stellung entsteht oder verstärkt wird.","Ja, weil jeder Unternehmenszusammenschluss genehmigt werden muss."],"richtig":[3],"erklaerung":"Bei 76 % Marktanteil droht ein Unternehmen, das den Markt beherrscht. Das Bundeskartellamt prüft das und kann die Fusion verbieten, damit Wettbewerb bleibt. Nicht jede Fusion braucht eine Genehmigung, nur die, die den Wettbewerb gefährden kann. Merksatz: Droht Marktbeherrschung, schaut das Kartellamt hin."},{"id":"W2324-23","pruefung":"Winter 2023/24","nr":23,"welt":"kon","thema":"Konjunkturphasen","typ":"mc","situation":"Konjunkturzyklen sind wellenförmige Schwankungen der Wirtschaft. Eine Phase davon heißt Rezession.","frage":"Wodurch kann eine Rezession ausgelöst werden?","optionen":["Eine kurzfristig steigende Nachfrage führt zu Engpässen beim Angebot bestimmter Güter.","Die Produktion ist voll ausgelastet und die Firmen investieren bei niedrigen Zinsen.","Wegen schlechter Aussichten am Arbeitsmarkt kaufen die Haushalte weniger, die Kreditnachfrage sinkt.","Neue Technik senkt die Preise, dadurch steigt die Nachfrage nach Gütern.","Das verfügbare Einkommen fließt in Konsumgüter, dadurch sinkt die Sparneigung."],"richtig":[2],"erklaerung":"Haben die Menschen Angst um ihren Job, sparen sie und kaufen weniger. Dann verkaufen Firmen weniger, investieren weniger und brauchen weniger Kredite. So rutscht die Wirtschaft in die Rezession. Merksatz: Angst um den Job, weniger Konsum, Rezession."},{"id":"W2324-24","pruefung":"Winter 2023/24","nr":24,"welt":"kon","thema":"Fachkräftemangel und Wirtschaftspolitik","typ":"mc","situation":"In vielen Branchen fehlen in Deutschland Fachkräfte. Der Staat will den Unternehmen helfen, Fachkräfte zu finden.","frage":"Welche staatliche Maßnahme ist dafür geeignet?","optionen":["Senkung der Umsatzsteuer","Senkung des Grundfreibetrags bei der Einkommensteuer","Erhöhung der Beiträge zur gesetzlichen Sozialversicherung","Gesetzliche Einschränkung des Rechts auf Fort- und Weiterbildung","Erleichterung des Zuzugs von Arbeitskräften aus dem Ausland"],"richtig":[4],"erklaerung":"Wenn Fachkräfte fehlen, muss man mehr Fachkräfte ins Land holen oder ausbilden. Leichterer Zuzug aus dem Ausland bringt direkt neue Arbeitskräfte. Steuern und Beiträge ändern daran nichts, weniger Weiterbildung macht es sogar schlimmer. Merksatz: Fachkräfte fehlen, also holen oder ausbilden."},{"id":"W2324-25","pruefung":"Winter 2023/24","nr":25,"welt":"kon","thema":"Verbraucherpreisindex und Warenkorb","typ":"mc","situation":"Die Inflationsrate wird über den Verbraucherpreisindex mit einem Warenkorb berechnet. Anteile im Basisjahr 2020 unter anderem: Wohnkosten 25,9 %, Verkehr 13,8 %, Nahrungsmittel 11,9 %, Freizeit 10,4 %, Haushaltszubehör 6,8 %, Bildung 0,9 %.","frage":"Welche Aussage über den Verbraucherpreisindex bzw. den Warenkorb ist richtig?","optionen":["Bei kurzen Preiserhöhungen einzelner Ausgaben muss die Gewichtung im Warenkorb angepasst werden.","Der Warenkorb eignet sich, weil er alle Waren und Dienstleistungen einer Volkswirtschaft enthält.","Mehr als 32 % der Ausgaben im Warenkorb entfallen auf Haushaltszubehör und Wohnkosten.","Starke Änderungen der Verbrauchergewohnheiten führen alle 8 Jahre zu einer Anpassung des Warenkorbs.","Bei 5 % Inflation steigen die Prozentanteile aller Güter im Warenkorb ebenfalls um 5 %."],"richtig":[2],"erklaerung":"6,8 % plus 25,9 % ergibt 32,7 %, also mehr als 32 %. Der Warenkorb zeigt nur, was ein typischer Haushalt kauft, nicht alles in der Volkswirtschaft. Die Gewichtung wird alle fünf Jahre angepasst, nicht bei jeder kurzen Preisänderung. Merksatz: Warenkorb ist der Einkauf eines typischen Haushalts, neu gewichtet alle 5 Jahre."},{"id":"W2324-26","pruefung":"Winter 2023/24","nr":26,"welt":"kon","thema":"Nominales und reales BIP","typ":"mc","frage":"Welche Information zum Bruttoinlandsprodukt (BIP) einer Volkswirtschaft ist richtig?","optionen":["Das nominale BIP erfasst den Wert aller Güter und Dienstleistungen eines Jahres, die von Inländern erbracht werden.","Das nominale BIP bewertet die produzierten Güter und Dienstleistungen zu den jeweils aktuellen Marktpreisen.","Das nominale BIP ist der preisbereinigte Wert aller Güter und Dienstleistungen eines Jahres.","Steigt das Preisniveau, ist das reale BIP höher als das nominale BIP.","Bei gleicher Gütermenge sinkt das reale BIP durch Inflation."],"richtig":[1],"erklaerung":"Nominal heißt: zu den Preisen von heute gerechnet. Real heißt: die Preissteigerung ist herausgerechnet. Das BIP zählt alles, was im Inland erzeugt wird, egal ob von In- oder Ausländern. Merksatz: Nominal mit heutigen Preisen, real ohne Inflation."},{"id":"W2324-27","pruefung":"Winter 2023/24","nr":27,"welt":"ezb","thema":"Ständige Fazilitäten","typ":"mc","frage":"Welche Erläuterung der ständigen Fazilitäten der EZB ist richtig?","optionen":["Die Spitzenrefinanzierungsfazilität erlaubt Banken, sich über Nacht gegen Sicherheiten zu einem festen Zins Geld bei der EZB zu leihen.","Hat eine Bank abends ein Minus auf ihrem EZB-Konto, bekommt sie automatisch einen Übernachtkredit zum Hauptrefinanzierungssatz.","Der Spitzenrefinanzierungssatz bildet zugleich die Untergrenze der Geldmarktzinsen.","Mit der Einlagefazilität legen Banken Überschüsse mittelfristig zu einem festen Zins bei den nationalen Zentralbanken an.","Einlagezins und Spitzenrefinanzierungssatz sind gleich hoch und werden von der EZB wöchentlich festgelegt."],"richtig":[0],"erklaerung":"Braucht eine Bank über Nacht Geld, leiht sie es sich gegen Sicherheiten zum Spitzenrefinanzierungssatz. Der ist die Obergrenze für Tagesgeld, der Einlagesatz die Untergrenze. Die EZB entscheidet etwa alle sechs Wochen über die Zinsen. Merksatz: Spitzenrefi oben, Einlage unten, beides über Nacht."},{"id":"W2324-28","pruefung":"Winter 2023/24","nr":28,"welt":"ezb","thema":"Geldmenge verringern","typ":"mc","situation":"Eine wachsende Geldmenge kann zu Inflation führen.","frage":"Mit welcher Maßnahme kann die EZB die Geldmenge verringern?","optionen":["Die EZB senkt den Hauptrefinanzierungssatz.","Die EZB senkt den Mindestreservesatz.","Die EZB kauft Inhaberschuldverschreibungen börsennotierter Unternehmen.","Die EZB verkauft Wertpapiere über ein Tenderverfahren.","Die EZB senkt den Zins der Einlagefazilität."],"richtig":[3],"erklaerung":"Verkauft die EZB Wertpapiere, zahlen die Banken mit ihrem Geld, und dieses Geld ist dann aus dem Markt verschwunden. Zinsen senken, Mindestreserve senken oder Anleihen kaufen bringen dagegen mehr Geld in Umlauf. Merksatz: EZB verkauft, Geld verschwindet. EZB kauft, Geld kommt dazu."},{"id":"S24-1","pruefung":"Sommer 2024","nr":1,"welt":"recht","thema":"Geschäftsfähigkeit und Ratenkauf","typ":"mc","situation":"Sascha Holl ist Azubi bei der Kreditbank AG, verdient 1.150,00 EUR im Monat und wird in drei Monaten 18. Er will ohne Zustimmung seiner Eltern einen E-Roller für 949,00 EUR kaufen und in fünf Monatsraten abzahlen.","frage":"Kann der Kaufvertrag zu diesen Bedingungen nach BGB wirksam zustande kommen?","optionen":["Nein, denn Herr Holl ist noch nicht rechtsfähig.","Nein, denn Herr Holl ist nur beschränkt geschäftsfähig.","Ja, wenn er die Raten aus seiner Ausbildungsvergütung zahlt.","Ja, denn seine Monatsvergütung ist höher als der Preis des Rollers.","Ja, denn er ist volljährig, bevor die letzte Rate fällig wird."],"richtig":[1],"erklaerung":"Mit 17 ist man nur beschränkt geschäftsfähig. Ein Ratenkauf ist ein Kreditgeschäft, und das fällt nie unter den Taschengeldparagrafen, egal wie viel er verdient. Dafür bräuchte er sogar das Familiengericht. Merksatz: Raten unter 18 gehen nicht allein."},{"id":"S24-2","pruefung":"Sommer 2024","nr":2,"welt":"recht","thema":"Besitz und Eigentum","typ":"mc","situation":"Die Büroblitz GmbH hat mehrere Geschäfte abgeschlossen.","frage":"In welchem Fall ist die Büroblitz GmbH Eigentümerin der Sache geworden?","optionen":["Sie hat einen Lieferwagen für 36 Monate geleast und schon abgeholt.","Sie hat auf ein verbindliches Angebot hin 50 Holzplatten bestellt.","Sie hat heute den Kauf eines Grundstücks beim Notar beurkunden lassen.","Die Büromöbel sind geliefert, stehen aber bis zur Zahlung in 2 Wochen unter Eigentumsvorbehalt.","Sie hat eine Schleifmaschine gekauft, die Maschine ist geliefert und die Rechnung bezahlt."],"richtig":[4],"erklaerung":"Bei beweglichen Sachen wird man Eigentümer durch Einigung und Übergabe. Beim Leasing ist man nur Besitzer, beim Eigentumsvorbehalt bleibt der Verkäufer Eigentümer, und beim Grundstück fehlt noch der Eintrag im Grundbuch. Merksatz: Einigung plus Übergabe macht Eigentum."},{"id":"S24-3","pruefung":"Sommer 2024","nr":3,"welt":"recht","thema":"Willenserklärung und Rechtsgeschäfte","typ":"mc","situation":"Manche Willenserklärungen werden erst wirksam, wenn sie beim anderen ankommen. Sie heißen empfangsbedürftig.","frage":"Welcher Fall ist ein einseitiges Rechtsgeschäft mit einer empfangsbedürftigen Willenserklärung?","optionen":["Die Büroblitz GmbH schließt mit einer neuen Mitarbeiterin einen Arbeitsvertrag.","Die Büroblitz GmbH mietet ein neues Auslieferungslager.","Die Büroblitz GmbH ficht einen Kaufvertrag über einen Lieferwagen wegen arglistiger Täuschung an.","Der Geschäftsführer schenkt seiner minderjährigen Enkelin ein Fahrrad.","Der Geschäftsführer bürgt privat für einen Kredit seiner Schwester."],"richtig":[2],"erklaerung":"Für eine Anfechtung reicht die Erklärung von einer Seite, sie muss aber beim Vertragspartner ankommen. Arbeitsvertrag, Miete, Schenkung und Bürgschaft brauchen immer zwei passende Erklärungen, sind also zweiseitig. Merksatz: Anfechtung, Kündigung, Rücktritt sind einseitig und müssen ankommen."},{"id":"S24-4","pruefung":"Sommer 2024","nr":4,"welt":"recht","thema":"Nichtige und anfechtbare Rechtsgeschäfte","typ":"zuordnen","situation":"Die Büroblitz GmbH prüft, wie wirksam mehrere Geschäfte sind.","frage":"Welche Wirkung hat jedes Rechtsgeschäft?","kategorien":["Das Rechtsgeschäft ist nichtig.","Das Rechtsgeschäft ist gültig und nicht anfechtbar.","Das Rechtsgeschäft ist gültig, aber anfechtbar."],"aussagen":[{"t":"Die Ware wurde wie vereinbart geliefert. Die Büroblitz GmbH will trotzdem zurücktreten, weil ein anderer Lieferant billiger ist.","k":1},{"t":"Ein Händler verkauft einen Transporter als unfallfrei, obwohl er von den versteckten Unfallschäden wusste.","k":2},{"t":"Sebastian Müller kauft von Anna Obermayer mündlich ein Gartengrundstück und zahlt sofort.","k":0}],"erklaerung":"Ein besseres Angebot woanders ist nur ein Motivirrtum, der Vertrag bleibt fest. Wer bewusst einen Unfallschaden verschweigt, täuscht arglistig, das kann man anfechten. Ein Grundstück muss beim Notar gekauft werden, mündlich ist es wegen Formmangel nichtig. Ziffernfolge 3, 1, 2."},{"id":"S24-5","pruefung":"Sommer 2024","nr":5,"welt":"recht","thema":"Zustandekommen des Kaufvertrags","typ":"mc","situation":"Die Büroblitz GmbH schließt mit ihren Kunden Kaufverträge.","frage":"In welchem Fall ist nach BGB noch kein wirksamer Kaufvertrag entstanden?","optionen":["Eine Kundin fragt nach dem Preis einer Software, die Büroblitz GmbH schickt ihr ein Angebot.","Die Büroblitz GmbH macht ein verbindliches Angebot für eine Lampe, der Kunde bestellt genau dazu.","Eine Kundin bestellt einen Schreibtisch, die Büroblitz GmbH bestätigt per E-Mail.","Ein Kunde bestellt am Telefon einen Bürostuhl, die Büroblitz GmbH liefert ihn.","Die Büroblitz GmbH liefert unbestellt eine Telefonanlage, die Kundin nimmt sie an."],"richtig":[0],"erklaerung":"Ein Kaufvertrag braucht zwei passende Willenserklärungen: Antrag und Annahme. Die Anfrage ist noch gar keine Willenserklärung, das Angebot ist erst die erste, die Annahme der Kundin fehlt noch. In allen anderen Fällen gibt es Antrag und Annahme. Merksatz: Anfrage plus Angebot ist noch kein Vertrag."},{"id":"S24-6","pruefung":"Sommer 2024","nr":6,"welt":"recht","thema":"Zahlungsverzug nach 30 Tagen","typ":"mc","situation":"Die Kreditbank AG bekommt am 18.03.2024 Schreibtische samt Rechnung mit dem Vermerk „zahlbar sofort ohne Skonto“. Sie vergisst zu zahlen, gemahnt wird nicht.","frage":"Mit Ablauf welchen Tages ist die Kreditbank AG nach Gesetz in Zahlungsverzug?","optionen":["18.03.2024","02.04.2024","15.04.2024","17.04.2024","18.04.2024"],"richtig":[3],"erklaerung":"„Sofort“ ist kein fester Kalendertermin. Ohne Mahnung kommt man dann 30 Tage nach Zugang der Rechnung in Verzug. 18.03. plus 30 Tage ist der 17.04.2024, mit Ablauf dieses Tages ist man im Verzug. Merksatz: kein Datum, keine Mahnung, dann 30 Tage."},{"id":"S24-7","pruefung":"Sommer 2024","nr":7,"welt":"arbeit","thema":"Sicherheitsbeauftragter","typ":"mc","situation":"Die Kreditbank AG ernennt einen neuen Sicherheitsbeauftragten. Seine Aufgaben regelt unter anderem die Deutsche Gesetzliche Unfallversicherung (DGUV).","frage":"Was gehört nach DGUV nicht zu seinen Aufgaben?","optionen":["Er unterstützt den Arbeitgeber dabei, Arbeitsunfälle und Berufskrankheiten zu verhüten.","Er fördert durch Gespräche und Schulungen sicheres und gesundes Verhalten der Kollegen.","Er klärt Ursachen von Unfällen im Betrieb und berät den Arbeitgeber zur Vermeidung.","Er trägt Verantwortung und Haftung dafür, dass alle die Schutzmaßnahmen einhalten.","Er prüft, ob die vorgeschriebenen Schutzeinrichtungen vorhanden sind."],"richtig":[3],"erklaerung":"Der Sicherheitsbeauftragte ist ein Kollege, der berät und hilft, auf Augenhöhe. Er darf keine Anweisungen geben und haftet nicht. Die Verantwortung bleibt beim Arbeitgeber. Merksatz: Er hilft, er haftet nicht."},{"id":"S24-8","pruefung":"Sommer 2024","nr":8,"welt":"sozial","thema":"Umweltzeichen Blauer Engel","typ":"mc","situation":"Die Kreditbank AG kauft Kopierpapier, das das Umweltzeichen „Blauer Engel“ trägt.","frage":"Was sagt dieses Zeichen beim Kopierpapier aus?","optionen":["Der Papierverbrauch im Betrieb sinkt.","Bei der Herstellung dieses Papiers werden Rohstoffe eingespart.","Das Papier ist billiger.","Das Papier hat die höchste Qualität.","Farben wirken auf diesem Papier besonders kräftig."],"richtig":[1],"erklaerung":"Der Blaue Engel steht seit 1978 für besonders umweltschonende Produkte. Beim Papier heißt das: Bei der Herstellung werden Rohstoffe gespart, etwa durch Altpapier. Über Preis, Qualität oder Verbrauch sagt er nichts. Merksatz: Blauer Engel heißt gut für die Umwelt."},{"id":"S24-9","pruefung":"Sommer 2024","nr":9,"welt":"arbeit","thema":"Kündigung des Ausbildungsverhältnisses","typ":"mc","situation":"Leon Schmidt ist seit 01.08.2023 Azubi bei der Kreditbank AG. Mit Brief vom 21.04.2024, zugegangen am 23.04.2024, kündigt er fristlos, weil ihm der Beruf nicht gefällt und er nächsten Monat eine Ausbildung zum Pfleger beginnt.","frage":"Ist die Kündigung nach Berufsbildungsgesetz wirksam?","optionen":["Nein, denn er hat die gesetzliche Frist von 4 Wochen nicht eingehalten.","Nein, denn fristlos geht nur mit Zustimmung der Kreditbank AG.","Ja, denn er hat einen wichtigen Grund genannt.","Ja, denn der Kreditbank AG entsteht kein Schaden.","Ja, denn er beginnt eine andere Berufsausbildung."],"richtig":[0],"erklaerung":"Die Probezeit ist längst vorbei. Wer danach den Beruf wechseln will, darf kündigen, aber nur mit 4 Wochen Frist. Ein Berufswechsel ist kein wichtiger Grund für fristlos. Merksatz: nach der Probezeit Berufswechsel nur mit 4 Wochen Frist."},{"id":"S24-10","pruefung":"Sommer 2024","nr":10,"welt":"arbeit","thema":"Jugendarbeitsschutz: Arbeitszeit","typ":"mc","situation":"Die Büroblitz GmbH hat ihre Ladenöffnungszeiten verlängert. Für die 17-jährige Azubi Victoria Lutz sind fünf Pläne mit je 40 Wochenstunden im Gespräch (Zeiten inklusive Pausen).","frage":"Welcher Arbeitszeitplan ist nach dem Jugendarbeitsschutzgesetz erlaubt?","optionen":["Mo bis Fr 09:00 bis 17:00 Uhr mit 45 Minuten Pause, Sa 10:00 bis 14:15 Uhr mit 30 Minuten Pause","Mo und Mi bis Fr 08:00 bis 18:00 Uhr mit 60 Minuten Pause, Sa 08:00 bis 12:30 Uhr mit 30 Minuten Pause","Mo bis Do 10:00 bis 19:00 Uhr mit 60 Minuten Pause, Sa 08:30 bis 17:15 Uhr mit 45 Minuten Pause","Di bis Fr 11:00 bis 20:00 Uhr mit 60 Minuten Pause, Sa 08:00 bis 17:00 Uhr mit 60 Minuten Pause","Mo bis Mi 08:00 bis 17:00 Uhr mit 60 Minuten Pause, Fr und Sa 09:00 bis 17:45 Uhr mit 45 Minuten Pause"],"richtig":[3],"erklaerung":"Jugendliche arbeiten höchstens 8 Stunden am Tag an 5 Tagen. Bei mehr als 6 Stunden gibt es 60 Minuten Pause, und die zwei freien Tage sollen direkt nacheinander liegen. Plan 4 passt: Dienstag bis Samstag je 8 Stunden, 60 Minuten Pause, frei Sonntag und Montag. Merksatz: 8 Stunden, 5 Tage, 60 Minuten, zwei freie Tage am Stück."},{"id":"S24-11","pruefung":"Sommer 2024","nr":11,"welt":"sozial","thema":"Abführung der Sozialversicherungsbeiträge","typ":"zahl","situation":"Leonie Schaller, 25, ledig, ohne Kinder, verdient im April 2024 brutto 2.680,00 EUR. Gesamtbeiträge (Arbeitnehmerin plus Arbeitgeber): Rente 498,48 EUR, Arbeitslosen 69,68 EUR, Kranken 391,28 EUR, Zusatzbeitrag Kranken 45,56 EUR, Pflege 107,20 EUR.","frage":"Wie viel EUR muss die Kreditbank AG insgesamt an die Krankenkasse von Frau Schaller überweisen?","loesung":1112.2,"einheit":"EUR","toleranz":0.01,"rechenweg":"498,48 + 69,68 + 391,28 + 45,56 + 107,20 = 1.112,20 EUR","erklaerung":"Der Arbeitgeber schickt alles in einer Summe an die Krankenkasse: seinen Teil und den Teil der Mitarbeiterin, für alle vier Versicherungen. Die Krankenkasse verteilt das Geld dann weiter. Also einfach alle Gesamtbeiträge zusammenzählen. Merksatz: Die Krankenkasse ist die Sammelstelle."},{"id":"S24-12","pruefung":"Sommer 2024","nr":12,"welt":"arbeit","thema":"Jugend- und Auszubildendenvertretung","typ":"mc","situation":"Sebastian Keil, geboren am 15.12.2000, sitzt in der JAV der Kreditbank AG. Im Oktober 2024 wird neu gewählt, seine Ausbildung endet am 28.02.2025, danach bleibt er im Betrieb.","frage":"Welche Aussage ist richtig?","optionen":["Er kann nicht mehr antreten, weil er bei der Wahl nur noch 5 Monate Azubi ist.","Er kann nicht mehr antreten, weil er in der nächsten Amtszeit 25 wird.","Er kann nicht mehr antreten, weil man nur einmal gewählt werden darf.","Er kann antreten, aber bei Wiederwahl endet sein Amt automatisch mit 25, also mit Ablauf des 14.12.2025.","Er kann antreten, und bei Wiederwahl endet sein Amt nach der normalen Amtszeit von 2 Jahren im Oktober 2026."],"richtig":[4],"erklaerung":"Wählbar ist, wer am Wahltag unter 25 ist oder in Ausbildung steht. Herr Keil ist am Wahltag Azubi, also darf er antreten, und Wiederwahl ist erlaubt. Die Amtszeit dauert 2 Jahre, auch wenn er zwischendurch 25 wird oder fertig ist. Merksatz: Es zählt der Wahltag, dann gilt das Amt 2 Jahre."},{"id":"S24-13","pruefung":"Sommer 2024","nr":13,"welt":"arbeit","thema":"Warnstreik","typ":"mc","situation":"Beschäftigte der Büroblitz GmbH wollen für einen neuen Gehaltstarifvertrag an einem Warnstreik teilnehmen.","frage":"Welche Aussage zum Warnstreik stimmt?","optionen":["Ein Warnstreik ist nur nach einer Urabstimmung aller Gewerkschaftsmitglieder im Betrieb erlaubt.","Ein Warnstreik ist nur nach einer gescheiterten Schlichtung erlaubt.","Ein Warnstreik ist meist zeitlich begrenzt und auch ohne Urabstimmung erlaubt.","Ein Warnstreik ist nur erlaubt, nachdem der Arbeitgeber ausgesperrt hat.","Ein Warnstreik ist nur erlaubt, wenn andere Firmen der Branche gleichzeitig streiken."],"richtig":[2],"erklaerung":"Ein Warnstreik ist eine kurze Arbeitspause während der Tarifverhandlungen. Er soll zeigen, dass die Beschäftigten bereit sind zu kämpfen. Eine Urabstimmung braucht man erst für den großen, unbefristeten Streik. Merksatz: Warnstreik ist kurz und ohne Urabstimmung."},{"id":"S24-14","pruefung":"Sommer 2024","nr":14,"welt":"sozial","thema":"Aufbau der Gehaltsabrechnung","typ":"reihenfolge","situation":"Hagen Messner, Azubi bei der Büroblitz GmbH, lernt in der Personalabteilung, wie eine Gehaltsabrechnung aufgebaut ist.","frage":"Bringe die Teile der Gehaltsabrechnung in die richtige Reihenfolge.","schritte":["Tarifliches Grundgehalt brutto","Arbeitgeberanteil zur Vermögensbildung","Bruttogehalt gesamt","Abzüge für Lohnsteuer und Sozialabgaben","Nettogehalt"],"erklaerung":"Zuerst kommt das Grundgehalt, dazu legt der Arbeitgeber die vermögenswirksamen Leistungen. Das ergibt das ganze Brutto. Davon gehen Steuern und Sozialabgaben ab, übrig bleibt das Netto. Ziffernfolge 1, 4, 5, 3, 2."},{"id":"S24-15","pruefung":"Sommer 2024","nr":15,"welt":"sozial","thema":"Werbungskosten","typ":"mc","situation":"Markus Zessner von der Kreditbank AG hat 2023 Belege für verschiedene Ausgaben gesammelt.","frage":"Welche Ausgabe kann er in der Steuererklärung als Werbungskosten angeben?","optionen":["Eigenanteil für Zahnimplantate über seiner zumutbaren Belastung","Arbeitnehmeranteil zur gesetzlichen Krankenversicherung","Spende an eine gemeinnützige Organisation","Fahrtkosten zu einem Bewerbungsgespräch bei der Kreditbank AG","Gezahlte Kirchensteuer"],"richtig":[3],"erklaerung":"Werbungskosten sind Ausgaben, die man hat, um Geld im Job zu verdienen oder den Job zu bekommen. Die Fahrt zum Vorstellungsgespräch gehört dazu. Krankenkasse, Spende und Kirchensteuer sind Sonderausgaben, die Zähne eine außergewöhnliche Belastung. Merksatz: Werbungskosten haben mit dem Job zu tun."},{"id":"S24-16","pruefung":"Sommer 2024","nr":16,"welt":"sozial","thema":"Ökonomisches Prinzip","typ":"mc","situation":"Die Büroblitz GmbH handelt nach dem ökonomischen Prinzip.","frage":"In welchem Fall wendet sie das Maximalprinzip an?","optionen":["Sie will die Mehrheit an einem Konkurrenten so günstig wie möglich kaufen.","Sie will mit einem festen Werbebudget pro Jahr so viel Umsatz wie möglich machen.","Sie will für eine feste Produktionsmenge möglichst wenig für Material ausgeben.","Sie nimmt von zwei Lieferanten das günstigere Angebot.","Sie will mit möglichst wenig Material möglichst viel Gewinn machen."],"richtig":[1],"erklaerung":"Beim Maximalprinzip sind die Mittel fest und man holt das Beste heraus. Fester Werbeetat, möglichst viel Umsatz, das passt genau. Festes Ziel mit wenig Mitteln ist das Minimalprinzip, und beides gleichzeitig maximieren geht nicht. Merksatz: Mittel fest, Ergebnis maximal."},{"id":"S24-17","pruefung":"Sommer 2024","nr":17,"welt":"markt","thema":"Vollkommener und unvollkommener Markt","typ":"mc","situation":"Die Büroblitz GmbH verkauft die Software „Verwaltung und Büro“.","frage":"Welche Beschreibung zeigt, dass der Markt für solche Bürosoftware unvollkommen ist?","optionen":["Alle Anbieter verkaufen völlig gleiche Programme.","Jeder einzelne Marktteilnehmer kann den Preis beeinflussen.","Anbieter und Käufer reagieren sofort auf jede Änderung am Markt.","Alle kennen alle Produktbeschreibungen und alle Preise.","An verschiedenen Orten wird die Software zu unterschiedlichen Bedingungen verkauft."],"richtig":[4],"erklaerung":"Auf einem vollkommenen Markt sind die Güter gleich, alle wissen alles und reagieren sofort, und es gibt überall dieselben Bedingungen. Wenn der Ort eine Rolle spielt, gibt es räumliche Vorlieben, und der Markt ist unvollkommen. Dass jeder Einzelne den Preis beeinflusst, gibt es auf keinem Markt. Merksatz: Eine Vorliebe genügt, und der Markt ist unvollkommen."},{"id":"S24-18","pruefung":"Sommer 2024","nr":18,"welt":"markt","thema":"Angebot und Nachfrage","typ":"mc","situation":"Eine Studie zu Kinderschreibtischen zeigt: Bei 350,00 EUR werden 40 Stück angeboten und 40 gefragt. Bei 400,00 EUR werden 50 angeboten und 30 gefragt. Bei 450,00 EUR werden 60 angeboten und 20 gefragt.","frage":"Welche Beschreibung passt zur Marktlage?","optionen":["Bei 400,00 EUR pro Stück gibt es einen Angebotsüberhang.","Bei 350,00 EUR pro Stück wird am Markt nichts verkauft.","Bei 450,00 EUR pro Stück gibt es einen Nachfrageüberhang.","Bei 400,00 EUR pro Stück herrscht ein Verkäufermarkt.","Bei 350,00 EUR pro Stück herrscht ein Käufermarkt."],"richtig":[0],"erklaerung":"Bei 400 EUR wollen die Händler 50 verkaufen, aber nur 30 Leute kaufen. Es bleiben 20 übrig, das ist ein Angebotsüberhang, und die Käufer sind am längeren Hebel. Bei 350 EUR ist der Markt im Gleichgewicht mit dem größten Umsatz. Merksatz: Preis über dem Gleichgewicht, zu viel Ware."},{"id":"S24-19","pruefung":"Sommer 2024","nr":19,"welt":"markt","thema":"Höchstpreis","typ":"mc","situation":"Der Staat will Verbraucher vor einem zu hohen Preis schützen und legt für ein Produkt einen Höchstpreis fest.","frage":"Welche Aussage ist richtig?","optionen":["Der Höchstpreis führt zu einem Angebotsüberhang.","Durch den festgelegten Preis sinkt die Nachfrage.","Bei elastischer Nachfrage steigt durch den Höchstpreis der Gesamtumsatz am Markt.","Die Anbieter erhöhen ihre Menge, weil sie den Höchstpreis erzielen wollen.","Der festgelegte Preis lässt die angebotene Menge sinken."],"richtig":[4],"erklaerung":"Ein Höchstpreis liegt unter dem Gleichgewichtspreis. Für die Anbieter lohnt sich das weniger, also bieten sie weniger an. Die Käufer wollen bei dem niedrigeren Preis mehr, es entsteht ein Nachfrageüberhang. Merksatz: Höchstpreis heißt weniger Angebot, mehr Nachfrage."},{"id":"S24-20","pruefung":"Sommer 2024","nr":20,"welt":"markt","thema":"Kooperation und Konzentration","typ":"mc","situation":"Auf dem Markt für Büroartikel arbeiten immer mehr Firmen zusammen oder schließen sich zusammen.","frage":"Welche Aussage ist richtig?","optionen":["Bei einer Fusion werden Firmen eine wirtschaftliche Einheit, bleiben aber rechtlich selbstständig.","Beim horizontalen Zusammenschluss verbinden sich Firmen verschiedener Stufen entlang der Wertschöpfungskette.","In einer Einkaufsgemeinschaft verlieren die Firmen ihre rechtliche Selbstständigkeit.","In einem Konzern bleiben die Firmen rechtlich selbstständig.","Beim vertikalen Zusammenschluss beteiligen sich Firmen dauerhaft an Firmen der gleichen Branche."],"richtig":[3],"erklaerung":"Im Konzern hängen die Firmen über Kapital zusammen, bleiben aber eigene Firmen mit eigenem Namen. Bei der Fusion verschmelzen sie und geben das auf. Horizontal heißt gleiche Stufe, vertikal heißt Stufen hintereinander. Merksatz: Konzern bleibt selbstständig, Fusion verschmilzt."},{"id":"S24-21","pruefung":"Sommer 2024","nr":21,"welt":"kon","thema":"Konjunktur: Maßnahmen in der Rezession","typ":"mc","situation":"Die Wirtschaft ist im Abschwung (Rezession), einer der vier Phasen des Konjunkturzyklus.","frage":"Mit welcher staatlichen Maßnahme kann man im Abschwung die Nachfrage direkt stützen?","optionen":["Unternehmen dürfen weniger abschreiben.","Der Staat kürzt seine Ausgaben für Investitionen stark.","Die Umsatzsteuer wird erhöht.","Der Grundfreibetrag bei der Einkommensteuer wird erhöht.","Der Staat kürzt die Sozialleistungen stark."],"richtig":[3],"erklaerung":"Ein höherer Grundfreibetrag heißt weniger Steuern für alle. Dann bleibt mehr Geld zum Einkaufen, und die Nachfrage steigt. Alle anderen Maßnahmen nehmen den Menschen oder Firmen Geld weg und machen den Abschwung schlimmer. Merksatz: In der Krise Geld in die Taschen, nicht heraus."},{"id":"S24-22","pruefung":"Sommer 2024","nr":22,"welt":"kon","thema":"Nominales und reales BIP","typ":"mc","situation":"Das nominale und das reale Bruttoinlandsprodukt eines Jahres unterscheiden sich.","frage":"Welche Aussage zum realen BIP ist richtig?","optionen":["Es ist in jedem Zeitraum immer größer als das nominale BIP.","Es ist das um Preisänderungen bereinigte BIP eines Jahres.","Es ist der nominale Wert aller Güter und Dienstleistungen, die im Land verbraucht werden.","Es wächst in einem Zeitraum um die jeweiligen Preissteigerungen.","Es misst den realen Wert aller Güter und Dienstleistungen, auch wenn sie nicht bezahlt werden."],"richtig":[1],"erklaerung":"Beim realen BIP rechnet man die Preissteigerungen heraus. So sieht man, ob wirklich mehr hergestellt wurde oder nur alles teurer wurde. Unbezahlte Arbeit wie Hausarbeit zählt in keinem BIP. Merksatz: real heißt preisbereinigt."},{"id":"S24-23","pruefung":"Sommer 2024","nr":23,"welt":"kon","thema":"Angebotsorientierte Wirtschaftspolitik","typ":"mc","situation":"In einer Rezession kann der Staat das Wachstum über die Angebotsseite oder über die Nachfrageseite ankurbeln.","frage":"Welche Maßnahme gehört zur angebotsorientierten Wirtschaftspolitik?","optionen":["Der Staat erhöht den Grundfreibetrag bei der Einkommensteuer.","Firmen dürfen ihren Beschäftigten eine steuerfreie Inflationsprämie bis 3.000,00 EUR zahlen.","Der Staat baut auf Kredit für 15 Milliarden Euro Autobahnen aus.","Der Staat zahlt allen steuerpflichtigen Erwerbstätigen einmalig 300,00 EUR Energiepauschale.","Der Staat senkt die Abgaben der Unternehmen, damit die Lohnnebenkosten sinken."],"richtig":[4],"erklaerung":"Angebotsorientiert heißt: Der Staat entlastet die Unternehmen, damit sie mehr Gewinn haben und investieren. Niedrigere Lohnnebenkosten helfen genau den Firmen. Die anderen Maßnahmen geben den Haushalten mehr Geld oder machen den Staat selbst zum Käufer, das ist nachfrageorientiert. Merksatz: angebotsorientiert hilft den Firmen."},{"id":"S24-24","pruefung":"Sommer 2024","nr":24,"welt":"kon","thema":"Preisindex und Kaufkraft","typ":"zahl","situation":"Alexis Ponta verdient seit 2020 bei der Kreditbank AG, damals 2.450,00 EUR im Monat. Der Preisindex lag 2020 bei 100 (Basisjahr), 2021 bei 97,1, 2022 bei 105,8 und 2023 bei 121,6.","frage":"Wie hoch müsste sein Monatsgehalt 2024 in EUR sein, damit die Preisänderungen von 2021 bis 2023 ausgeglichen sind?","loesung":2979.2,"einheit":"EUR","toleranz":0.01,"rechenweg":"2.450,00 EUR × 121,6 : 100 = 2.979,20 EUR","erklaerung":"Der Index 2023 sagt, wie teuer alles im Vergleich zum Basisjahr ist. 121,6 heißt: Alles kostet 21,6 Prozent mehr als 2020. Die Jahre dazwischen sind egal, man nimmt nur den letzten Wert gegen das Basisjahr. Merksatz: Gehalt mal neuer Index durch 100."},{"id":"S24-25","pruefung":"Sommer 2024","nr":25,"welt":"ezb","thema":"Zahlungsbilanz: Dienstleistungsbilanz","typ":"mc","situation":"Die Deutsche Bundesbank erstellt jeden Monat die Zahlungsbilanz für Deutschland.","frage":"Welcher Vorgang wirkt sich auf die Dienstleistungsbilanz aus?","optionen":["Deutschland überweist 16,2 Millionen US-Dollar humanitäre Hilfe an die WHO in Genf.","Die Büroblitz GmbH bezahlt einen schwedischen Spediteur für den Transport von Holzschränken.","Anna Lechner bekommt jährlich 15.800,00 EUR Mieterträge aus einem Ferienhaus in Kroatien.","Die Büroblitz GmbH verkauft 20 Stahlschränke nach Italien und erhält dafür Euro.","Noah Peeters lebt in Aachen und bekommt sein Gehalt von seinem Arbeitgeber in Belgien."],"richtig":[1],"erklaerung":"Der Transport durch einen ausländischen Spediteur ist eine gekaufte Dienstleistung. Hilfszahlungen sind Sekundäreinkommen, Mieten und Gehälter aus dem Ausland sind Primäreinkommen, und Warenverkauf landet in der Handelsbilanz. Merksatz: Transport, Reisen, Versicherung gehören zu den Dienstleistungen."},{"id":"S24-26","pruefung":"Sommer 2024","nr":26,"welt":"ezb","thema":"Wechselkurse und Importpreise","typ":"mc","situation":"Die Büroblitz GmbH kauft Sägeblätter in Kanada und zahlt in Kanadischen Dollar (CAD). Der Einfuhrpreisindex (2020 = 100) stieg von 102,0 im Jahr 2022 auf 104,4 im Jahr 2023. Der Kurs lag 2022 bei 1 EUR = 1,4578 CAD und 2023 bei 1 EUR = 1,4775 CAD.","frage":"Wie hat sich 2023 gegenüber 2022 der Wert der Importe für die Büroblitz GmbH verändert?","optionen":["Teurer, weil der Warenpreis gesunken ist und der Euro abgewertet wurde.","Gleich, weil eine gleich starke Euro-Aufwertung den Preisanstieg ausgeglichen hat.","Teurer, weil die Euro-Aufwertung den Preisanstieg der Ware nicht ganz ausgeglichen hat.","Billiger, weil die Euro-Abwertung größer war als der Preisanstieg der Ware.","Billiger, weil der Vorteil der Euro-Aufwertung größer war als der Nachteil des höheren Preises."],"richtig":[2],"erklaerung":"Die Ware wurde um 2,35 Prozent teurer (104,4 durch 102,0). Der Euro ist um 1,35 Prozent mehr wert geworden (1,4775 durch 1,4578), dadurch wird Einkaufen in Kanada etwas billiger. Der Preisanstieg ist größer, also wird der Import teurer. Merksatz: Starker Euro macht Importe billiger, aber nur, wenn er die Preissteigerung schlägt."},{"id":"S24-27","pruefung":"Sommer 2024","nr":27,"welt":"ezb","thema":"Mindestreserve","typ":"mc","situation":"Die Erfüllungsperiode der Kreditbank AG läuft vom 10. Februar bis 9. März, also 28 Tage. Das Mindestreservesoll beträgt 1.800.000,00 EUR, bis einschließlich 08.03. lag das Guthaben im Durchschnitt nur bei 1.750.000,00 EUR. Der Freibetrag zählt hier nicht.","frage":"Wie viel Guthaben muss die Bank am 09.03. halten, damit sie das Soll für die Periode noch erfüllt?","optionen":["3.150.000,00 EUR","1.800.000,00 EUR","1.750.000,00 EUR","1.400.000,00 EUR","50.000,00 EUR"],"richtig":[0],"erklaerung":"Das Soll muss nur im Durchschnitt aller Tage stimmen. 27 Tage lang fehlten jeweils 50.000 EUR, zusammen 1.350.000 EUR. Am letzten Tag braucht die Bank das normale Soll von 1.800.000 EUR plus die fehlenden 1.350.000 EUR, also 3.150.000 EUR. Merksatz: Mindestreserve zählt im Durchschnitt, Lücken holt man am Ende nach."},{"id":"S24-28","pruefung":"Sommer 2024","nr":28,"welt":"ezb","thema":"Geldpolitik der EZB","typ":"mc","situation":"Die Inflation ist stark gestiegen. Die EZB will deshalb die Geldmenge im Euroraum verringern.","frage":"Mit welcher Maßnahme kann die EZB die Geldmenge senken?","optionen":["Sie senkt den Mindestreservesatz.","Sie senkt den Hauptrefinanzierungssatz.","Sie kauft den Geschäftsbanken zusätzlich Wertpapiere ab.","Sie senkt den Zins für Übernachtkredite.","Sie verkauft den Geschäftsbanken Wertpapiere im Rahmen der Offenmarktgeschäfte."],"richtig":[4],"erklaerung":"Wenn die EZB Wertpapiere verkauft, zahlen die Banken mit ihrem Geld. Dieses Geld ist dann weg vom Markt, die Geldmenge sinkt. Alle anderen Maßnahmen machen Geld billiger oder bringen mehr Geld in Umlauf. Merksatz: EZB verkauft, Geld schrumpft."},{"id":"W2425-1","pruefung":"Winter 2024/25","nr":1,"welt":"recht","thema":"Rechtsquellen","typ":"zuordnen","frage":"Aus welcher Rechtsquelle stammt die Regel? Ordne jeden Sachverhalt zu.","kategorien":["Grundgesetz (Verfassung)","Bundesgesetz","Rechtsverordnung","keine Zuordnung"],"aussagen":[{"t":"Der Bundestag beschließt einen höheren Arbeitnehmer-Pauschbetrag für Werbungskosten.","k":1},{"t":"Der Personalvorstand verkündet, dass die Bank für Drucker künftig nur Recycling-Papier mit Umweltsiegel kauft.","k":3},{"t":"Die Würde des Menschen ist unantastbar.","k":0},{"t":"Die Abschlussprüfung der Bankkaufleute hat Teil 1 und Teil 2, die Termine legt die zuständige Stelle fest.","k":2}],"erklaerung":"Was der Bundestag beschließt, ist ein Bundesgesetz. Die Menschenwürde steht ganz oben im Grundgesetz. Die Prüfungsregeln stehen in der Ausbildungsverordnung, und die ist eine Rechtsverordnung der Regierung. Ein Einkaufsbeschluss der Bank ist nur eine Entscheidung im Betrieb. Merksatz: Bundestag macht Gesetze, Regierung macht Verordnungen."},{"id":"W2425-2","pruefung":"Winter 2024/25","nr":2,"welt":"recht","thema":"Besitz und Eigentum","typ":"mc","situation":"Die Kreditbank AG kauft am 04.10.2024 bei der Büroblitz GmbH ergonomische Bürostühle. Geliefert wird am 06.11.2024, bezahlt wird in drei gleichen Monatsraten. Einen Eigentumsvorbehalt gibt es nicht.","frage":"Welche Aussage beschreibt Besitz und Eigentum richtig?","optionen":["Mit der letzten Rate wird die Bank Eigentümerin und unmittelbare Besitzerin.","Schon mit dem Versand wird die Bank Eigentümerin und mittelbare Besitzerin.","Mit der ersten Rate wird die Bank Eigentümerin und mittelbare Besitzerin.","Mit der Annahme der gelieferten Stühle wird die Bank Eigentümerin und unmittelbare Besitzerin.","Schon mit dem Kaufvertrag wird die Bank Eigentümerin und unmittelbare Besitzerin."],"richtig":[3],"erklaerung":"Eigentum an beweglichen Sachen geht über durch Einigung und Übergabe, nicht durch Zahlen. Ohne Eigentumsvorbehalt ist die Bank also schon bei der Annahme Eigentümerin. Weil sie die Stühle dann in der Hand hat, ist sie auch unmittelbare Besitzerin. Merksatz: Eigentum heißt gehören, Besitz heißt haben."},{"id":"W2425-3","pruefung":"Winter 2024/25","nr":3,"welt":"recht","thema":"Arten von Rechtsgeschäften","typ":"zuordnen","frage":"Welche Art von Rechtsgeschäft liegt vor? Ordne jeden Fall zu.","kategorien":["einseitiges Rechtsgeschäft mit empfangsbedürftiger Willenserklärung","zweiseitiges, aber nur einseitig verpflichtendes Rechtsgeschäft","keine der beiden Arten"],"aussagen":[{"t":"Die Büroblitz GmbH schenkt dem Roten Kreuz einen Laptop.","k":1},{"t":"Die Büroblitz GmbH schließt mit einem Bewerber einen Ausbildungsvertrag.","k":2},{"t":"Die Büroblitz GmbH kündigt einem Beschäftigten form- und fristgerecht, der Betriebsrat ist beteiligt.","k":0},{"t":"Die Büroblitz GmbH schließt mit der Holz AG einen Kaufvertrag über Holzplatten.","k":2}],"erklaerung":"Bei der Kündigung spricht nur einer, und sie wirkt erst, wenn sie beim anderen ankommt. Eine Schenkung braucht zwei, die einverstanden sind, aber nur einer muss etwas geben. Ausbildungs- und Kaufvertrag verpflichten beide Seiten, passen also in keine der beiden Arten. Merksatz: Kündigung einseitig, Schenkung zweiseitig mit nur einem Geber."},{"id":"W2425-4","pruefung":"Winter 2024/25","nr":4,"welt":"recht","thema":"Zustandekommen des Kaufvertrags","typ":"mc","situation":"22.10.2024: Die Kreditbank AG fragt bei der Büroblitz GmbH nach 25 Empfangstischen nach Maß. 31.10.2024: Büroblitz schickt per E-Mail ein Angebot, gültig 14 Tage ab Versand. 20.11.2024: Die Bank bestellt schriftlich zu diesem Angebot. 21.11.2024: Büroblitz bestätigt den Eingang und erhöht den Gesamtpreis wegen Kostensteigerungen um 3 %. 25.11.2024: Die Bank nimmt das geänderte Angebot per E-Mail an.","frage":"An welchem Tag ist ein wirksamer Kaufvertrag zustande gekommen?","optionen":["22.10.2024","31.10.2024","20.11.2024","21.11.2024","25.11.2024"],"richtig":[4],"erklaerung":"Die Anfrage ist noch kein Angebot. Die Bestellung kam nach Ablauf der 14 Tage, darum ist sie nur ein neuer Antrag. Die Bestätigung mit 3 % mehr Preis ist wieder ein neuer Antrag. Erst am 25.11. sagt die Bank Ja zu genau diesem Antrag. Merksatz: Vertrag gibt es erst, wenn beide zum selben Inhalt Ja sagen."},{"id":"W2425-5","pruefung":"Winter 2024/25","nr":5,"welt":"recht","thema":"Rücktritt vom Kaufvertrag","typ":"mc","situation":"Nach Vertragsschluss findet die Kreditbank AG einen anderen Hersteller, der die Empfangstische moderner und billiger anbietet. Sie möchte deshalb vom Kaufvertrag mit der Büroblitz GmbH zurücktreten.","frage":"Wie ist das nach Gesetz zu beurteilen?","optionen":["Der Vertrag ist schon mit Produktionsbeginn erfüllt, deshalb ist kein Rücktritt mehr möglich.","Die Bank kann zurücktreten, bis Büroblitz ihr die Ware zur Lieferung anbietet.","Büroblitz kann den Rücktrittswunsch ablehnen und auf Erfüllung bestehen.","Die Bank darf zurücktreten, weil ein anderer Hersteller billiger ist.","Die Bank kann den Vertrag wegen Irrtums anfechten, dann ist er von Anfang an nichtig."],"richtig":[2],"erklaerung":"Ein geschlossener Vertrag gilt, beide müssen leisten. Ein billigeres Angebot woanders ist kein Mangel und kein Rücktrittsgrund. Es ist nur ein Motivirrtum, und den kann man nicht anfechten. Merksatz: Verträge sind einzuhalten, Reue reicht nicht."},{"id":"W2425-6","pruefung":"Winter 2024/25","nr":6,"welt":"recht","thema":"Allgemeine Geschäftsbedingungen","typ":"mc","situation":"Die Büroblitz GmbH überarbeitet ihre AGB für den Verkauf von Büromöbeln an Verbraucher.","frage":"Welche Klausel verstößt gegen das Gesetz?","optionen":["Die AGB gelten nur, soweit im Einzelvertrag nichts anderes vereinbart ist.","Ein Umtausch wegen Nichtgefallen ist ausgeschlossen.","Skonto darf bei der Zahlung nicht abgezogen werden.","Bei Online-Käufen gilt ein Widerrufsrecht von 14 Tagen ab Erhalt der Ware.","Die Gewährleistung für Sachmängel beträgt 6 Monate."],"richtig":[4],"erklaerung":"Bei neuer Ware hat der Verbraucher 2 Jahre Gewährleistung, bei gebrauchter darf man auf 1 Jahr kürzen, nie auf 6 Monate. Umtausch bei Nichtgefallen und Skonto sind freiwillig. Einzelabsprachen gehen den AGB sowieso vor. Merksatz: Neue Ware, zwei Jahre Gewährleistung."},{"id":"W2425-7","pruefung":"Winter 2024/25","nr":7,"welt":"arbeit","thema":"Gesundheitsschutz am Arbeitsplatz","typ":"mc","situation":"Krankheitstage kosten die Kreditbank AG jedes Jahr viel Geld. Sie will den Gesundheitsschutz ihrer Beschäftigten ausbauen.","frage":"Welche Maßnahme dient direkt dem Gesundheitsschutz?","optionen":["Private Kaffeemaschinen ohne Prüfsiegel dürfen im Büro benutzt werden.","Alle Arbeitsplätze mit sitzender Tätigkeit bekommen höhenverstellbare Schreibtische.","Wegen Personalmangel gibt es Schulungen zur Unfallvorbeugung nur noch nach Arbeitsunfällen.","Aus Kostengründen wird der Betriebssport für alle gekürzt.","Wegen fehlender Führungskräfte fallen Eingliederungsmanagement und Fehlzeitengespräche weg."],"richtig":[1],"erklaerung":"Mit einem höhenverstellbaren Tisch kann man im Wechsel sitzen und stehen, das schont Rücken und Nacken. Alle anderen Maßnahmen nehmen Schutz weg oder bringen sogar Gefahr, etwa Brandgefahr durch ungeprüfte Geräte. Merksatz: Gesundheitsschutz heißt vorbeugen, nicht kürzen."},{"id":"W2425-8","pruefung":"Winter 2024/25","nr":8,"welt":"sozial","thema":"Kreislaufwirtschaft","typ":"zuordnen","frage":"Welcher Begriff der Kreislaufwirtschaft passt zur Maßnahme der Büroblitz GmbH?","kategorien":["Wiederverwertung","Wiederverwendung","keine Zuordnung"],"aussagen":[{"t":"Es werden nur noch nachfüllbare Druckerpatronen benutzt.","k":1},{"t":"Kartons und Papierverpackungen werden gesammelt und an eine Papierfabrik verkauft.","k":0},{"t":"Die Zahl der Drucker wird verringert, um Papier zu sparen.","k":2},{"t":"Kaffeesatz wird gesammelt und als Bioabfall entsorgt.","k":0}],"erklaerung":"Wiederverwenden heißt, dasselbe Ding noch einmal für denselben Zweck nutzen, wie die nachgefüllte Patrone. Wiederverwerten heißt, das Ding in Rohstoffe zerlegen und neu verarbeiten, wie Altpapier oder Biomüll zu Dünger. Weniger drucken spart nur Verbrauch, da entsteht gar kein Abfall. Merksatz: Verwenden bleibt ganz, Verwerten wird zerlegt."},{"id":"W2425-9","pruefung":"Winter 2024/25","nr":9,"welt":"arbeit","thema":"Ausbildungsvertrag nach BBiG","typ":"mc","situation":"Finn Pohlmann bekommt von der Kreditbank AG seinen Ausbildungsvertrag mit den wichtigsten Inhalten.","frage":"Was gehört NICHT zu den Mindestinhalten des Ausbildungsvertrags nach BBiG?","optionen":["Beginn und Dauer der Ausbildung","Dauer der regelmäßigen täglichen Arbeitszeit","Dauer des Urlaubs","Zahlung und Höhe der Vergütung","Datum der Abschlussprüfung"],"richtig":[4],"erklaerung":"Beginn, Dauer, Arbeitszeit, Urlaub und Vergütung müssen nach § 11 BBiG im Vertrag stehen. Den Prüfungstermin legt aber die IHK als zuständige Stelle fest, nicht der Betrieb. Merksatz: Was der Betrieb nicht bestimmt, steht nicht im Vertrag."},{"id":"W2425-10","pruefung":"Winter 2024/25","nr":10,"welt":"arbeit","thema":"Urlaubsanspruch","typ":"zahl","situation":"Loretta Cascarella hat 2024 laut Vertrag 30 Urlaubstage und arbeitet Montag bis Freitag. Im Februar nimmt sie 2 Tage Resturlaub aus 2023. Vom 25.03. bis 05.04. nimmt sie 8 Tage (Karfreitag und Ostermontag sind Feiertage). Vom 19.08. bis 06.09. nimmt sie 15 Tage, ist aber vom 04.09. bis 06.09. mit Attest krank.","frage":"Wie viele Urlaubstage aus 2024 stehen ihr noch zu?","loesung":10,"einheit":"Tage","toleranz":0,"rechenweg":"Resturlaub 2023 zählt nicht. Sommer: 15 minus 3 Krankheitstage = 12. 30 minus 8 minus 12 = 10.","erklaerung":"Resturlaub aus dem Vorjahr verbraucht keinen Urlaub aus diesem Jahr. Feiertage kosten keinen Urlaubstag. Wer im Urlaub krank ist und ein Attest hat, bekommt die Krankheitstage zurück. Merksatz: Krank mit Attest ist kein Urlaub."},{"id":"W2425-11","pruefung":"Winter 2024/25","nr":11,"welt":"arbeit","thema":"Mutterschutz und Elterngeld","typ":"mc","situation":"Frau Cascarella ist schwanger, ihr erstes Kind kommt im März 2025. Sie fragt die Personalabteilung nach Mutterschutz und Elterngeld.","frage":"Welche Auskunft ist richtig?","optionen":["In den 6 Wochen vor dem errechneten Termin darf die Bank sie nicht zur Arbeit verpflichten.","Auf eigenen Wunsch darf sie bis zur Geburt und direkt danach weiterarbeiten.","Sie bekommt ab Geburt 12 Monate Basiselterngeld in Höhe von 85 % ihres Bruttoeinkommens.","Elterngeld ersetzt fehlendes Einkommen und hängt nicht von der Höhe des Einkommens ab.","In der gesetzlichen Schutzfrist kann sie ihr Arbeitsverhältnis nicht kündigen."],"richtig":[0],"erklaerung":"Vor der Geburt darf sie freiwillig arbeiten, zwingen darf man sie in den 6 Wochen aber nicht. Nach der Geburt gilt 8 Wochen ein festes Arbeitsverbot. Elterngeld richtet sich nach dem Netto, etwa 65 bis 67 %. Sie selbst darf jederzeit fristgerecht kündigen. Merksatz: 6 Wochen davor freiwillig, 8 Wochen danach verboten."},{"id":"W2425-12","pruefung":"Winter 2024/25","nr":12,"welt":"sozial","thema":"Beitragsbemessungsgrenze","typ":"mc","situation":"Nach einer Gehaltserhöhung liegt das Bruttogehalt von Nils Riedl über der Beitragsbemessungsgrenze der gesetzlichen Krankenversicherung.","frage":"Was folgt daraus für Herrn Riedl?","optionen":["Er kann die Leistungen seiner Krankenkasse frei wählen, ohne dass sich der Beitrag ändert.","Er zahlt Krankenversicherungsbeiträge nur auf das Gehalt bis zur Beitragsbemessungsgrenze.","Er bekommt für seine Krankenversicherung keinen Arbeitgeberanteil mehr.","Er muss von der gesetzlichen in eine private Krankenversicherung wechseln.","Er kann den Zusatzbeitrag seiner Kasse senken, wenn er auf Leistungen verzichtet."],"richtig":[1],"erklaerung":"Bis zur Beitragsbemessungsgrenze steigt der Beitrag mit dem Gehalt, darüber nicht mehr. Der Arbeitgeber zahlt weiter seine Hälfte. Wechseln darf man erst über der höheren Versicherungspflichtgrenze, und auch dann muss man nicht. Merksatz: Über der Grenze ist der Beitrag gedeckelt."},{"id":"W2425-13","pruefung":"Winter 2024/25","nr":13,"welt":"sozial","thema":"Lohnsteuer und Steuerprogression","typ":"mc","situation":"Paul Schnitter wird nach der Ausbildung unbefristet übernommen. Beim ersten Gehalt merkt er, dass seine Lohnsteuer überproportional gestiegen ist.","frage":"Woher kommt der höhere Lohnsteuerabzug?","optionen":["Wegen des höheren Einkommens kommt er in eine andere Steuerklasse.","Als Angestellter hat er einen kleineren Grundfreibetrag als in der Ausbildung.","Wegen des höheren Gehalts berücksichtigt der Arbeitgeber keine Freibeträge mehr.","Mit steigendem zu versteuerndem Einkommen steigt der Steuersatz durch die Steuerprogression.","Nach der Ausbildung muss er einen Inflationsausgleich als Zuschlag zur Lohnsteuer zahlen."],"richtig":[3],"erklaerung":"In Deutschland steigt der Steuersatz, je mehr man verdient. Darum wächst die Steuer schneller als das Gehalt. Die Steuerklasse hängt am Familienstand, der Grundfreibetrag ist für alle gleich. Merksatz: Mehr verdienen heißt höherer Steuersatz, das ist die Progression."},{"id":"W2425-14","pruefung":"Winter 2024/25","nr":14,"welt":"arbeit","thema":"Wahlrecht zu Betriebsrat und JAV","typ":"mc","situation":"2026 wählt die Kreditbank AG Betriebsrat und JAV. Ben Raabe ist 23, kein Azubi, sondern seit 2 Jahren Juniorberater, und in keinem Gremium. Nimm an: Am Wahltag der JAV ist er noch 24 Jahre alt.","frage":"Welche Kombination der Wahlrechte hat Herr Raabe nach BetrVG?","optionen":["Er darf die JAV wählen, aber nicht den Betriebsrat.","Er darf für den Betriebsrat kandidieren, aber nicht für die JAV.","Er darf sich sowohl für den Betriebsrat als auch für die JAV wählen lassen (passives Wahlrecht).","Er hat für Betriebsrat und JAV jeweils aktives und passives Wahlrecht.","Er hat beim Betriebsrat aktives und passives Wahlrecht und bei der JAV das aktive Wahlrecht."],"richtig":[2],"erklaerung":"Die JAV wählen dürfen nur unter 18-Jährige und Azubis unter 25, er ist beides nicht. Gewählt werden in die JAV kann aber jeder unter 25. Für den Betriebsrat darf er wählen und kandidieren, weil er volljährig und über 6 Monate im Betrieb ist. Merksatz: JAV wählen nur Junge und Azubis, kandidieren alle unter 25."},{"id":"W2425-15","pruefung":"Winter 2024/25","nr":15,"welt":"arbeit","thema":"Manteltarifvertrag","typ":"mc","situation":"Die Kreditbank AG ist an den Tarifverhandlungen der Bankenbranche beteiligt.","frage":"Was regeln die Tarifparteien typischerweise im Manteltarifvertrag?","optionen":["Höhe der Ausbildungsvergütung","Öffnungszeiten der Filialen der Kreditbank AG","Maßnahmen zum Gesundheitsschutz der Arbeitnehmer","Regeln für Firmenwagen der leitenden Angestellten","Regeln zur Dauer des Urlaubs"],"richtig":[4],"erklaerung":"Der Manteltarifvertrag regelt den Rahmen, der lange gilt: Wochenarbeitszeit, Urlaubstage, Bankfeiertage. Geld wie die Ausbildungsvergütung steht im Entgelttarifvertrag. Gesundheitsschutz regelt das Arbeitsschutzgesetz, Firmenwagen der Arbeitsvertrag. Merksatz: Mantel ist der Rahmen, Entgelt ist das Geld."},{"id":"W2425-16","pruefung":"Winter 2024/25","nr":16,"welt":"markt","thema":"Käufermarkt","typ":"mc","situation":"Auf dem Markt für Büroartikel kämpfen Firmen wie die Büroblitz GmbH um Marktanteile. E
